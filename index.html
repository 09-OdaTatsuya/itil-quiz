<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Salesforce Platform アプリケーションビルダー 模擬試験</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
    :root {
        --bg: #0f1117;
        --surface: #1a1d27;
        --surface2: #232736;
        --border: #2e3347;
        --text: #e6e8ee;
        --muted: #9aa3b2;
        --accent: #5b8af5;
        --accent2: #7c5bf5;
        --correct: #3dd68c;
        --wrong: #f55b5b;
    }

    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Noto Sans JP', -apple-system, sans-serif;
        line-height: 1.75;
        -webkit-font-smoothing: antialiased;
    }

    .wrap {
        max-width: 820px;
        margin: 0 auto;
        padding: 32px 20px 80px;
    }

    h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin: 0 0 4px;
    }

    .sub {
        color: var(--muted);
        font-size: .9rem;
        margin-bottom: 28px;
    }

    .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 18px;
        animation: fadeIn .35s ease;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(8px);
        }

        to {
            opacity: 1;
            transform: none;
        }
    }

    .modes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .mode-btn {
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 12px;
        padding: 18px 16px;
        cursor: pointer;
        text-align: left;
        transition: .15s;
        font-family: inherit;
    }

    .mode-btn:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
    }

    .mode-btn b {
        display: block;
        font-size: 1.05rem;
        margin-bottom: 4px;
    }

    .mode-btn span {
        color: var(--muted);
        font-size: .82rem;
    }

    .bar {
        height: 6px;
        background: var(--surface2);
        border-radius: 99px;
        overflow: hidden;
        margin-bottom: 18px;
    }

    .bar > i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        transition: width .3s;
    }

    .qmeta {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: .82rem;
        margin-bottom: 12px;
    }

    .mono {
        font-family: 'DM Mono', monospace;
    }

    .qtext {
        font-size: 1.05rem;
        font-weight: 500;
        white-space: pre-wrap;
        margin-bottom: 14px;
    }

    .multi {
        display: inline-block;
        background: rgba(124, 91, 245, .15);
        color: #b9a4ff;
        border: 1px solid rgba(124, 91, 245, .45);
        border-radius: 99px;
        padding: 3px 12px;
        font-size: .78rem;
        font-weight: 700;
        margin-bottom: 16px;
    }

    .choice {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 10px;
        cursor: pointer;
        font-family: inherit;
        font-size: .95rem;
        line-height: 1.65;
        transition: .12s;
    }

    .choice:hover:not(:disabled) {
        border-color: var(--accent);
    }

    .choice:disabled {
        cursor: default;
    }

    .choice .lab {
        display: inline-block;
        font-weight: 700;
        font-family: 'DM Mono', monospace;
        margin-right: 10px;
        color: var(--accent);
    }

    .choice.sel {
        border-color: var(--accent);
        background: rgba(91, 138, 245, .14);
    }

    .choice.correct {
        border-color: var(--correct);
        background: rgba(61, 214, 140, .12);
    }

    .choice.correct .lab {
        color: var(--correct);
    }

    .choice.wrong {
        border-color: var(--wrong);
        background: rgba(245, 91, 91, .12);
    }

    .choice.wrong .lab {
        color: var(--wrong);
    }

    .expl {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 18px;
        margin-top: 14px;
        animation: fadeIn .3s ease;
    }

    .expl h4 {
        margin: 0 0 10px;
        font-size: .85rem;
        color: var(--muted);
        letter-spacing: .04em;
    }

    .expl .row {
        font-size: .9rem;
        margin-bottom: 10px;
    }

    .expl .row:last-child {
        margin-bottom: 0;
    }

    .expl .row .lab {
        font-weight: 700;
        font-family: 'DM Mono', monospace;
        margin-right: 8px;
    }

    .expl .row.ok .lab {
        color: var(--correct);
    }

    .expl .row.ng {
        color: var(--muted);
    }

    .expl .row.ng .lab {
        color: var(--muted);
    }

    .verdict {
        font-weight: 700;
        margin-bottom: 12px;
        font-size: .95rem;
    }

    .verdict.ok {
        color: var(--correct);
    }

    .verdict.ng {
        color: var(--wrong);
    }

    .nav {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 20px;
    }

    .btn {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 12px 22px;
        font-size: .95rem;
        cursor: pointer;
        font-family: inherit;
        font-weight: 500;
        transition: .15s;
    }

    .btn:hover {
        filter: brightness(1.1);
    }

    .btn.ghost {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
    }

    .btn:disabled {
        opacity: .4;
        cursor: default;
    }

    .btn.full {
        width: 100%;
        margin-top: 4px;
    }

    .result {
        text-align: center;
    }

    .result .score {
        font-size: 3rem;
        font-weight: 700;
        font-family: 'DM Mono', monospace;
        margin: 8px 0;
    }

    .badge {
        display: inline-block;
        padding: 6px 18px;
        border-radius: 99px;
        font-weight: 700;
        font-size: 1rem;
        margin-bottom: 16px;
    }

    .badge.pass {
        background: rgba(61, 214, 140, .15);
        color: var(--correct);
    }

    .badge.fail {
        background: rgba(245, 91, 91, .15);
        color: var(--wrong);
    }

    .resume {
        background: rgba(91, 138, 245, .1);
        border: 1px solid var(--accent);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .resume span {
        font-size: .9rem;
    }

    .hide {
        display: none !important;
    }

    @media (max-width: 600px) {
        .wrap {
            padding: 24px 14px 60px;
        }

        .modes {
            grid-template-columns: 1fr;
        }

        h1 {
            font-size: 1.25rem;
        }

        .card {
            padding: 18px 16px;
        }
    }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Salesforce 認定 Platform アプリケーションビルダー 模擬試験</h1>
        <div class="sub">全100問・合格ライン70%　|　選択肢と出題順はランダム・解説つき</div>

        <div id="resume" class="resume hide">
            <span id="resumeText"></span>
            <div>
                <button class="btn" onclick="resumeQuiz()">再開する</button>
                <button class="btn ghost" onclick="discardResume()">最初から</button>
            </div>
        </div>

        <div id="home" class="card">
            <div class="modes">
                <button class="mode-btn" onclick="startQuiz('exam1')">
                    <b>模試1</b>
                    <span>第1問〜第50問</span>
                </button>
                <button class="mode-btn" onclick="startQuiz('exam2')">
                    <b>模試2</b>
                    <span>第51問〜第100問</span>
                </button>
                <button class="mode-btn" onclick="startQuiz('all')">
                    <b>全100問</b>
                    <span>全問通し</span>
                </button>
                <button class="mode-btn" onclick="startQuiz('random20')">
                    <b>ランダム20問</b>
                    <span>毎回ランダム抽出</span>
                </button>
            </div>
        </div>

        <div id="quiz" class="hide">
            <div class="bar">
                <i id="progBar" style="width:0%"></i>
            </div>
            <div class="card">
                <div class="qmeta">
                    <span class="mono" id="qnum"></span>
                    <span id="qmode"></span>
                </div>
                <div class="qtext" id="qtext"></div>
                <div id="multiTag"></div>
                <div id="choices"></div>
                <div id="commitWrap"></div>
                <div id="expl"></div>
                <div class="nav">
                    <button class="btn ghost" id="prevBtn" onclick="prevQ()">← 前へ</button>
                    <button class="btn" id="nextBtn" onclick="nextQ()">次へ →</button>
                </div>
            </div>
            <div style="text-align:center;margin-top:10px;">
                <button class="btn ghost" onclick="quitQuiz()">中断してトップへ</button>
            </div>
        </div>

        <div id="result" class="hide">
            <div class="card result">
                <div id="badge"></div>
                <div class="score" id="scoreText"></div>
                <div class="sub" id="scoreSub"></div>
                <div class="nav" style="justify-content:center;">
                    <button class="btn" onclick="reviewWrong()">間違えた問題を復習</button>
                    <button class="btn ghost" onclick="quitQuiz()">トップへ戻る</button>
                </div>
            </div>
        </div>

    </div>
    <script>
    const ALL_QUESTIONS = [
    {
        "n": 1,
        "t": "Cloud KicksのCFOは、新しい主要な小売店舗のリースに関する契約条件を、商談を成約する前に新しいベンダーが承認する方法を必要としています。この要件を満たすために使用すべき機能はどれですか？",
        "c": ["メールアラート", "動的アクション", "承認プロセス", "入力規則"],
        "a": [2],
        "e": ["メールアラートは、特定の条件が満たされたときに指定された受信者に自動的にメールを送信する機能です。ベンダーに通知を送ることはできますが、ベンダーからの承認を受け付けて記録する要件を満たすプロセスを構築することはできません。", "動的アクションは、レコードページでユーザーに表示するアクションボタンを条件に基づいて動的に表示または非表示にする機能です。外部のベンダーからの承認手順を管理するものではありません。", "正解です。承認プロセスは、特定のレコードが承認されるまでの手順を自動化する機能です。商談が成約フェーズに進む前に、指定したユーザー（この場合はベンダー）に契約の承認を要求し、その結果をシステムに記録するステップを構築できるため、この要件を満たす最適な機能です。", "入力規則は、ユーザーがレコードを保存する前に、入力されたデータが指定された基準を満たしているかを確認する機能です。データの整合性を保つためのものであり、他者からの承認を得るためのワークフローを管理する機能ではありません。"]
    },
    {
        "n": 2,
        "t": "Cloud Kicks (CK) は、取引先のレコードページで顧客のサポートレベルを追跡しています。関連する取引先がプラチナレベルの顧客である場合、CKはケースのレコードページにテキスト通知を表示したいと考えています。アプリケーションビルダーはこの要件をどのように満たすことができますか？",
        "c": ["ケースのLightningページをコピーします。新しいページにリッチテキストコンポーネントを追加し、このページをプラチナ取引先に割り当てます。", "ケースのLightningページにリッチテキストコンポーネントを追加し、取引先のサポートレベルがプラチナの場合に表示されるようにリッチテキストコンポーネントのコンポーネントの表示設定を行います。テキストのみのカスタムLightning Webコンポーネントを作成し、カスタムLightning Webコンポーネントをケースのページレイアウトにドラッグします。", "取引先のサポートレベルがプラチナの場合に表示されるように設定します。テキストのみのカスタムLightning Webコンポーネントを作成します。ケースのページレイアウトをコピーします。", "カスタムLightning Webコンポーネントをページにドラッグし、そのレイアウトをプラチナケースに割り当てます。"],
        "a": [1],
        "e": ["Lightningページはアプリケーション、レコードタイプ、またはプロファイルに基づいて割り当てられます。親レコードである取引先の特定の項目値（この場合はプラチナレベル）に直接基づいてページを割り当てることはできないため、この要件を満たすことはできません。", "正解です。標準のリッチテキストコンポーネントをLightningページに配置し、「コンポーネントの表示設定」機能を使用して、関連する取引先の項目値（サポートレベルがプラチナ）に基づく検索条件を追加するのが最も効率的な方法です。これにより、開発を行わずに要件を満たすことができます。", "単純なテキスト通知を表示するだけであれば、カスタムLightning Webコンポーネントというコード開発を行う必要はありません。標準機能であるリッチテキストコンポーネントで十分に対応可能です。", "選択肢Cと同様に、テキスト通知のためにカスタムLightning Webコンポーネントを使用するのは過剰な開発となります。また、ページレイアウトはレコードタイプとプロファイルに割り当てるものであり、特定のケースの項目値に直接割り当てることはできません。"]
    },
    {
        "n": 3,
        "t": "Universal Containersのデータ管理者は、取引先責任者レコードのデータ整合性の欠如について不満を述べています。営業担当者が地域項目に入力していません。データ管理者は、顧客状況項目で「高優先度」とマークされた取引先に関連付けられている取引先責任者についてのみ、地域項目を入力することを望んでいます。この要件を満たすために、アプリケーションビルダーは何ができますか？",
        "c": ["取引先に入力規則を作成する。", "取引先の顧客状況項目を必須にする。", "取引先責任者に入力規則を作成する。", "取引先責任者の地域項目を必須にする。"],
        "a": [2],
        "e": ["取引先に入力規則を作成しても、関連する取引先責任者の地域項目の入力を強制することはできません。この要件は取引先責任者レコードの保存時に評価される必要があります。", "取引先の顧客状況項目を必須にすることは、取引先レコードの保存条件を変更するだけであり、取引先責任者の地域項目を特定の条件下で入力させるという要件を満たすことはできません。", "正解です。取引先責任者オブジェクトに入力規則を作成し、親である取引先の顧客状況項目が「高優先度」であり、かつ取引先責任者の地域項目が空白である場合にエラーを表示させることで、この要件を正確に満たすことができます。", "取引先責任者の地域項目を項目レベルやページレイアウトで直接必須に設定すると、親の取引先の顧客状況に関係なく、すべての取引先責任者で地域項目が常に必須となってしまうため、要件を満たしません。"]
    },
    {
        "n": 4,
        "t": "Dreamhouse Realty (DR) には販売中の多くの物件があり、各物件レコードに関連するすべてのオファーレコードの最高値を特定したいと考えています。オブジェクト間に主従関係がある場合、DRのニーズを満たすためにアプリケーションビルダーはどのソリューションを使用するべきでしょうか？",
        "c": ["積み上げ集計項目", "サマリー", "ロングテキストエリア", "複数選択リスト", "リッチテキストエリア"],
        "a": [0],
        "e": ["正解です。積み上げ集計項目を使用すると、主従関係にある関連レコード（この場合はオファーレコード）の特定の項目の最大値、最小値、合計、またはレコード数を計算して、親レコード（物件レコード）に表示することができます。これにより、すべてのオファーの最高値を簡単に特定できます。", "サマリーはレポートなどの集計を指す一般的な言葉ですが、レコード上に自動的に関連レコードの最高値を計算して保持するカスタム項目のデータ型としては存在しません。", "ロングテキストエリアは大量の文字データを保存するための項目タイプであり、関連するレコードの数値を計算したり、最高値を特定したりする機能はありません。", "複数選択リストはユーザーが事前に定義されたリストから複数の値を選択できるようにする項目タイプであり、数値を集計したり比較したりするためのものではありません。", "リッチテキストエリアはフォーマットされたテキストや画像を追加するための項目タイプであり、関連レコードの数値を計算して最高値を特定する要件には適していません。"]
    },
    {
        "n": 5,
        "t": "Cloud Kicksで商談の完了予定日が60日以上遅延した場合、マネージャーと営業VPがその変更をレビューしたいと考えています。この要件を満たす2つのソリューションはどれですか？2つ選択してください。",
        "c": ["マネージャーと営業VPの全員一致の承認を必要とする承認プロセスを構築する。", "ユーザーが商談レコードを保存できないようにする入力規則を構築する。", "完了予定日が60日未満かどうかを計算する数式項目を作成し、メールアラートを送信する。", "レコードを承認プロセスに送信するフローを作成する。"],
        "a": [0, 3],
        "e": ["正解です。承認プロセスを使用することで、レコードの変更に対する承認者のステップを定義できます。マネージャーと営業VPの両方にレビューを求める要件に対して、全員一致の承認設定を行うことで適切なレビュープロセスを構築できます。", "入力規則は設定した条件に一致する際、レコードの保存をブロックしてエラーメッセージを表示する機能です。今回の要件は変更のレビューを行うことであり、変更自体を完全に禁止することではないため、要件に適していません。", "メールアラートは通知を送ることはできますが、関係者が変更をレビューして承認または却下するというシステム上のプロセスを管理することができないため不適切です。", "正解です。条件を満たした（完了予定日が60日以上遅延した）場合に、フローの機能を使用して自動的に商談レコードを承認プロセスに送信することができます。これにより要件に沿ったレビュープロセスが自動で開始されます。"]
    },
    {
        "n": 6,
        "t": "ある企業は、営業ユーザーが商談レコードに対して15%を超える割引が設定された商談商品を保存できないようにしたいと考えています。この要件を構成するにはどうすればよいですか？",
        "c": ["商談商品レコードの入力規則", "商談商品の更新によってトリガーされる承認プロセス", "商談レコードの入力規則", "商談レコードの大規模商談アラート"],
        "a": [0],
        "e": ["正解です。入力規則は、ユーザーがレコードを保存する前にデータが特定の基準を満たしているかを確認し、満たしていない場合はエラーを表示して保存をブロックする機能です。個々の商談商品の割引率を評価して保存を防ぐためには、商談商品オブジェクトに直接入力規則を作成する必要があります。", "承認プロセスはレコードの承認を他のユーザーに求める手順を自動化する機能であり、ユーザーが指定した条件でレコードを保存すること自体を即座にブロックするものではありません。", "割引率は個々の商談商品レベルで入力および設定される値です。商談オブジェクトに入力規則を作成しても、子レコードである個々の商談商品の項目値を直接評価して保存を防ぐことはできないため、要件を満たしません。", "大規模商談アラートは、商談が指定された金額や確度に達した際に自動的にメール通知を送信する機能です。データの保存を制限したりエラーを出したりする機能ではありません。"]
    },
    {
        "n": 7,

        "c": ["各組織は最大25個のカスタム外部ID項目を持つことができる。", "各オブジェクトは最大25個のカスタム外部ID項目を持つことができる。", "外部ID項目はURL項目にすることができる。", "外部ID項目は自動採番項目にすることができる。"],
        "a": [1, 3],
        "e": ["外部ID項目の上限数は組織全体ではなく、オブジェクト単位で設定されているため、この記述は誤りです。", "正解です。Salesforceの仕様として、1つのオブジェクトに対して最大25個のカスタム外部ID項目を作成することができます。これにより、複数の外部システムと効率的にデータを連携することが可能になります。", "外部IDとして設定できる項目のデータ型は、テキスト、数値、メール、および自動採番に限定されています。URL項目を外部IDに指定することはできません。", "正解です。外部IDとして利用できるデータ型には、テキスト、数値、メールのほかに自動採番項目も含まれます。これにより、システム間で一意の識別子を自動的に生成して管理するような要件に対応できます。"]
    },
    {
        "n": 98,
        "t": "Universal Containersは商談とDetailed_Sales__cというカスタムオブジェクトを利用しています。同社は、選択リストのステータスがActiveに設定されているDetailed_Sales__cレコードのみの販売指標を商談に積み上げ集計したいと考えています。アプリケーションビルダーがこの要求を達成するための推奨される方法は何ですか？",
        "c": ["適切な条件で販売額を積み上げ集計できるサードパーティ製アプリケーションをAppExchangeを利用してダウンロードする。", "Apexコードを利用して希望する金額を積み上げ集計する。", "親オブジェクトと子オブジェクトの間に主従関係を作成し、ステータス項目で絞り込む積み上げ集計項目を作成する。", "親オブジェクトと子オブジェクトの間に参照関係を作成し、ステータス項目で絞り込む積み上げ集計項目を作成する。"],
        "a": [2],
        "e": ["サードパーティ製アプリケーションを使用することで要件を満たすことは可能かもしれませんが、Salesforceの標準機能で容易に実現できる要件であるため、外部アプリケーションを導入することはベストプラクティスとして推奨されません。", "Apexコードを記述してカスタムの集計処理を実装することは可能ですが、Salesforceではコーディングの前に標準機能を利用することが推奨されます。この要件は標準機能で完全に実現できるため、Apexを使用する必要はありません。", "正解です。親オブジェクト（商談）と子オブジェクトの間に主従関係を作成することで、親オブジェクトに積み上げ集計項目を作成できるようになります。積み上げ集計項目の設定内でフィルタ条件を指定できるため、ステータスがActiveのレコードのみを計算対象に含めることができ、要件を満たすことができます。", "参照関係を構築した場合、標準機能の積み上げ集計項目を作成することはできません。積み上げ集計項目を利用するには、オブジェクト間が主従関係である必要があります。"]
    },
    {
        "n": 99,
        "t": "Universal Containers (UC) は、Sales_Organization__cとPricing_Tier__cという2つのカスタム選択リスト項目を使用しています。Sales_Organization__cの値がCanadaである顧客に対して、Pricing_Tier__cが必須であることを保証するために、アプリケーションビルダーはどの入力規則を使用するべきでしょうか？",
        "c": ["AND (ISPICKVAL (Sales_Organization__c, 'Canada'), ISBLANK (TEXT (Pricing_Tier__c)))", "IF (ISNULL(Sales_Organization__c='Canada'), ISBLANK (TEXT (Pricing_Tier__c)), TRUE)", "ISPICKVAL (Sales_Organization__c, 'Canada') && ISNULL (Pricing_Tier__c)", "OR (ISPICKVAL (Sales_Organization__c, 'Canada'), ISBLANK (TEXT (Pricing_Tier__c)))"],
        "a": [0],
        "e": ["正解です。入力規則は数式がTrue（真）と評価された場合にエラーメッセージを表示します。この数式は、Sales_Organization__cがCanadaであり、かつ（AND）、Pricing_Tier__cが空白である場合にTrueを返すため、条件に一致する場合にエラーを出して入力を必須にさせるという要件を正確に満たします。選択リスト項目が空白かどうかを確認するには、TEXT関数でテキスト値に変換してからISBLANKを使用するのが正しい構文です。", "IF関数は入力規則の数式としては冗長です。また、ISNULL関数の中に比較式（='Canada'）を含める記述は構文として誤っており、適切に機能しません。", "ISNULL関数はテキスト項目や選択リスト項目の空白チェックには推奨されていません。選択リスト項目が空白かどうかを検証するには、ISBLANK(TEXT(項目名))を使用するか、ISPICKVAL(項目名, '')を使用する必要があります。", "OR関数を使用すると、「Sales_Organization__cがCanadaである」または「Pricing_Tier__cが空白である」のいずれか一方が満たされただけで常にエラーになってしまいます。これでは特定の条件下のみで必須にするという要件を満たすことができません。"]
    },
    {
        "n": 100,
        "t": "Ursa Major Solar (UMS) は新しい従業員の採用を計画しています。UMSは、求職者 (Job_Candidate__c) が複数の求人ポジション (Open_Position__c) に応募できるようにし、求職者のレコード上で応募 (Application__c) を表示できるようにしたいと考えています。また、特定の求人ポジションに対するすべての応募を表示したいとも考えています。これらの要件を満たすために、アプリケーションビルダーは何を推奨するべきですか？2つ選択してください。",
        "c": ["ApplicationにOpen_Positionへの主従関係項目を作成する", "ApplicationにJob_Candidateへの主従関係項目を作成する", "Open_PositionにApplicationへの主従関係を作成する", "Job_CandidateにApplicationへの主従関係項目を作成する"],
        "a": [0, 1],
        "e": ["正解です。求職者と求人ポジションの間に多対多の関係を構築するためには、Application（応募）を連結オブジェクトとして使用します。そのためには、子オブジェクトであるApplication側に、親オブジェクトであるOpen_Positionを参照する主従関係項目を作成する必要があります。これにより、求人ポジションのレコードに関連リストとして応募を表示できます。", "正解です。Aの選択肢と同様に、もう一つの親オブジェクトであるJob_Candidateに対しても、子オブジェクトであるApplication側に主従関係項目を作成する必要があります。これら2つの主従関係項目を作成することで、Applicationが正しく連結オブジェクトとして機能し、求職者のレコードにも関連リストとして応募を表示できるようになります。", "主従関係項目は、常に従となる子オブジェクト（この場合はApplication）側に作成する必要があります。主となるOpen_Position側に作成してしまうと、リレーションの方向が逆になってしまい、要件を満たす多対多のデータモデルを構築できません。", "Cの選択肢と同じ理由で、主従関係項目は子オブジェクト側に作成する必要があります。主となるJob_Candidate側に作成してしまうと、適切な関連リストの表示や多対多の関係構築ができません。"]
    }
    ];
    const LABELS = ['A', 'B', 'C', 'D', 'E'];
    const KEY = 'abQuizState_v1';
    const PASS = 70;
    const MODE_LABEL = {
        exam1: '模試1',
        exam2: '模試2',
        all: '全100問',
        random20: 'ランダム20問',
        review: '復習'
    };
    let state = null;
    function shuffle(a) {
        a = a.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            var t = a[i];
            a[i] = a[j];
            a[j] = t;
        }
        return a;
    }
    function order(n) {
        const r = [];
        for (let i = 0; i < n; i++)
            r.push(i);
        return shuffle(r);
    }
    function mkItem(qi) {
        return {
            qi: qi,
            co: order(ALL_QUESTIONS[qi].c.length),
            sel: [],
            picked: null
        };
    }
    function buildItems(mode) {
        let idx;
        if (mode === 'exam1')
            idx = ALL_QUESTIONS.map(function(q, i) {
                return i;
            }).slice(0, 50);
        else if (mode === 'exam2')
            idx = ALL_QUESTIONS.map(function(q, i) {
                return i;
            }).slice(50);
        else if (mode === 'random20')
            idx = shuffle(ALL_QUESTIONS.map(function(q, i) {
                return i;
            })).slice(0, 20);
        else
            idx = ALL_QUESTIONS.map(function(q, i) {
                return i;
            });
        const ord = (mode === 'random20') ? idx : shuffle(idx);
        return ord.map(mkItem);
    }
    function startQuiz(mode) {
        state = {
            mode: mode,
            items: buildItems(mode),
            cur: 0
        };
        save();
        show('quiz');
        render();
        window.scrollTo(0, 0);
    }
    function show(v) {
        document.getElementById('home').classList.toggle('hide', v !== 'home');
        document.getElementById('quiz').classList.toggle('hide', v !== 'quiz');
        document.getElementById('result').classList.toggle('hide', v !== 'result');
    }
    // 表示上の位置の配列を、元の選択肢の添字の配列に直す
    function toOrig(it, ps) {
        return ps.map(function(p) {
            return it.co[p];
        }).sort(function(a, b) {
            return a - b;
        });
    }
    function isRight(it) {
        const q = ALL_QUESTIONS[it.qi];
        if (it.picked === null)
            return false;
        const got = toOrig(it, it.picked);
        const want = q.a.slice().sort(function(a, b) {
            return a - b;
        });
        return got.length === want.length && got.every(function(v, i) {
                return v === want[i];
            });
    }
    function render() {
        const it = state.items[state.cur];
        const q = ALL_QUESTIONS[it.qi];
        const need = q.a.length;
        document.getElementById('progBar').style.width = (state.cur / state.items.length * 100) + '%';
        document.getElementById('qnum').textContent = 'Q ' + (state.cur + 1) + ' / ' + state.items.length;
        document.getElementById('qmode').textContent = MODE_LABEL[state.mode] || '';
        document.getElementById('qtext').textContent = q.t;
        document.getElementById('multiTag').innerHTML = (need > 1) ? '<div class="multi">' + need + 'つ選択</div>' : '';
        const cc = document.getElementById('choices');
        cc.innerHTML = '';
        it.co.forEach(function(orig, p) {
            const b = document.createElement('button');
            b.className = 'choice';
            b.innerHTML = '<span class="lab">' + LABELS[p] + '</span>' + esc(q.c[orig]);
            if (it.picked !== null) {
                b.disabled = true;
                if (q.a.indexOf(orig) >= 0)
                    b.classList.add('correct');
                else if (it.picked.indexOf(p) >= 0)
                    b.classList.add('wrong');
            } else {
                if (it.sel.indexOf(p) >= 0)
                    b.classList.add('sel');
                b.onclick = function() {
                    pick(p);
                };
            }
            cc.appendChild(b);
        });
        // 複数回答のときだけ確定ボタンを出す
        const cw = document.getElementById('commitWrap');
        if (it.picked === null && need > 1) {
            const ok = it.sel.length === need;
            cw.innerHTML = '<button class="btn full" id="commitBtn"' + (ok ? '' : ' disabled') + '>解答する（' + it.sel.length + '/' + need + '）</button>';
            if (ok)
                document.getElementById('commitBtn').onclick = commit;
        } else {
            cw.innerHTML = '';
        }
        const ex = document.getElementById('expl');
        if (it.picked !== null) {
            const right = isRight(it);
            let h = '<div class="expl"><div class="verdict ' + (right ? 'ok' : 'ng') + '">' + (right ? '正解' : '不正解') + '</div><h4>解説</h4>';
            it.co.forEach(function(orig, p) {
                const ok = (q.a.indexOf(orig) >= 0);
                h += '<div class="row ' + (ok ? 'ok' : 'ng') + '"><span class="lab">' + LABELS[p] + '.</span>' + esc(q.e[orig]) + '</div>';
            });
            h += '</div>';
            ex.innerHTML = h;
        } else {
            ex.innerHTML = '';
        }
        document.getElementById('prevBtn').disabled = state.cur === 0;
        const nb = document.getElementById('nextBtn');
        nb.textContent = (state.cur === state.items.length - 1) ? '結果を見る' : '次へ →';
        nb.disabled = it.picked === null;
    }
    function pick(p) {
        const it = state.items[state.cur];
        if (it.picked !== null)
            return;
        const need = ALL_QUESTIONS[it.qi].a.length;
        if (need === 1) {
            it.picked = [p];
        }
        else {
            const i = it.sel.indexOf(p);
            if (i >= 0)
                it.sel.splice(i, 1);
            else if (it.sel.length < need)
                it.sel.push(p);
        }
        save();
        render();
    }
    function commit() {
        const it = state.items[state.cur];
        if (it.picked !== null)
            return;
        it.picked = it.sel.slice();
        save();
        render();
    }
    function nextQ() {
        if (state.cur < state.items.length - 1) {
            state.cur++;
            render();
            window.scrollTo(0, 0);
        } else {
            finish();
            window.scrollTo(0, 0);
        }
    }
    function prevQ() {
        if (state.cur > 0) {
            state.cur--;
            render();
            window.scrollTo(0, 0);
        }
    }
    function finish() {
        let correct = 0;
        state.items.forEach(function(it) {
            if (isRight(it))
                correct++;
        });
        const total = state.items.length;
        const pct = Math.round(correct / total * 100);
        const pass = pct >= PASS;
        document.getElementById('badge').innerHTML = '<span class="badge ' + (pass ? 'pass' : 'fail') + '">' + (pass ? '合格' : '不合格') + '</span>';
        document.getElementById('scoreText').textContent = pct + '%';
        document.getElementById('scoreSub').textContent = total + '問中 ' + correct + '問正解（合格ライン' + PASS + '%）';
        state.done = true;
        save();
        show('result');
    }
    function reviewWrong() {
        const wrong = state.items.filter(function(it) {
            return !isRight(it);
        });
        if (wrong.length === 0) {
            alert('全問正解です！復習する問題はありません。');
            return;
        }
        state = {
            mode: 'review',
            items: wrong.map(function(it) {
                return mkItem(it.qi);
            }),
            cur: 0
        };
        save();
        show('quiz');
        render();
        window.scrollTo(0, 0);
    }
    function quitQuiz() {
        clearS();
        state = null;
        show('home');
        checkResume();
    }
    function save() {
        try {
            localStorage.setItem(KEY, JSON.stringify(state));
        } catch (e) {}
    }
    function clearS() {
        try {
            localStorage.removeItem(KEY);
        } catch (e) {}
    }
    function loadS() {
        try {
            return JSON.parse(localStorage.getItem(KEY));
        } catch (e) {
            return null;
        }
    }
    function checkResume() {
        const s = loadS();
        const box = document.getElementById('resume');
        if (s && s.items && !s.done) {
            const answered = s.items.filter(function(it) {
                return it.picked !== null;
            }).length;
            document.getElementById('resumeText').textContent = '中断中の' + (MODE_LABEL[s.mode] || '') + 'があります（' + answered + '/' + s.items.length + '問回答済み）';
            box.classList.remove('hide');
        } else {
            box.classList.add('hide');
        }
    }
    function resumeQuiz() {
        const s = loadS();
        if (s) {
            state = s;
            state.items.forEach(function(it) {
                if (!it.sel)
                    it.sel = [];
            });
            document.getElementById('resume').classList.add('hide');
            if (s.done) {
                finish();
            } else {
                show('quiz');
                render();
            }
            window.scrollTo(0, 0);
        }
    }
    function discardResume() {
        clearS();
        document.getElementById('resume').classList.add('hide');
    }
    function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    checkResume();
    </script>
