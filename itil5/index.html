<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ITIL 5 模擬試験（日本語βテスト）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#232736;--border:#2e3347;--text:#e6e8ee;--muted:#9aa3b2;--accent:#5b8af5;--accent2:#7c5bf5;--correct:#3dd68c;--wrong:#f55b5b;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',-apple-system,sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased;}
.wrap{max-width:820px;margin:0 auto;padding:32px 20px 80px;}
h1{font-size:1.5rem;font-weight:700;margin:0 0 4px;}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:28px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:18px;animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.mode-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:18px 16px;cursor:pointer;text-align:left;transition:.15s;font-family:inherit;}
.mode-btn:hover{border-color:var(--accent);transform:translateY(-2px);}
.mode-btn b{display:block;font-size:1.05rem;margin-bottom:4px;}
.mode-btn span{color:var(--muted);font-size:.82rem;}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:18px;}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s;}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:.82rem;margin-bottom:12px;}
.mono{font-family:'DM Mono',monospace;}
.qtext{font-size:1.05rem;font-weight:500;white-space:pre-wrap;margin-bottom:20px;}
.choice{display:block;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;font-family:inherit;font-size:.97rem;transition:.15s;}
.choice:hover:not(:disabled){border-color:var(--accent);}
.choice:disabled{cursor:default;}
.choice .lab{display:inline-block;font-weight:700;font-family:'DM Mono',monospace;margin-right:10px;color:var(--accent);}
.choice.correct{border-color:var(--correct);background:rgba(61,214,140,.12);}
.choice.correct .lab{color:var(--correct);}
.choice.wrong{border-color:var(--wrong);background:rgba(245,91,91,.12);}
.choice.wrong .lab{color:var(--wrong);}
.expl{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-top:14px;animation:fadeIn .3s ease;}
.expl h4{margin:0 0 10px;font-size:.85rem;color:var(--muted);letter-spacing:.04em;}
.expl .row{font-size:.9rem;margin-bottom:10px;}
.expl .row:last-child{margin-bottom:0;}
.expl .row .lab{font-weight:700;font-family:'DM Mono',monospace;margin-right:8px;}
.expl .row.ok .lab{color:var(--correct);}
.expl .row.ng{color:var(--muted);}
.expl .row.ng .lab{color:var(--muted);}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px;}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 22px;font-size:.95rem;cursor:pointer;font-family:inherit;font-weight:500;transition:.15s;}
.btn:hover{filter:brightness(1.1);}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn:disabled{opacity:.4;cursor:default;}
.result{text-align:center;}
.result .score{font-size:3rem;font-weight:700;font-family:'DM Mono',monospace;margin:8px 0;}
.badge{display:inline-block;padding:6px 18px;border-radius:99px;font-weight:700;font-size:1rem;margin-bottom:16px;}
.badge.pass{background:rgba(61,214,140,.15);color:var(--correct);}
.badge.fail{background:rgba(245,91,91,.15);color:var(--wrong);}
.resume{background:rgba(91,138,245,.1);border:1px solid var(--accent);border-radius:12px;padding:14px 16px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.resume span{font-size:.9rem;}
.hide{display:none!important;}
@media(max-width:600px){.wrap{padding:24px 14px 60px;}.modes{grid-template-columns:1fr;}h1{font-size:1.25rem;}}
.gp{display:none;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 18px 24px;animation:fadeIn .25s ease;}
.gh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.gtl{font-weight:700;font-size:1.05rem;}
.gbk{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:.85rem;cursor:pointer;font-family:inherit;}
.gbk:hover{border-color:var(--accent);}
.gs{width:100%;box-sizing:border-box;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:.95rem;font-family:inherit;margin-bottom:6px;}
.gs:focus{outline:none;border-color:var(--accent);}
.gcount{font-size:.8rem;color:var(--muted);margin-bottom:12px;}
.gl{max-height:60vh;overflow-y:auto;}
.gi{border-bottom:1px solid var(--border);padding:12px 4px;}
.gi:last-child{border-bottom:none;}
.gt{font-weight:700;font-size:.95rem;margin-bottom:4px;}
.ge{color:var(--accent2);font-family:'DM Mono',monospace;font-size:.8rem;margin-left:8px;font-weight:400;}
.gd{color:var(--muted);font-size:.88rem;line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
<h1>ITIL 5 模擬試験（日本語βテスト）</h1>
<div class="sub">全80問・4択・合格ライン70%　|　選択肢と出題順はランダム・解説つき（41〜80問は暫定解説）</div>

<div id="resume" class="resume hide">
<span id="resumeText"></span>
<div><button class="btn" onclick="resumeQuiz()">再開する</button> <button class="btn ghost" onclick="discardResume()">最初から</button></div>
</div>

<div id="home" class="card">
<div class="modes">
<button class="mode-btn" onclick="startQuiz('exam1')"><b>模試1</b><span>第1問〜第40問</span></button>
<button class="mode-btn" onclick="startQuiz('exam2')"><b>模試2</b><span>第41問〜第80問</span></button>
<button class="mode-btn" onclick="startQuiz('all')"><b>全80問</b><span>全問通し</span></button>
<button class="mode-btn" onclick="startQuiz('random20')"><b>ランダム20問</b><span>毎回ランダム抽出</span></button>
<button class="mode-btn" onclick="toggleGlossary()" style="border-color:var(--accent2)"><b>📖 用語集</b><span>ITIL 5 公式用語 409語</span></button>
</div>
</div>

<div class="gp" id="glossaryPanel">
<div class="gh"><div class="gtl">📖 ITIL 5 用語集</div><button class="gbk" onclick="toggleGlossary()">← モード選択に戻る</button></div>
<input class="gs" id="glossarySearch" placeholder="用語・英語・定義を検索..." oninput="filterGlossary(this.value)">
<div class="gcount" id="glossaryCount"></div>
<div class="gl" id="glossaryList"></div>
</div>
<div id="quiz" class="hide">
<div class="bar"><i id="progBar" style="width:0%"></i></div>
<div class="card">
<div class="qmeta"><span class="mono" id="qnum"></span><span id="qmode"></span></div>
<div class="qtext" id="qtext"></div>
<div id="choices"></div>
<div id="expl"></div>
<div class="nav">
<button class="btn ghost" id="prevBtn" onclick="prevQ()">← 前へ</button>
<button class="btn" id="nextBtn" onclick="nextQ()">次へ →</button>
</div>
</div>
<div style="text-align:center;margin-top:10px;"><button class="btn ghost" onclick="quitQuiz()">中断してトップへ</button></div>
</div>

<div id="result" class="hide"><div class="card result">
<div id="badge"></div>
<div class="score" id="scoreText"></div>
<div class="sub" id="scoreSub"></div>
<div class="nav" style="justify-content:center;">
<button class="btn" onclick="reviewWrong()">間違えた問題を復習</button>
<button class="btn ghost" onclick="quitQuiz()">トップへ戻る</button>
</div>
</div></div>

</div>
<script>
const ALL_QUESTIONS=[
{n:1,s:"1.1.4",t:"どのアウトプットが、ITIL プロダクトおよびサービスライフサイクルの目的を最も適切に反映していますか？",c:["すべてのプロダクトに対して従うべき一連の活動の固定された順序を定義するため","プロダクトマネジメントの活動をサービスマネジメントの活動から切り離すため","共有のライフサイクル管理活動全体にわたって、プロダクトとサービスの包括的管理をサポートするため","プロダクトが構築された後にサービスがどのように移行され運用されるかを説明するため"],a:2,e:["不正解。ライフサイクルは、すべてのプロダクトに対して従うべき固定された順序を定義しているわけではありません。「バリューチェーン：あらかじめ決められた青写真ではなく、実際に実行される一連の活動の順序である」（参照先 11.4）","不正解。ライフサイクルモデルは、プロダクトとサービスマネジメントを分離するのではなく統合しています。「ITIL は、デジタルプロダクトおよびサービス向けのエンドツーエンドのライフサイクルモデルを提供しており、そこでデジタルプロダクトおよびサービスの概念は統合されています」（参照先 1.2）","正解。役割やオペレーティングモデル全体で共通のステージを適用し、プロダクトおよびサービスマネジメントの統合的なライフサイクル管理をサポートする統合ライフサイクルモデルの説明です。「ITIL プロダクトおよびサービスライフサイクルと8つのステージ。ライフサイクル全体を通じてデジタルプロダクトおよびサービス、[…]組織のサービス関係における役割」を管理するためです（参照先 2.1.2）","不正解。ライフサイクルには、デジタルプロダクトとデジタルサービスの双方に対するエンドツーエンドの管理が含まれ、プロダクトが構築された後の移行および運用活動の記述に限定されません。「デジタルプロダクトマネジメント[…]とデジタルサービスマネジメント[…]の両方が、顧客に持続的な価値を提供するために必要です」（参照先 2.1）"]},
{n:2,s:"1.1.1",t:"デジタルプロダクトとデジタルサービスの概念的な違いを最も適切に表している記述はどれですか。",c:["デジタルプロダクトは能力を提供し、デジタルサービスはそれらの能力の利用を通じて価値の実現を可能にする","デジタルプロダクトは価値を顧客に直接提供し、一方でデジタルサービスは社内業務を支援する","デジタルプロダクトは顧客の成果を定義し、デジタルサービスはデジタルプロダクトベンダーの技術リソースを定義する","デジタルプロダクトとデジタルサービスは、同じ概念を指す別の呼び方"],a:0,e:["正解。デジタルプロダクトは機能を提供する組織的なリソースを組み合わせたものであり、デジタルサービスはその機能が価値を実現するためにどのように利用され消費されるかを示します。「プロダクトは機能を提供し、一方でサービス提供物は、顧客に提供し得る潜在的な価値を説明します。顧客がこれらの提供物を受け入れると、サービスの提供と消費が開始されます」（参照先 2.1.1）","不正解。価値は、単にプロダクトが存在しているだけではなく、サービス消費を通じて実現されます。またデジタルサービスは社内 IT に限定されません（参照先 2.1.1）","不正解。デジタルプロダクトはリソースの組み合わせとして定義され、サービスは消費者が成果と価値を体験する場です。デジタルプロダクトとは「[…]デジタルテクノロジーに基づいて消費者に価値を提供するように設計された組織のリソースの組み合わせである」（参照先 2.1）","不正解。デジタルプロダクトとデジタルサービスは、価値の創出において異なる役割を持つ別個の概念です。デジタルサービスとは「デジタルプロダクトに完全または大部分依存するサービス」です（参照先 2.1）"]},
{n:3,s:"1.1.6",t:"組織のバリューチェーン活動は、どのように ITIL プロダクトおよびサービスライフサイクルをサポートしますか？",c:["プロダクトおよびサービスの意思決定をコントロールするガバナンス構造を定義することによって","価値を創出し提供するライフサイクル管理活動のパフォーマンスを可能にすることによって","ライフサイクルの各段階を運用上のプロセス実行と直接連携させることによって","プロダクトおよびサービスの活動を固定された直線的なプロセスに順序立てることによって"],a:1,e:["不正解。ガバナンスは意思決定に影響を与え制約しますが、バリューチェーンはガバナンス構造として定義されてはいません。「正式なガバナンス構造は、部門横断的な整合性、説明責任、そして意思決定のための余力を支えます」（参照先 5.4.1）","正解。バリューチェーンはガバナンス層でもライフサイクル段階の代替物でもなく、価値創造を可能にするためにライフサイクル管理活動が実行される仕組みです。バリューチェーンとは「プロダクトまたはサービス提供を通じて価値を実現する、一連の活動全体」（参照先 用語集）","不正解。バリューチェーンは、ライフサイクルの各段階を単なる運用プロセスの実行に還元するものではありません。運用の実行はライフサイクルの一部にすぎず、各段階を運用プロセスに直接対応させると、ライフサイクル全体で求められる広範な管理能力や価値創出を可能にする活動が軽視されてしまいます（参照先 2.1.2）","不正解。バリューチェーン活動は、固定された線形のプロセスとして順序付けられているわけではありません。バリューストリームの一部として組み合わせられ調整され、あらかじめ決められた構造ではなく実際に行われる活動の順序を反映します（参照先 11.4）"]},
{n:4,s:"1.2.1",t:"プロダクトおよびサービスライフサイクルにおける「発見」活動の焦点を最も適切に説明しているものはどれですか。",c:["プロダクトおよびサービスライフサイクルの開始時に一度だけ実施される","組織的およびポートフォリオレベルの分析のみに専念している","「設計」および「構築」活動を、ソリューションを早期に検証することで置き換える","ロードマップ、バックログ、および改善イニシアチブに反映させるために、プロダクトレベルで反復的に実施される"],a:3,e:["不正解。「発見」活動は、ライフサイクルの最初に一度だけ実施されるものではなく、継続的かつ反復的であると明示的に説明されています（参照先 3.1.2）","不正解。「発見」は組織的なレベルやポートフォリオレベルでも実施できますが、それらに限定されません。「発見」活動は「組織的なレベル[…]ポートフォリオレベル[…]プロダクトレベル」の3つのレベルで実施されます（参照先 3.1）","不正解。「発見」活動は、その後のライフサイクル段階の枠組みを定めて情報を与えるものですが、それらを置き換えるものではありません（参照先 3.1.2）","正解。プロダクトレベルにおける「発見」活動の焦点は、プロダクトの能力および関連するサービス提供物を、サービス消費者のニーズおよび組織の戦略と継続的かつ確実に整合させることであり、その結果がロードマップ、バックログ、改善イニシアチブに反映されます（参照先 3.1.1）"]},
{n:5,s:"1.2.2",t:"次のうち、プロダクトおよびサービスライフサイクル全体で見た場合の「設計」活動の焦点を、最も適切に表しているものはどれですか？",c:["顧客のニーズを定義し、機会の優先順位付けを行う","プロダクトに適用され、関連するサービスのインタラクションには適用されない","ソリューションを構築、運用、提供し、効果的にサポートできるように設計することが含まれる","ソリューションを効果的に開発・展開・監視できるように、実施タスクを定義することが含まれる"],a:2,e:["不正解。顧客ニーズを定義し、機会に優先順位を付けることは「設計」ではなく「発見」の目的です（参照先 3.1.1）","不正解。デジタルプロダクト設計は、将来のサービスにおけるインタラクションやサービス体験の設計を常に含むべきであり、ゆえに「デジタルプロダクトおよびサービス設計」になります（参照先 4.1）","正解。「設計」活動の目的は、利用者にとって価値があり望ましいだけでなく、組織にとって運用可能で、サポートしやすく、持続可能なプロダクトを設計することです（参照先 4.1.1）","不正解。実施タスクの定義は、本来「設計」ではなく「構築」と「移行」に属します。「設計」は実行タスク一覧ではなく、仕様書やプロトタイプを作成します（参照先 4.2）"]},
{n:6,s:"1.2.3",t:"プロダクトチームが、新たな機能を承認しました。この機能には、追加のクラウドキャパシティとスペシャリストスキルが必要です。「取得」活動の正しい適用を最もよく反映している活動はどれですか？",c:["新しい機能を反映するようにプロダクトバックログを更新する","実施を可能にするために必要なリソースを確保し、割り当てる","新しいキャパシティを効率的に活用するための技術的なソリューションを設計する","稼働環境に機能をデプロイし設定して利用できるようにする"],a:1,e:["不正解。バックログの更新は、リソースの取得ではなく、計画と優先度付けの一部です。「精査されたプロダクトバックログと更新されたロードマップ[…]」は「発見」の主なアウトプットです（参照先 3.2.2）","正解。「取得」活動は、承認された設計やバックログ項目をライフサイクル全体で実装できるように、必要なリソースを効率的に確保・配分し、プロダクトおよびサービスの持続可能性・スケーラビリティを確保することに関するものです（参照先 5.1.1）","不正解。リソースの使い方を設計することは「取得」ではなく「設計」の活動に属します（参照先 4.1.1）","不正解。機能のデプロイは「取得」ではなく「移行」に含まれます（参照先 7.1.1）"]},
{n:7,s:"10.2.1",t:"ITIL AI 能力モデルの主要な目的は何ですか？",c:["AI 能力をプロダクトおよびサービスマネジメントで使用されるものとして分類するため","サービスプロバイダー全体で AI ガバナンスの成熟度レベルを定義するため","規制の対象となる産業における AI デプロイのための必須管理策を規定するため","デジタルサービスにおける AI 活用からの財務的リターンを測定するため"],a:0,e:["正解。このモデルは、サービスマネジメントの文脈において AI が果たす役割に基づいて、その機能を分類することを目的としています。「このモデルは、AI ソリューションを機能別に分類します」（参照先 1.4）","不正解。ITIL AI 能力モデルは成熟度レベルを定義しておらず、機能カテゴリーを定義します（参照先 1.4）","不正解。ガバナンスは AI 採用に関連して求められますが、ITIL AI 能力モデル自体は必須の管理策を規定してはいません（参照先 1.4）","不正解。このモデルは金銭的なリターンを測定しません。その目的は、機能面での理解と分類です（参照先 1.4）"]},
{n:8,s:"2.2.1",t:"「発見」活動の反復が完了した際のアウトプットとして、最も関連性が高いものはどれですか？",c:["デプロイ済みのプロダクト機能と更新されたサービスカタログ項目","テスト済みのソリューションコンポーネントおよび技術文書化","運用パフォーマンスレポートとインシデント傾向","更新されたプロダクトロードマップおよび精緻化されたバックログ項目"],a:3,e:["不正解。デプロイ済みの機能やサービスカタログの項目は「発見」のアウトプットではなく、ソリューションが構築され移行された後に発生します。「ターゲットとなる稼働環境へデプロイされ、運用準備が整ったプロダクト・サービス・リソース」（参照先 7.1 表 7.1）","不正解。ソリューションコンポーネントのテストは「構築」の一部であり、その主なアウトプットは「構築およびテスト済みのプロダクトソリューション」です（参照先 6.1 表 6.1）","不正解。運用パフォーマンスデータとインシデントの傾向は「運用」の段階で生成されます。「プロダクトとサービスの運用。プロダクトパフォーマンスの記録およびレポート」（参照先 8.1 表 8.1）","正解。「発見」活動は、その反復の終わりに更新されたプロダクトロードマップと精緻化されたバックログを作成します。主なアウトプットには「精緻化されたバックログ、更新されたプロダクトロードマップ、継続的改善の取り組み、活動から得られた知見に関するレポートおよび文書化」が含まれます（参照先 3.2.2）"]},
{n:9,s:"2.2.2",t:"【ITIL レンタカーシナリオ】ICR の統合モバイルアプリにおける「発見」の開始時点で、マリアは国ごとの規制の違い、レンタカー、カーシェアリング、自動運転サービス全体にわたる顧客期待、そしてライドシェアリングプラットフォームからの競合の圧力に関する情報を収集します。どの活動が、さらに「発見」を進める前に「プロダクト状況を評価する」というステップを最も正しく適用していることを示していますか？",c:["この情報を統合し、制約、推進要因、そしてプロダクトを形作る機会を把握する","モバイル適用向けの詳細なソリューション設計に情報を落とし込む","得られた情報を基にプラットフォーム、ツール、テクノロジーサービスを選定する","さまざまな市場向けのロールアウト戦略を計画するために情報を適用する"],a:0,e:["正解。プロダクト状況を評価するとは、問題や解決策を定義する前に、制約、推進要因、機会を理解するために、規制、市場環境、ユーザーの期待などの外部要因と内部要因を統合して把握することを意味します。「『発見』は、現在の環境のアセスメントから始まります」（参照先 3.2.1.1）","不正解。調査結果を詳細な設計に落とし込む作業は「設計」活動に属し、状況と問題が理解された後に実施されます（参照先 4.1 表 4.1）","不正解。プラットフォームやサービスの選定は取得の意思決定の一部であり、発見におけるプロダクト状況の評価の成果ではありません（参照先 5.1.1）","不正解。ロールアウト戦略の計画は「移行」活動に関連するものであり、「発見」におけるプロダクト状況の評価とは関係ありません（参照先 7.1.1）"]},
{n:10,s:"2.3.1",t:"「発見」活動が価値創出を効果的に実現していることを最もよく示す指標はどれですか？",c:["四半期ごとの正常にデプロイされたリリース数","インシデント後のサービス復旧平均時間","達成された自動テストのカバレッジの割合","戦略的整合性と商業的な製品の実現可能性"],a:3,e:["不正解。デプロイ頻度は「構築」と「移行」の活動に関連する指標であり、「発見」には関連しません。「移行サイクル（適時性と期間）」（参照先 7.1 表 7.1）","不正解。サービス復旧までの平均時間は「サポート」「運用」の指標であり、「発見」の指標ではありません（参照先 10.1 表 10.1）","不正解。自動テストのカバレッジは「構築」とテストに関係し、「発見」には関係しません。「プロダクトソリューションの品質」（参照先 6.1 表 6.1）","正解。「発見」活動の目的は、プロダクトおよび関連するサービスの提供が、戦略的な整合性を保ち、市場において有用であり、商業的に実行可能であり続けることを確実にすることです。主要指標は「戦略的適合度。市場における妥当性。利害関係者の満足度。プロダクトの商業的成功（該当する場合）」（参照先 3.1 表 3.1）"]},
{n:11,s:"2.3.2",t:"【ITIL レンタカーシナリオ】ICR の統合モバイルアプリの「発見」フェーズの間、チームは迅速に「設計」フェーズへ進まなければならず、重大な時間的プレッシャーにさらされています。マリアは、顧客ニーズに関する前提が不完全である可能性を懸念しています。時間的な制約がある中で効果的な発見を行うための、実践的な推奨事項を最もよく反映している活動はどれですか？",c:["さらなる遅延を避けるために初期の方向性を確定する","前提条件を文書化し、後続のライフサイクルステージで検証する","実際のユーザーから得られた証拠を用いて、前提を迅速に検証し問い直す","さらなる発見活動よりも提供スピードを優先し、設計に進む"],a:2,e:["不正解。前提条件を検証せずに方向性を確定してしまうことは、発見活動の目的と矛盾します。「『発見』活動の目的は、プロダクトの能力および関連するサービス提供物を、サービス消費者のニーズおよび[…]継続的かつ確実に整合させることです」（参照先 3.1.1）","不正解。検証を後の段階まで先送りすると、コストとリスクが増大します。発見に関する推奨事項では早期の検証を重視しています。「明確な問題ステートメントがあることで、チームは実在のユーザーにとっての価値に集中でき[…]ます」（参照先 3.1.3）","正解。実際のユーザーから得られた証拠に基づいて前提を見直すことは、効果的な発見のための重要な実践的推奨事項です。「意思決定は、直感ではなく測定可能なデータに基づいて行わなければなりません」（参照先 3.4.1）","不正解。学習よりもスピードを優先すると、設計の前に不確実性を減らすという発見の目的が損なわれます。「この段階での遅延やアジリティの欠如は、ライフサイクルの他の段階において制約の原因となり、最終的には組織の戦略的失敗を招く可能性があります」（参照先 3.2）"]},
{n:12,s:"3.1.1",t:"プロダクトチームが顧客向けのデジタルサービスを再設計しており、人間中心の設計アプローチに従いたいと考えています。どの活動が、最も人間中心設計の原則の正しい適用を示していますか？",c:["実績のある技術的なソリューションを選択し、設計労力を削減して反復回数を最小限に抑える","ユーザーを実際の状況で観察し、フィードバックに基づいてプロトタイプを反復的に改善する","完全な要件一式を定義してから、設計を開始する","既存のインターフェースデザインを再利用して、プロダクト間の一貫性を確保する"],a:1,e:["不正解。人間中心設計は、反復を最小限に抑えることや、テクノロジーの選択から出発することを優先しません。「検証済みの調査に基づいて意思決定を行うことで、チームは後に高コストの再設計につながりがちな憶測に基づく仮定を避けることができます」（参照先 4.1.3）","正解。ITIL における人間中心設計は、利用者を状況の中で理解し、実際の利用者によるテストを行い、フィードバックに基づいてプロトタイプを反復的に改善することを重視します。「人間中心設計は、人々のニーズ、能力、制約、および文脈を、あらゆる設計上の意思決定の中心に据える体系的なデザインアプローチです」（参照先 4.1.3）","不正解。ITIL における人間中心設計は、最初から要件がすべて明確になっていることを前提とせず、学習と反復に依存しています。「この反復的なプロセスは、コードが一切書かれる前にもユーザビリティ上の問題を明らかにし、設計上の前提を検証し、改善点を導き出します」（参照先 4.1.3）","不正解。再利用性と一貫性はデザインシステムによって支えられますが、ユーザー調査とテストに基づいていない限り、それだけでは人間中心設計を実践しているとは言えません（参照先 4.1.3）"]},
{n:13,s:"10.2.4",t:"ITIL はどのように DevOps プラクティスと協働し、デジタルプロダクトおよびサービスマネジメントを支援しますか？",c:["ITIL がフレームワークを提供し、DevOps が実践と技法を提供すること","DevOps のプラクティスを標準化されたサービスマネジメントプロセスに置き換えること","DevOps の利用をソフトウェア開発活動に限定すること","DevOps を ITIL の上位に位置づけるガバナンスフレームワークとして捉えること"],a:0,e:["正解。ITIL はデジタルプロダクトおよびサービスマネジメントのフレームワークとして位置付けられ、DevOps はライフサイクル上の活動を強化する補完的なプラクティスと技法を提供します。「ITIL はデジタルプロダクトおよびサービスマネジメントに対して堅牢なフレームワークを提供しますが、多くの企業は現在、プロダクト開発を加速し、プロダクト運用を最適化するために DevOps プラクティスを統合しています」（参照先 12.5.1, 12.5）","不正解。DevOps は拡張的かつ補完的なアプローチとして説明されており、ITIL プロセスに置き換えられるものではありません。PRINCE2 や DevOps Institute などの認定資格は「ITIL フレームワークを強力に補完します」（参照先 12.5）","不正解。DevOps はソフトウェア開発だけに限定されません。「DevOps は、ITIL のプロダクトおよびサービスのライフサイクルにおける『発見』『設計』『取得』『構築』『移行』『運用』といった活動を実現するための、詳細で実践的な助言を提供する有用な補完的アプローチです」（参照先 12.5.1）","不正解。ITIL をフレームワークとして明確に位置付け、DevOps はその拡張として捉えており、ITIL の上位にあるガバナンスレイヤーとしては扱っていません（参照先 12.5）"]},
{n:14,s:"3.2.2",t:"【ITIL レンタカーシナリオ】アレックスは、統合モバイルアプリが決済や認証といったコア能力を共有しながら、3つの異なるサービスモデルに対応してサポートしなければならないことを懸念しています。どの活動が最も適切に「設計」活動の正しい適用を示していますか？",c:["モニタリングのしきい値の定義（稼働環境向け）","市場の需要に基づく機能の優先順位付け","共有コンポーネントおよび独立コンポーネント向けのターゲットアーキテクチャのブルー・プリントを作成する","段階的なリリースを計画して移行リスクを低減する"],a:2,e:["不正解。モニタリングのしきい値の定義は「設計」ではなく「運用」活動の一部です。「『運用』活動の目的は、デジタルプロダクトおよびサービスや関連システムを維持・監視し、最適なパフォーマンスと信頼性を確保することです」（参照先 8.1.1）","不正解。機能の優先順位付けは、発見のアウトプットおよびポートフォリオの意思決定によって決まるものであり、設計のステップではありません（参照先 3.2）","正解。アーキテクチャ設計を作成することは、「設計」活動における重要なステップです。「『設計』活動は、サービスプロバイダーが効果的に構築・運用・サポートできる具体的なソリューション設計へと戦略的意図を落とし込み[…]ます」（参照先 4.1.2）","不正解。段階的なリリースの計画は「移行」活動の一部であり、設計の一部ではありません（参照先 7.1.1）"]},
{n:15,s:"3.3.1",t:"デザインチームが、「構築」および「移行」の段階で大幅な手戻りを必要とするソリューションを一貫して生み出しています。「設計」活動の重要な成功要因に対して、どの改善活動が最も適切に対応していますか。",c:["デザイナー、アーキテクト、下流のライフサイクルチーム間の協働の強化","運用上のフィードバックを収集するためにデプロイ頻度を高める","自動化を構築およびテスト活動全体にわたって強化し、提供の効率性を向上させる","稼働中サービスのインシデントの分析を拡大し、運用上の改善ニーズを特定する"],a:0,e:["正解。「設計」活動の重要な成功要因は、特に「構築」「移行」「運用」「提供」「サポート」を実行責任があるチームとの、早期かつ継続的な部門横断的な協働であり、これにより後工程での手戻りを防止します。「専門分野を越えた協働と共有オーナーシップ」（参照先 4.4.3 表 4.5）","不正解。デプロイ頻度を高めることは「設計」の改善活動ではなく、「移行」または「運用」に関係します（参照先 7.1.1）","不正解。自動化によって「構築」の効率性は向上しますが、設計の有効性や手戻りには直接対処しません。「『構築』活動は高度に自動化することができ、継続的インテグレーションを可能にすべきです」（参照先 6.1.3）","不正解。稼働中サービスのインシデント分析は「設計」ではなく、「運用」と「サポート」に属します。「プロダクトパフォーマンスの記録およびレポート」（参照先 8.1 表 8.1）"]},
{n:16,s:"3.3.2",t:"【ITIL レンタカーシナリオ】レンタル、カーシェアリング、自動運転ライドの各オプションに対応する統合モバイルアプリを設計している間、チームは早急に設計を確定するよう圧力を受けています。この状況で、効果的な設計のための実践的な推奨事項を適用する活動としては、どれが最も適切ですか？",c:["最終決定する前に、ユーザーと利害関係者と共に設計上の判断を反復的に検証する","設計を早期に確定し、構築中の手戻りを減らす","技術チームに設計に関する意思決定を任せて、提供を加速する","設計を文書化された要件へのインプットのみに制限する"],a:0,e:["正解。反復的な検証を適用することで、設計が実際のニーズや制約と整合した状態に保たれます。「デジタルプロダクトの設計は反復と実験を通じて実施され、サービスプロバイダーおよびユーザーとのチェックポイントが含まれます」（参照先 4.1.2.3）","不正解。手戻りを減らすために設計を早い段階で固定してしまうことは、最終化前の検証チェックポイントを含む、効果的な設計の反復的かつ実験的な性質と矛盾します（参照先 4.1.2.3）","不正解。共有の検証なしに設計上の判断を委任すると、協働と設計の品質が損なわれます。「効果的なデザインは、プロダクトマネージャー、デベロッパー、エンジニア、リサーチャー、マーケターの協働から生まれます」（参照先 4.4.1）","不正解。設計へのインプットを文書化だけに制限すると、やり取りやフィードバックを通じた学習を無視することになります。「デザイナーは、『発見』活動で行われた作業が完了している、正確である、あるいは現在も有効であるとは一切想定しません」（参照先 4.2.1.1）"]},
{n:17,s:"8.1.2",t:"どの管理プラクティスが、主に「提供」活動中にサービス品質が定義され、監視され、報告されることを確実にしますか？",c:["サービス要求管理","ナレッジ管理","サービスレベル管理","モニタリングおよびイベント管理"],a:2,e:["不正解。サービス要求管理は、全体的なサービス品質を定義・モニタリング・報告することではなく、ユーザーからのリクエストを満たすことに重点を置きます。「サービス要求管理：サービス要求の履行」（参照先 9.3 表 9.2）","不正解。ナレッジ管理は、知識を整理し提供することで提供を支援しますが、サービス品質を定義したり監視したりすることはありません。「ナレッジ管理：サービスに関連する知識やアドバイスを収集・整理し、提供する」（参照先 9.3 表 9.3）","正解。サービスレベル管理は、サービス品質の管理と報告を担うプラクティスであり、提供中のサービスパフォーマンスを定義、モニタリングおよび報告することと直接整合します。「サービスレベル管理：サービス品質の管理と報告」（参照先 9.3 表 9.2）","不正解。モニタリングとイベント管理はサービス提供のパフォーマンスを追跏しますが、サービス品質に関するコミットメントを定義したり管理したりするものではありません。「モニタリングとイベント管理：サービス提供のモニタリングと報告」（参照先 9.3 表 9.2）"]},
{n:18,s:"4.2.1",t:"ある組織が、新しいデジタルプロダクトに対する「取得」活動を完了しました。どの成果が、その活動が正常に完了したことを示す最も適切な指標ですか？",c:["承認済みのソリューション設計およびアーキテクチャモデル","完全に統合されテスト済みのプロダクトコンポーネント","顧客が利用可能な導入済みサービス","構築および運用を支援するために必要なリソースと合意事項が割り当てられ、利用可能な状態にある"],a:3,e:["不正解。承認済みの設計およびアーキテクチャモデルは「取得」ではなく「設計」活動のアウトプットです。「プロダクト仕様とプロトタイプ」（参照先 4.1 表 4.1）","不正解。統合およびテスト済みのコンポーネントは、「構築」活動のアウトプットです。「構築・テストされたプロダクトソリューション」（参照先 6.1 表 6.1）","不正解。デプロイ済みサービスは、「移行」と「提供」の各活動のアウトプットです。「ターゲットとなる稼働環境へデプロイされ、運用準備が整ったプロダクト・サービス・リソース」（参照先 7.1 表 7.1）","正解。「取得」活動は、リソースとサービスが確保され割り当てられ、合意事項が整い、その後の「構築」および「運用」活動を実行できるようになった時点で完了します。主なアウトプットは「承認済みのリソース要求、新規または変更済みの合意事項（SLA、利用規約、ライセンス契約）、新規および変更済みの構成アイテムと資産、新規パートナーまたはサプライヤー」です（参照先 5.2.2）"]},
{n:19,s:"4.2.2",t:"【ITIL レンタカーシナリオ】統合モバイルアプリ向けにクラウドインフラストラクチャ、AI サービス、決済機能を取得する準備を進める中で、組織は複数のソーシングオプションを特定します。社内プラットフォーム、単一の外部ベンダー、または専門サプライヤーの組み合わせです。「取得」活動の「ソーシングオプションを評価する」ステップを適切に実施するために、最初に行うべき分析はどれですか？",c:["デプロイのタイムラインを比較し、どの選択肢が最も早い稼働中を可能にするか判断する","最も費用のかからないソーシングオプションを選択し、全体的なプロダクトコストを削減する","ソーシングオプションを、機能要件、スケーラビリティ、規制上の制約、長期的なインテグレーションインパクトに照らして評価する","大多数の提供チームが支持するソーシングオプションを選択する"],a:2,e:["不正解。デプロイのスピードは「移行」に関する懸念事項であり、ソーシングオプションの適合性や持続可能性について十分な洞察を提供するものではありません（参照先 5.1.1）","不正解。コストは重要な要素ですが、コストだけで選定すると、能力、コンプライアンス、インテグレーションに関するリスクを見落としてしまいます。「総所有コスト：プロダクトのライフサイクル全体を通じて、ライセンス、サポート、トレーニング、廃止、交換にどのようなコストが発生しますか？」（参照先 5.1.4）","正解。これらの基準に照らして選択肢を総合的に評価することが、ソーシングアセスメントステップを正しく適用していることを示します。「このような場合には、ソーシングオプションを評価し、新たな契約や合意を取り決める必要があります」（参照先 5.1.3）","不正解。提供チームの好みだけでは、ソーシングオプションを評価する際に必要となる戦略的、規制上、ライフサイクル上の検討事項には対応できません。「意思決定マトリクス、予算のオーナーシップ、ポートフォリオおよび調達管理ポリシーを明確にコミュニケーションすることで、適切な意思決定[…]が可能になります」（参照先 5.1.3）"]},
{n:20,s:"4.3.1",t:"プロダクトチームが、利用できないツールや外部サービスが原因で、繰り返し遅延を経験しています。「取得」活動の重要な成功要因に対して、どの改善活動が最も適切に対応していますか？",c:["構築とテストの活動がより効率的に完了するよう自動化を強化する","承認プロセスを加速し、リリースをより迅速に本番環境へ移行できるようにする","プロダクトのタイムラインに沿ってリソースとサプライヤーを確保できるよう、調整を改善する","運用業務のサポートを拡充し、インシデントをより迅速に解決できるようにする"],a:2,e:["不正解。構築およびテスト活動の自動化は「取得」ではなく「構築」に属します。「『構築』活動は高度に自動化することができ、継続的インテグレーションを可能にすべきです」（参照先 6.1.3）","不正解。リリース承認の迅速化は「取得」ではなく「移行」に関係します（参照先 7.1.1）","正解。「取得」活動の重要な成功要因は、リソースとサプライヤーがプロダクトロードマップおよびタイムラインとの整合性を保って確保されていることを保証することです。利用可能なツールやサービスの不足による遅延は、「取得」における調整不足を直接示しています。「プロダクトロードマップと関連ガイドラインの順守」（参照先 5.1 表 5.1）","不正解。インシデントの解決スピードは「サポート」に関する懸念事項であり、「取得」における遅延とは関係がありません。「通常サービス復旧のスピード」（参照先 10.1 表 10.1）"]},
{n:21,s:"4.3.2",t:"【ITIL レンタカーシナリオ】組織は、地域ごとに異なる規制に準拠しなければならない外部の決済サービスを取得する計画を立てています。この状況で、効果的な取得のための実践的な推奨事項を適用する活動としては、どれが最も適切ですか？",c:["地域差を問わず単一のプロバイダーに標準化する","規制上の要件、コンプライアンス要件、およびインテグレーション要件を分析してから、最終的なソーシングの決定を行う","最大限のコントロールを可能にするため、各地域のチームが現地プロバイダーと独自に契約できるようにする","サービスの稼働開始後にコンプライアンス上の懸念事項に対処する"],a:1,e:["不正解。完全な標準化を行うと、規制上の制約を無視してしまう可能性があり、効果的な取得ガイダンスと矛盾します。「規制、標準、保険会社、投資家は、デジタルプロダクトの取得に関するほとんどの選択肢と、それらのプロダクトに求められるデータおよび情報の保存、転送、利用、セキュリティ、分類、保管に関する機能を制約する可能性があります」（参照先 5.1.4）","正解。効果的な取得のための重要な推奨事項は、サプライヤーと契約を結ぶ前の早い段階で、規制、コンプライアンス、およびインテグレーションに関する要件を検討することです。「これらのリソースを外部から調達する場合は、知的財産権、データのオーナーシップと管理権、グローバルなコンプライアンスおよび規制を特に慎重に検討することが重要です」（参照先 5.1.4）","不正解。調整や連携のない個別契約は、分断とリスクを高めます。「意思決定マトリクス、予算のオーナーシップ、ポートフォリオおよび調達管理ポリシーを明確にコミュニケーションすることで、適切な意思決定[…]が可能になります」（参照先 5.1.3）","不正解。本番稼働後にコンプライアンスへ対応すると、組織は回避可能なリスクにさらされます（参照先 5.1.4）"]},
{n:22,s:"5.1.1",t:"統合されたプロダクトライフサイクルにおいて、「設計」と「構築」の活動の関係を最もよく表しているのはどの記述ですか？",c:["「構築」の活動は、開発が開始されると「設計」の活動とは独立して行われる","「設計」活動は、初期の計画上の意思決定をサポートするためにのみ実施される","「構築」の活動は、設計の段階で特定されたユーザーの検証に重点を置く","「設計」と「構築」の活動は、ソリューションを効果的に開発できるよう緊密に連携されている"],a:3,e:["不正解。「構築」活動は「設計」と独立しているわけではありません。「『設計』活動は、サービスプロバイダーが効果的に構築・運用・サポートできる具体的なソリューション設計へと戦略的意図を落とし込みます」（参照先 4.1.2）","不正解。「設計」は初期の計画段階のアウトプットだけでなく、実施可能な成果物も生み出します。「プロダクト仕様とプロトタイプ」（参照先 4.1 表 4.1）","不正解。ユーザーのニーズの検証は主に「発見」の一部であり、「構築」は「設計」に基づいてソリューションを開発することに重点を置きます（参照先 3.1.1）","正解。「構築」は「設計」のアウトプットに依存しており、また「設計」のアウトプットは後続のライフサイクル管理活動へのインプットとなるため、緊密な調整が示されています。「『設計』活動のアウトプットは、プロダクトおよびサービスマネジメントにおける、その後のすべての活動に対する重要なインプットとなります」（参照先 4.2）"]},
{n:23,s:"5.2.1",t:"「構築」活動が完了した際のアウトプットとして、最も関連性が高いものはどれですか？",c:["承認済みの設計仕様書およびプロトタイプ","契約済みサービスおよび割り当てられたサプライヤーリソース","運用パフォーマンス報告書およびインシデントデータ","移行の準備が整った、統合済みかつテスト済みのプロダクトコンポーネント"],a:3,e:["不正解。設計仕様書とプロトタイプは、「構築」ではなく「設計」活動のアウトプットです。「プロダクト仕様とプロトタイプ」（参照先 4.1 表 4.1）","不正解。契約済みサービスと割り当てられたリソースは、「取得」活動のアウトプットです。「取得したリソースおよび/またはサービス」（参照先 5.1 表 5.1）","不正解。運用レポートとインシデントデータは、「運用」活動の実施中に作成されます。「プロダクトとサービスの運用。プロダクトパフォーマンスの記録およびレポート」（参照先 8.1 表 8.1）","正解。「構築」活動では、構築およびテスト済みのプロダクトソリューションが作成され、その後「移行」へ進む準備が整います。「構築・テストされたプロダクトソリューション」（参照先 6.1 表 6.1）"]},
{n:24,s:"5.2.2",t:"【ITIL レンタカーシナリオ】統合モバイルアプリの設計仕様が承認された後、複数のチームが共有コンポーネントおよびサービス固有コンポーネントの開発を開始する準備が整います。開発を開始する前に、「構築」活動の最初のステップを最も適切に適用している行動はどれですか？",c:["構築作業を构成し、コンポーネントが承認済み設計と整合するようにする","スケジュールされたデプロイの時間帯を設定してビジネスへのインパクトを軽減する","想定されるユーザーの課題についてサポートチームをトレーニングする","顧客フィードバックに基づいて機能の優先順位を決定する"],a:0,e:["正解。「構築」活動の最初のステップは、開発を開始する前に、構築されるものが承認済みの設計仕様および期待される成果と整合していることを確実にするために、ソリューション設計を評価することです。「ソリューション設計を評価する。構築およびテストを計画し、リソースの利用可能性を確認する。構築およびテスト計画を実行する。ソリューションと関連ドキュメントを提供する」（参照先 6.2, 6.2.1.1）","不正解。デプロイウィンドウのスケジューリングは、「移行」活動の一部であり、「構築」の一部ではありません（参照先 7.1.1）","不正解。サポートチームのトレーニングは、構築ではなく移行およびサポートの準備に関連付けられます。「プロダクトレベルでの移行における重要な側面は、サービスプロバイダーの担当者と、必要に応じて顧客側の要員の双方に対するトレーニングと実現です」（参照先 7.1.2.2）","不正解。機能の優先度付けは、発見とポートフォリオの意思決定によって行われ、「構築」内のステップとして実施されるわけではありません（参照先 3.2）"]},
{n:25,s:"5.3.1",t:"なぜ、役割間の緊密な協働が「構築」活動の重要な成功要因と見なされるのですか？",c:["リリースの承認をより迅速に行えるようになる","開発中の効果的なインテグレーション、テスト、課題の解決を支援する","新しいプロダクトアイデアの優先度付けを可能にする","サービス提供および運用中の顧客コミュニケーションを改善する"],a:1,e:["不正解。リリースのスピードは優れた構築の実践によって影響を受ける場合がありますが、協働は承認を迅速化するための仕組みではありません。「ソリューション設計を評価する目的は、設計要件が明確であり、構築仕様が期待される価値の創出に寄与することを確実にすることです」（参照先 6.2.1.1）","正解。「構築」には、プロダクトマネージャー、ビジネスアナリスト、アーキテクト、開発チームの間で調整を行い、設計を構築単位に分解するとともに、実現可能性、検証可能性、インテグレーション準備が整っていることを確保することが求められます。「構築要件は、プロダクトマネージャー、ビジネスアナリスト、技術およびアーキテクチャのリードと協議して検討されます」（参照先 6.2.1.1）","不正解。プロダクトアイデアの優先度付けは「構築」の中核的な目標ではなく、ライフサイクルのより前の段階（特に「発見」と「設計」）で実施されます（参照先 6.2.1.1）","不正解。サービス提供および運用中の顧客とのコミュニケーションは、「構築」ではなく「提供」や「運用」といった後半のライフサイクル段階に属します。「『構築』のアウトプットは最終的には顧客に影響を及ぼしますが、そこでの協働は社内かつ技術的な性質のものです」（参照先 6.2.1）"]},
{n:26,s:"8.2.2",t:"【ITIL レンタカーシナリオ】ICR は、顧客がスマートフォンを使ってレンタカーのロックを解除できる統合モバイルアプリの新バージョンをリリースする準備を進めています。この機能をユーザーに有効化する前に、プロダクトチームは既存のサービスレベルアグリーメント（SLA）と現在のオンボーディング手順を確認します。この状況において、ICR が主として実施している「提供」活動のステップはどれですか？",c:["サービス提供に関するコミットメントと利用可能なソリューションを評価する","提供計画およびリソースの利用可能性を特定し、確認する","提供計画を実行し、利害関係者に提供ステータスを報告する","インシデントを記録し、サービス復旧アクションを開始する"],a:0,e:["正解。機能を有効化する前に既存の SLA とオンボーディング手順を見直すことは、「提供」活動の最初のステップに正確に対応します。「『提供』は、サービス合意で定義されたコミットメントを確認することから始まります。これには、SLA、サービス要求、および提供にインパクトを与える可能性のあるイベントの評価が含まれます」（参照先 9.2.1.1）","不正解。このステップは、コミットメントが確認および明確化された後に行われ、手順、ツール、リソースの可用性を確認することを含みます（参照先 9.2.1.2）","不正解。実行は、アセスメントと計画が完了した後にのみ行われます。この機能はまだ有効化されていないため、提供の実行は開始されていません（参照先 9.2.1.3）","不正解。インシデントの記録と復旧のアクションは、障害発生時にトリガーされる「サポート」活動に属します。このシナリオはインシデント対応でなく、準備段階のレビューを説明しています（参照先 10.1.1）"]},
{n:27,s:"6.1.1",t:"プロダクト移行における段階的またはインクレメンタルなアプローチを最も適切に説明している記述はどれですか？",c:["すべてのプロダクト機能が同時にリリースされ、移行労力を最小限に抑える","単一かつ調整されたリリースで新しいプロダクトが旧バージョンを置き換える","機能性は、リスクを低減しリリース間での学習を可能にするために段階的にリリースされる","完全な運用安定性が達成されるまで、移行活動は延期される"],a:2,e:["不正解。これは単一のビッグバンリリースを説明しています。「デジタルプロダクト環境では、『移行』活動は高度に、あるいは完全に自動化されている場合があり、短時間で多くのプロダクトまたはコンポーネントの更新をデプロイできます」（参照先 7.2）","不正解。これは単一のリリースイベントを表しています。「移行」は、新たに構築されたソリューションや取得したリソースによってトリガーされ、必要に応じて何度でも行われます（参照先 7.1 表 7.1）","正解。リスクを低減し、リリース間での学習と調整を可能にするため、「移行」は段階的かつフェーズごとのリリースで実施することが推奨されます（参照先 7.2）","不正解。「移行」は、構築されたソリューションや取得したリソースによってトリガーされ、必要に応じて何度でも実施されます。「構築されたソリューションまたは取得したリソースやサービスを契機として、必要に応じた頻度で実施」（参照先 7.1 表 7.1）"]},
{n:28,s:"6.2.1",t:"どのアウトプットが、移行されたプロダクトを効果的に利用しサポートできるようにすることと最も密接に関連していますか？",c:["確定した設計仕様とアーキテクチャモデル","締結済みのサプライヤー契約と割り当て済みリソース","更新された運用文書化とサポート準備","開発およびテスト中に生成される欠陥ログ"],a:2,e:["不正解。設計仕様書とアーキテクチャモデルは「設計」のアウトプットであり、移行やサポートの成果物ではありません。「プロダクト仕様とプロトタイプ」（参照先 4.1 表 4.1）","不正解。サプライヤー契約と割り当てられたリソースは「取得」のアウトプットであり、移行後のユーザビリティやサポートとは関係がありません。「取得された活動リソースおよび/またはサービス」（参照先 5.1 表 5.1）","正解。「移行」の後は、プロダクトが利用可能であり、サポート可能でなければなりません。運用文書化やナレッジ、サポートの準備が、効果的な利用と継続的なサポートを可能にします。「各『移行』サイクルでは、既知の事項と未知の事項の両方に対処し、環境の準備が整っていること、文書化が完了していること、依存関係が満たされていること、チーム間の足並みがそろっていることを確実にします」（参照先 7.2.1）","不正解。欠陥ログは「構築」に関連付けられており、移行後の効果的な利用とサポートの確保には関連していません。「構築およびテスト済みのプロダクトソリューション」（参照先 6.1 表 6.1）"]},
{n:29,s:"6.2.2",t:"【ITIL レンタカーシナリオ】統合モバイルアプリの移行準備中に、本番環境の構成に関する詳細やモニタリングに対する期待事項について、複数のチームの間で意見の相違が生じています。アセスメントのアウトプットを実行可能な準備に変える移行ステップを適用しているのは、どの活動が最も適切ですか。",c:["稼働環境におけるセキュリティ上の課題をリリース後に確認する","移行後の振り返りを実施し、アクションをバックログに追加する","所有タスクの担当者、依存関係、確認済みのリソース可用性を含む移行計画を作成する","移行結果レポート（ロールバック回数とタイムスタンプ付き）を公開する"],a:2,e:["不正解。リリース後に稼働環境を確認するのは受け身の対応であり、タイミングとしては遅すぎます。移行の準備は、リリース後の検証ではなく、実行前に準備が整っていることを確実にするためのものです（参照先 7.1.1）","不正解。移行後の振り返りは、準備中ではなく実行後に行われます。「1 〜 2 日以内に、移行後の振り返りが行われ、得られた教訓の整理、成果の評価、改善の機会の特定が実施されます」（参照先 7.2.1.3）","正解。ソリューションと移行要件を評価した後の次の主要な移行ステップは、移行活動を計画し、リソースの可用性を確認することです。「『移行』活動の 4 つのステップは次のとおりです：ソリューションと移行要件を評価する。移行活動を計画し、リソースの利用可能性を確認する。移行計画を実行する。移行結果を利害関係者に伝達する」（参照先 7.2）","不正解。移行結果の報告は、準備中ではなく移行の実行後に行われます。「移行結果を利害関係者に伝達する」（参照先 7.2）"]},
{n:30,s:"6.3.2",t:"【ITIL レンタカーシナリオ】「移行」活動中は、複数の外部サプライヤーが地図サービス、決済処理、およびクラウドインフラストラクチャを提供します。どの活動が、効果的な移行を確実にするための実践的な推奨事項を最もよく反映していますか？",c:["プロダクトが稼働中になると、サプライヤーが自動的に調整すると想定する","サプライヤーを明確にオンボーディングし、役割、責任、エスカレーション経路を確認する","サプライヤーの関与を契約管理のみに限定する","ローンチ後に課題が発生した場合にのみサプライヤー調整に対処する"],a:1,e:["不正解。自動的な整合性を前提とすることはリスクを高め、構造化された引き継ぎに関するガイダンスにも反します。「『移行』は単なるデプロイだけを意味するものではありません。それは、エコシステム全体が稼働できるように準備することです」（参照先 7.1.1）","正解。サプライヤーの「[…]オンボーディングは極めて重要[…]」であり、移行後の不安定性を回避するために、オーナーシップとエスカレーション経路を形式化することが推奨されます。「サプライヤーのオンボーディングも、移行の一形態と見なされ」、「移行」には「新規または更新されたプロダクトが稼働環境に統合され、プロダクト運用およびサービス提供を行う準備が整っていることを確実にすることが含まれます」（参照先 7.1）","不正解。契約管理だけでは、運用準備が整っているとは言えません。「この活動は、構築されたものが運用可能であることを確実にします。これには、計画、テスト、オンボーディング、文書の引き継ぎ、リスク軽減、チーム間のカルチャー的な整合性が含まれます」（参照先 7.1.1）","不正解。問題が発生するのを待つことは、プロアクティブな移行の実践と矛盾します。「移行が成功するとは、プロダクトソリューションが意味のある形で稼働中となり、観測可能、サポート可能、かつ持続可能な形で運用されることを意味します」（参照先 7.1.1）"]},
{n:31,s:"7.1.2",t:"どのプラクティスが、稼働中のプロダクトとサービスの健全性およびパフォーマンスに関する可視性を提供することで、「運用」活動を最も直接的に可能にしますか？",c:["展開管理","リリース管理","モニタリングおよびイベント管理","事業分析"],a:2,e:["不正解。展開管理は、コンポーネントを稼働中環境へ移行することを扱います。「展開管理プラクティス：新規または変更されたハードウェア、ソフトウェア、文書、プロセス、あるいはその他のサービスコンポーネントをコントロールされた環境のとつへ移送するプラクティス」（参照先 用語集）","不正解。リリース管理により、新規または変更されたサービスの可用性が確保されます。これは主として、運用上の健全性やパフォーマンスを監視したり、その可視性を提供したりすることを目的としていません。「リリース管理プラクティス：新規および変更されたサービス並びに機能を使用可能にするプラクティス」（参照先 用語集）","正解。このプラクティスが、稼働中のプロダクトとサービスの健全性およびパフォーマンスに関する可視性を直接的に可能にします。「モニタリングおよびイベント管理：サービスの運用ステータスのモニタリングおよび報告、イベントの処理」（参照先 8.3 表 8.2）","不正解。事業分析は、ニーズと要件を定義することに重点を置いており、オペレーションのモニタリングに重点を置いているわけではありません。「事業分析プラクティス：ビジネスニーズを定義し、ソリューションを推奨するプラクティス」（参照先 用語集）"]},
{n:32,s:"7.2.1",t:"どのアウトプットが「運用」活動の効果的な実行と最も密接に関連していますか？",c:["更新されたプロダクトロードマップと優先順位付けされたバックログ","締結済みのサプライヤー契約と、人材およびテクノロジーリソースの割り当て","試作段階で特定された設計変更","運用データおよびサービスパフォーマンス情報"],a:3,e:["不正解。ロードマップとバックログは「運用」ではなく「発見」のアウトプットです。「精緻化されたバックログ、更新されたプロダクトロードマップ、継続的改善の取り組み[…]」（参照先 3.2.2）","不正解。サプライヤー契約と割り当てられたリソースは「運用」ではなく「取得」のアウトプットです。「取得されたリソースおよび/またはサービス」（参照先 5.1 表 5.1）","不正解。プロトタイピングと設計変更は「設計」活動に属します。「プロダクト仕様書とプロトタイプ」（参照先 4.1 表 4.1）","正解。「運用」活動は、稼働中の環境でプロダクトやサービスを運用し、そのパフォーマンスのモニタリングを行います。主なアウトプットは「運用中のプロダクトとサービス。プロダクトパフォーマンスの記録およびレポート」です（参照先 8.1 表 8.1）"]},
{n:33,s:"7.2.2",t:"【ITIL レンタカーシナリオ】日次のヘルスチェック中に、自動化されたモニタリングによって、あるサービスコンポーネントに影響する繰り返された認証エラーが検出されます。どの活動が、「運用」活動の第3ステップに最もよく当てはまりますか？",c:["事業上重要なユーザーや顧客に影響を及ぼす場合を除き、その課題は無視する","次回の計画会議で議論できるように、この課題を記録する","ランブックに従って調査を行い、問題を解決し、成果を文書化する","モニタリングのノイズを減らすためにアラートを無効化する"],a:2,e:["不正解。繰り返し発生するエラーを無視することは、日々のヘルスチェックと早期検知の目的に反します。「デジタルプロダクト運用における重要なトレンドは、リアクティブな対応からプロアクティブなアプローチへの転換です」（参照先 8.1）","不正解。活動を遅らせることはリスクを高め、即時実行に関するガイダンスと合致しません。「効果的なプロダクト運用は、サービスの信頼性を左右する重要な要素です」（参照先 8.1）","正解。これは、業務計画の実行と報告を直接反映します。「これには、モニタリング、パフォーマンスチューニング、バックアップ、ハウスキープィング、インシデントやサービス低下を未然に防ぐための技術的保守といった、日常的な運用タスクが含まれます」、また「ヘルスチェックで問題が検出された場合は、あらかじめ定義されたランブックに従ってエスカレーションされます」（参照先 8.1.2, 8.2.1.3）","不正解。アラートを無効化することは、イベントを抑制するのではなく検知して処理するという「運用」のモニタリングの目的に反します。「プロダクトの健全性のモニタリング。関連イベントの取得と処理」（参照先 2.1.1 表 2.1）"]},
{n:34,s:"7.3.2",t:"【ITIL レンタカーシナリオ】オペレーションチームは、増え続けるモニタリングデータを管理するために、AI ベースのアラート相関を導入する計画です。しかし、アラートは一貫性がなく、構造が不十分で、重複していることもよくあります。推奨される運用アプローチを最も適切に反映している意思決定はどれですか？",c:["AI ツールを直ちに導入して人間の労力を削減する","ノイズを減らすためにアラートのしきい値を引き上げる","まずデータ構造、オブザーバビリティモデリング、およびイベントの健全性を改善する","既存のモニタリングツールを、AI 機能を備えた新しいプラットフォームに置き換える"],a:2,e:["不正解。構造化データなしで AI を導入すると、業務の改善ではなくノイズを増幅させてしまうリスクがあります。「多くの組織は、自社の業務データの全体像を整理する前に AI を導入しようとしています」（参照先 8.4.3）","不正解。しきい値を引き上げると症状は見えにくくなりますが、根本的なデータ品質の問題には対処できません。「データのアーキテクチャ、オブザーバビリティのモデル化、適切なイベントの管理がすべて最優先されなければなりません」（参照先 8.4.3）","正解。このガイダンスでは、障害を避けるために、あらゆる AIOps イニシアチブに先立ってデータアーキテクチャ、モデリング、およびイベント衛生を整備しなければならないと述べています。「多くの組織は、自社の業務データの全体像を整理する前に AI を導入しようとしています」（参照先 8.4.3）","不正解。データ品質への対処を行わずにツールだけを入れ替えても、同じ運用上の弱点を繰り返すことになります。「明確な成果を想定せず、流行しているからという理由だけでツールを購入するのは、失敗への近道です」（参照先 8.4.3）"]},
{n:35,s:"9.1.2",t:"どのプラクティスが、「サポート」活動を最も直接的に実現し、ユーザーの課題や問い合わせが効果的に対処されるようにしますか？",c:["サービスデスク","サービスレベル管理","リリース管理","問題管理"],a:0,e:["正解。「サポート」活動は、ユーザーの問題、要求および問い合わせを扱います。この機能を直接実行するプラクティスがサービスデスクであり、利用者と組織の間の主な窓口として機能します。「サービスデスク：支援を必要とするユーザーとのコミュニケーション」（参照先 10.3 表 10.2）","不正解。サービスレベル管理は、ユーザーからの問い合わせ対応ではなく、合意事項と目標値に重点を置きます（参照先 10.3 表 10.2）","不正解。リリース管理は、ユーザーの問題や問い合わせを直接管理するものではなく、変更を統制された形で導入することを確実にします。「リリース管理：変更およびリリースが、サポートチームが管理できるコントロールされた方法で導入されるようにする」（参照先 10.3 表 10.2）","不正解。問題管理は、問い合わせへの直接対応ではなく、根本原因に焦点を当てます。「インシデントを調査し、プロダクトおよびサービスのエラーを検出して、改善を開始」します（参照先 10.3 表 10.2）"]},
{n:36,s:"9.2.2",t:"どのアウトプットが、ITIL プロダクトおよびサービスライフサイクルに対する「サポート」活動の貢献を最も適切に反映していますか？",c:["合意された目標に対して測定される安定したサービス可用性","統合されテスト済みのプロダクトコンポーネント","ユーザーとのインタラクションや課題から得られたナレッジ、データ、洞察","提供開始され、利用可能なプロダクトおよびサービス"],a:2,e:["不正解。これは「運用」の指標であり、「サポート」のアウトプットではありません。「稼働プロダクトの信頼性、パフォーマンス、情報セキュリティ」（参照先 8.1 表 8.1）","不正解。これは「構築」の主要なアウトプットです。「構築・テストされたプロダクトソリューション」（参照先 6.1 表 6.1）","正解。「サポート」の役割はサービスを稼働させ続けることだけではなく、ユーザーとのやり取りやインシデント、サービス要求から知識と洞察を収集し、ライフサイクル全体の継続的改善に反映することです。「サポート」活動の目的は「[…]各事例から学習して再発を防止することです」（参照先 10.1.2）","不正解。これは「移行」のアウトプットです。「ターゲットとなる稼働環境へデプロイされ、運用準備が整ったプロダクト・サービス・リソース」（参照先 7.1 表 7.1）"]},
{n:37,s:"9.2.1",t:"【ITIL レンタカーシナリオ】重大インシデントを解決した後、指標では復旧時間は短かったことが示されていますが、同様のインシデントが以前にも発生しています。長期的な価値改善を確実にするために、「サポート」活動の最終ステップを最も適切に適用している行動はどれですか？",c:["インシデントのインパクトと緊急度を分析し、その情報でチケットを更新する","再発を防ぐために、個々のエラーに焦点を当ててレビューする","将来の課題を早期に検知できるようにアラートのしきい値を下げる","データに基づくレビューを実施し、システム全体に関わる改善事項を記録する"],a:3,e:["不正解。その活動は最終ステップではなく、第1ステップに属します。ステップ1は「インシデントと災害を特定し、評価する」です（参照先 10.2）","不正解。非難に焦点を当てたレビューは、システム全体の改善と心理的安全を損ないます。「サポート」活動の目的は「[…]各事例から学習して再発を防止することです」（参照先 10.1.2）","不正解。アラートを調整することは検知の助けにはなりますが、根本原因や学習への対応にはなりません。「ランブックの更新から異常検知のしきい値の微調整に至るまで、すべての改善項目は[…]自動的にバックログ[…]登録されます」（参照先 10.2.1.3）","正解。「サポート」活動は、構造化されたレビュー、メトリクス分析、再発防止のための改善アクションをバックログに記録することをもって完了します。「サポート行動を見直し、報告する」（参照先 10.2）"]},
{n:38,s:"9.3.2",t:"【ITIL レンタカーシナリオ】決済処理の障害が、ある市場のユーザーに影響を及ぼしています。サポートチームは迅速にサービスを復旧し、中断発生中には代替手段を提示します。この状況で、効果的なサポートのための実践的な推奨事項を最もよく適用している活動はどれですか？",c:["根本原因が完全に解明されるまで、顧客への連絡を遅らせる","インシデント発生中にユーザーをエンゲージし、合意された対応手順に従ってサービスを復旧する","課題をプロダクトデザインにエスカレーションしてからサービスを復旧する","ユーザー向けの更新でなく、内部での解決のみに集中する"],a:1,e:["不正解。コミュニケーションを遅らせると、フラストレーションが高まり、効果的なサポートの実践に反します（参照先 10.2.1.2）","正解。インシデント発生時にユーザーと適切に関わり、構造化されたサポート経路を用いてサービスを復旧することは、推奨事項と直接一致します。「進行中のインシデントについてリアルタイムのステータス表示を提供し[…]」、また「[…]複数の解決手段（セルフサービス、ガイド付きウォークスルー、または有人チャット）を用意し[…]」（参照先 10.4.3）","不正解。サービスを復旧する前にプロダクトデザインへエスカレーションすることは、即時のインシデント対応アクションとは整合しません。プロダクトの改善は解決の後に行われます（参照先 10.4.3）","不正解。インシデント発生時にユーザーからのコミュニケーションを無視すると、信頼が損なわれます。「利害関係者と顧客の双方が一貫性のあるタイムリーな最新情報を受け取れるようにします」（参照先 10.4.1）"]},
{n:39,s:"10.1.5",t:"効果的なプロダクトマネジメントを支える成功要因を最も適切に表しているものはどれですか？",c:["インシデント対応の詳細な運用手順","プロダクト、サービス、およびその他の利害関係者の役割間における継続的な協働","すべてのプロダクトおよびサービスに関する包括的なパフォーマンス報告","すべてのプロダクト変更について、中央集権的なガバナンスを通じた正式な承認を求めること"],a:1,e:["不正解。これは「サポート」に関することであり、プロダクトマネジメントではありません。「インシデントを解決し、プロダクトの正常な運用およびサービス提供を復旧する」（参照先 10.3 表 10.2）","正解。効果的なデジタルプロダクトマネジメントは、部門横断的であり、役割を越えた継続的協働に依存します。「顧客、プロダクトマネージャー、デザイナー、エンジニア、サービス担当者、その他の利害関係者は、早い段階から頻繁に協働し、自身の業務内容を可視化しなければなりません」（参照先 3.4.1）","不正解。これは「運用」に関する内容です。主要なアウトプットはプロダクトの「パフォーマンスの記録およびレポート」です（参照先 8.1 表 8.1）","不正解。効果的なプロダクトマネジメントでは、すべての変更に中央集権的な正式承認を求めるのではなく、ガバナンスを日々の提供業務の中に組み込みます。「コードとしての方針、データリネージおよびモデルガバナンスの各種コントロール、そして[…]標準化された意思決定権限により、コンプライアンスと倫理が日々の提供業務に組み込まれます」（参照先 11.1）"]},
{n:40,s:"10.1.3",t:"組織はさまざまなビジネスおよびオペレーティングモデルを採用します。どのようにバリューストリームはライフサイクル管理の活動を統合し、これらの異なるモデルを効果的にサポートすべきでしょうか？",c:["各バリューストリームにプロダクトおよびサービスライフサイクルの全段階を確実に含めることによって","価値および消費者がどのように定義されるかに基づき、ライフサイクル管理活動に含めるスコープを調整することによって","ライフサイクルインテグレーションを標準化し、バリューストリームが組織間で同一のままになるようにすることによって","組織のビジネスモデルとの整合性よりも、内部効率を優先することによって"],a:1,e:["不正解。バリューストリームには、特定の状況で価値を生み出すために必要な活動だけが含まれる場合があります。バリューストリームは「あらかじめ決められた青写真ではなく、実際に実行される一連の活動の順序である」（参照先 11.4）","正解。バリューストリームは状況に応じて変化し、柔軟です。固定された一連の手順としてではなく、価値がどのように創出され消費されるかに基づいて定義されます。「[…]組織は自らが責任を負うことになるプロダクトおよびサービスマネジメント活動を選択し、それによって自らのサービス提供物が定義されるという点です」（参照先 11.4.1）","不正解。バリューストリームは、組織的な状況とオペレーティングモデルに応じて異なります。「[…]実際のワークフローは、確立されたプロセスや他のワークフローに基づいているものの、常に固有のもの」です（参照先 11.4）","不正解。バリューストリームは、内部の効率性だけを個別的に最適化するのではなく、価値創出やビジネスモデルと整合するように設計されます。「バリューストリームのマッピングと管理は、[…]顧客やその他の利害関係者に対する作業と価値創出のフローを最適化します」（参照先 11.4）"]},
{n:41,s:"暫定",t:"あるデジタルプロダクトベンダーは、自社のプロダクトが顧客の望む成果の達成にどのように役立っているかを定期的に見直しています。新機能の優先順位を決定する前に、チームは、提案された変更が実際のユーザーの問題を解決しているか、サービスの成果を向上させているか、または顧客とサービスプロバイダーに対する長期的な利益を強化しているかどうかを評価します。\nこのシナリオでは、どの ITIL 従うべき原則が適用されていますか？",c:["フィードバックをもとに反復して進化する","最適化し、自動化する","価値に着目する","シンプルにし、実践的にする"],a:2,e:["不正解。反復とフィードバックは扱われておらず、ここでは変更の価値貢献を判断しています。","不正解。効率化や自動化の判断ではありません。","正解。提案された変更が実際のユーザーの問題を解決し、成果と長期的便益に寄与するかを評価しており、価値への着目そのものです。","不正解。ムダの排除や簡素化に関する判断ではありません。"]},
{n:42,s:"暫定",t:"デジタルプロダクトについて、正しくない記述はどれですか？",c:["ソフトウェアと仮想インフラストラクチャに依存している","現地での対応なしに診断できる","物理的な提供に依存している","使用され、同時に改良される"],a:2,e:["不正解（記述は正しい）。デジタルプロダクトはソフトウェアと仮想インフラに依存します。","不正解（記述は正しい）。遠隔での診断・監視が可能である点がデジタルプロダクトの特徴です。","正解（これが正しくない記述）。デジタルプロダクトは物理的な提供に依存しません。デジタルテクノロジーに基づいて提供されます。","不正解（記述は正しい）。デジタルプロダクトは利用されながら継続的に改良されます。"]},
{n:43,s:"暫定",t:"次のうち、どの記述がプロダクトおよびサービスライフサイクルについて正しい内容ですか？",c:["適用範囲とライフサイクル管理活動の順序は固定されており、変更しない","バリューチェーン活動は、いつも決まった順序で実行される","運用、提供、およびサポートは、厳密な順序で次々に行われなければならない","ライフサイクル管理の活動は、全体的かつ統合的な方法で管理される必要がある"],a:3,e:["不正解。適用範囲や順序は状況に応じて変わります。","不正解。バリューチェーン活動はあらかじめ決められた青写真ではなく、実際に実行される活動の順序です。","不正解。運用・提供・サポートは並行して継続的に行われます。","正解。ライフサイクル管理活動は全体的・統合的に管理される必要があります。"]},
{n:44,s:"暫定",t:"ある組織が、新しいデジタルセルフサービスポータルの設計を完了しました。チームはソリューションを稼働環境にデプロイし、旧システムからユーザーデータを移行し、サポート要員にトレーニングを実施し、サービスが合意されたパフォーマンスおよびセキュリティ要件を満たしていることを検証します。\nこのシナリオで主として実施されているライフサイクル管理活動はどれですか？",c:["構築","移行","運用","サポート"],a:1,e:["不正解。開発・テストはすでに完了しています。","正解。稼働環境へのデプロイ、データ移行、要員トレーニング、稼働前検証は「移行」活動です。","不正解。稼働後の維持・監視ではありません。","不正解。インシデント対応やユーザー支援ではありません。"]},
{n:45,s:"暫定",t:"IT サービスプロバイダーが、マネージド・ワークプレイスサービスに新しいユーザーをオンボーディングします。プロバイダーは、ユーザーアカウント発行とアクセス付与、機器とユーザーガイドの提供、オンボーディングセッションおよび継続的なコンサルテーションの実施により、ユーザーがサービスを効果的に活用できるよう支援します。\nこのシナリオで実施されている作業を最もよく表しているライフサイクル管理活動はどれですか？",c:["提供","移行","運用","サポート"],a:0,e:["正解。ユーザーのオンボーディング、アクセス付与、サービス要求の履行、コンサルテーションは「提供」活動です。","不正解。プロダクトを稼働環境に導入する活動ではありません。","不正解。システムの維持・監視ではありません。","不正解。障害対応や課題解決ではありません。"]},
{n:46,s:"暫定",t:"オンライン予約システムのユーザーが、ピーク時に断続的なアクセス障害が発生しているとレポートしています。サポートチームはユーザーからの問い合わせに対応し、可能な場合はアクセスを復旧し、アラートを調査して課題の根本原因を特定し解決します。\nこのシナリオで実施されている作業を最もよく表しているライフサイクル管理活動はどれですか？",c:["提供","移行","運用","サポート"],a:3,e:["不正解。合意されたサービスの提供・履行ではありません。","不正解。稼働環境への導入ではありません。","不正解。日常的な維持・監視タスクの実行ではなく、障害への対応が中心です。","正解。ユーザーからの問い合わせ対応、通常サービスの復旧、原因の特定と解決は「サポート」活動です。"]},
{n:47,s:"暫定",t:"ある組織が、デジタルサービス拡大の機会を検討しています。次に何を開発するかを決定する前に、チームは社内外の利害関係者と協働し、彼らの期待を把握し、満たされていないニーズを特定し、今後の意思決定を導く要件を文書化します。\nこのシナリオにおいて、この活動を最も強く支援する管理プラクティスはどれですか？",c:["アーキテクチャ管理","事業分析","ポートフォリオ管理","リスク管理"],a:1,e:["不正解。アーキテクチャ管理は構造と設計原則を扱います。","正解。ニーズの分析と要件の定義・文書化を担うのは事業分析プラクティスです。","不正解。ポートフォリオ管理は投資の選定と優先順位付けを扱います。","不正解。リスク管理はリスクの特定と対応を扱います。"]},
{n:48,s:"暫定",t:"【ITIL レンタカーシナリオ】ICR は、複数の地域で繰り返し確認されている摩擦点を受けて、予約・レンタルプラットフォームの機能強化を検討しています。新機能を確定する前に、オマールは部門横断的なワーキンググループを招集し、各市場の主要ユーザーと解決すべき問題を明確にするためにユーザーペルソナを再検討します。\n次に実施すべきステップは何ですか？",c:["多様な利害関係者とエンゲージし、全体的な視野を強化する","洞察を、明確に言語化されたプロダクトの方向性と意図へと変換する","現在のサービスとコンポーネントを精査し、相互依存関係を特定する","提案されたイニシアチブの背景・目的と、期待される便益を共有する"],a:1,e:["不正解。部門横断ワーキンググループの招集により、すでに実施済みです。","正解。ユーザーと問題が明確化された後の次のステップは、得られた洞察を明確なプロダクトの方向性と意図へ変換することです。","不正解。これは設計段階のインプット分析に近く、この時点の次ステップではありません。","不正解。方向性が定まった後のコミュニケーション活動です。"]},
{n:49,s:"暫定",t:"新しいデジタルプロダクト機能の発見作業の際、意思決定は主に上級利害関係者の意見とこれまでの体験に基づいて行われます。実施後、その機能は採用が限定的です。\n将来同様の成果を避けるために、サービスプロバイダーは成功のためのどの推奨事項に最も重点を置くべきでしょうか？",c:["初期の協力を強化し、ビジネスチームと技術チームの間で発見段階から連携を図る","正式な評価やコントロールを減らし、頻繁で低リスクな実験を促進する","承認の迅速化とリソース確保のためにシニアリーダーシップの関与を高める","検証時に検証可能な前提条件を定義し、パフォーマンス指標を追跡する"],a:3,e:["不正解。協働は重要ですが、根本原因は意見に依存した意思決定です。","不正解。コントロールの削減が課題への対処ではありません。","不正解。リーダーの意見への依存をさらに強めてしまいます。","正解。意思決定は直感ではなく測定可能なデータに基づくべきであり、検証可能な前提条件と指標の追跡が対策になります。"]},
{n:50,s:"暫定",t:"【ITIL レンタカーシナリオ】ICR は、顧客が予約をリアルタイムで変更できる新しいモバイル機能の導入を検討しています。あるシニアリーダーの確信に基づき、さらなる分析を行うことなく機能が導入されました。しかし採用は低く、顧客満足度も変化していません。\nリーダーシップが従っていない推奨事項はどれですか？",c:["強力なリーダーシップの後援","スケーラブルなインフラストラクチャとプラクティス","効果的なサプライヤー関係管理","証拠に基づく意思決定"],a:3,e:["不正解。後援はむしろ強く働いていました。","不正解。インフラのスケーラビリティは論点ではありません。","不正解。サプライヤー関係は関係しません。","正解。分析や検証を伴わずに直感で進めており、証拠に基づく意思決定に従っていません。"]},
{n:51,s:"暫定",t:"デジタルプロダクトチームが、主に社内の前提と少数の社内利害関係者からのフィードバックに基づいて顧客ポータルを再設計します。リリース後、ユーザーからは主要なタスクの完了が難しいとレポートされ、採用は低水準のままです。\nこのシナリオで説明されている課題に対して、どの活動を取るのが最も適切でしょうか？",c:["将来のソリューション設計を標準化するために単一の設計フレームワークを選定する","提供サイクルを加速し、改善点をより頻繁にリリースできるようにする","実際のユーザーの行動やニーズに関する検証済みの調査結果に基づいて設計上の意思決定を行う","ガバナンスを強化し、設計が承認済み標準に従うようコントロールする"],a:2,e:["不正解。標準化はユーザー理解の欠如を解決しません。","不正解。誤った設計を速く出しても採用は改善しません。","正解。検証済みの調査に基づく意思決定が、憶測による高コストな再設計を防ぎます（人間中心設計）。","不正解。コントロール強化はユーザビリティ課題に対処しません。"]},
{n:52,s:"暫定",t:"新しいデジタルサービスが設計されており、スタッフが顧客とインタラクションし日々の業務を行う方法を大きく変更することになります。役割は変化し、新たなスキルが求められ、ユーザーが新しい働き方に適応する必要があります。\nこのシナリオにおいて、「設計」活動を効果的にサポートするために、組織変更の管理をどのように機能させることができるでしょうか？",c:["誤用のリスクを低減し機密情報を保護するため、ユーザーの責任と行動を定義することによって","スタッフからのフィードバックを促し、得られた教訓を将来の変更の設計に活用することによって","効果的なサービス運用と採用に必要な役割・プロセス・行動の変更を設計することによって","ユーザーのニーズや期待を引き出し、文書化することでサービスの利用方法を定めることによって"],a:2,e:["不正解。これは情報セキュリティ管理の役割です。","不正解。フィードバックの活用は有用ですが、設計段階の中心的な貢献ではありません。","正解。組織変更の管理は、採用と効果的な運用に必要な役割・プロセス・行動の変更を設計面から支援します。","不正解。これは事業分析の役割です。"]},
{n:53,s:"暫定",t:"【ITIL レンタカーシナリオ】予約ジャーニーの問題を特定した後、ICR はサブスクリプション型レンタルと柔軟な保険オプションの追加を検討します。チームはプロダクトロードマップとバックログを確認し、予約傾向と地域別の利用データを分析し、競合をベンチマークし、最近の顧客インタビューと調査結果を再検討します。\nどのステップが、このシナリオで「設計」活動として実行されていますか？",c:["新しいレンタルモデルへの継続的な投資が正当化されるかどうかを判断するための市場需要アセスメントを実施する","構造化されたサービスデザイン業務を開始するために必要な手法、リソース、利害関係者を準備し整理する","計画された設計を、反復的なスプリントと継続的なフィードバックを通じてテスト済み成果物に変換する","合意済みのソリューション仕様および実装計画を利害関係者に共有し、整合させる"],a:0,e:["正解（暫定）。設計インプットの妥当性を確認するアセスメントであり、設計活動の最初の評価ステップに該当します。","不正解。設計計画・リソース準備は次のステップです。","不正解。設計計画の実行はさらに後のステップです。","不正解。仕様の共有・整合は設計の最終ステップです。"]},
{n:54,s:"暫定",t:"【ITIL レンタカーシナリオ】ICR の新たなデジタル能力は、主にアーキテクトと開発者によって技術的な実現可能性と提供スピード重視で設計されました。機能面の期待には応えているものの、稼働環境で広く利用・サポートされる際の挙動には不確実性があります。CIO は手戻り、サービス中断、不十分な採用のリスクを低減したいと考えています。\nこの懸念事項に対処するには、どの活動を取るのが最も適切でしょうか？",c:["運用チームを設計段階からエンゲージさせ、運用上の要件に早期に対応できるようにする","ソリューションレビューの頻度を高めて、シニアリーダーシップからのフィードバックを迅速化する","ソリューション文書を確定し、提供チームが実施の準備ができるようにする","限定的なロールアウトを実施し、初期利用時の運用上のギャップを特定する"],a:0,e:["正解。設計の重要成功要因は、構築・移行・運用・提供・サポートを担うチームとの早期かつ継続的な部門横断協働です。","不正解。経営層のレビュー頻度は運用性の欠如に対処しません。","不正解。文書の確定は運用要件の不足を補いません。","不正解。ロールアウト後の発見は事後的で、設計段階での解消になりません。"]},
{n:55,s:"暫定",t:"ある組織が、新しいデジタルプロダクトをサポートするために外部のソフトウェアとクラウドサービスを購入することを計画しています。チームは潜在的なサービスプロバイダーを評価し、選定し、契約を交渉し、契約条件が継続的な協働と期待を支えられるようにします。\nこのシナリオにおいて、この活動を最も強く支援する管理プラクティスはどれですか？",c:["アーキテクチャ管理","サービス財務管理","サプライヤー管理","IT 資産管理"],a:2,e:["不正解。アーキテクチャ管理は構造と設計原則を扱います。","不正解。サービス財務管理は予算・会計・請求を扱います。","正解。サプライヤーの評価・選定・契約交渉と関係の管理を担うのはサプライヤー管理です。","不正解。IT 資産管理は資産のライフサイクル管理を扱います。"]},
{n:56,s:"暫定",t:"【ITIL レンタカーシナリオ】ICR は内部・外部の選択肢を検討し、新たなデジタル能力に対するソーシングアプローチを選定しました。適合性、リスク、運用原則との整合性も合意済みです。ICR は、リソースをデリバリーチームに提供する前に、期待・責任・義務が明確で強制力を持つことを確認したいと考えています。\nICR は次に何をすべきでしょうか？",c:["選定した関係者との責任、義務、および条件を正式に文書化する","再度ソーシングオプションを評価し、サプライヤーのパフォーマンス情報を確認する","サプライヤーの能力を運用要件および規制要件に照らして検証する","内部記録を更新し、調達に関する意思決定と承認内容を反映させる"],a:0,e:["正解。ソーシング決定後の次ステップは、合意・契約として責任・義務・条件を正式に文書化することです（新規または変更された合意事項）。","不正解。評価はすでに完了しています。","不正解。能力の検証も選定の過程で完了しています。","不正解。記録更新は合意締結後の事務的な作業です。"]},
{n:57,s:"暫定",t:"ある組織が複数のサプライヤーから外部のテクノロジーサービスを調達しています。ソーシングの意思決定は短期的なコスト圧力や部門個別のニーズに左右され、重複購買、サプライヤーパフォーマンスの可視性の欠如、ビジネス目標との関連説明の困難が生じています。\nこのシナリオで説明されている課題に対して、どの活動を取るのが最も適切でしょうか？",c:["リスク評価の対象を拡大し、規制上および倫理上のコンプライアンス要件を含める","ソーシングに関する意思決定を組織戦略と目標により緊密に整合させる","追加の交渉およびサプライヤートレーニングを通じスタッフスキルを強化する","手作業による調達業務と承認時間を削減するための自動化ツールを導入する"],a:1,e:["不正解。コンプライアンスは重要ですが、断片的な意思決定という根本課題には対処しません。","正解。取得の重要成功要因は、ソーシング判断をプロダクトロードマップおよび組織戦略・目標と整合させることです。","不正解。スキル強化は戦略的整合性の欠如を解決しません。","不正解。自動化は速度を改善しますが、判断基準の不整合は残ります。"]},
{n:58,s:"暫定",t:"【ITIL レンタカーシナリオ】ICR は複数年契約でクラウド分析プロバイダーを選定しました。時間の経過とともに顧客行動とデータ利用パターンは大きく進化しましたが、契約の変更や終了には多額の違約金が発生し、調達戦略の適応が困難になっています。\n振り返って、取得計画のどの活動がこのリスクを最も効果的に低減していたと考えられますか？",c:["取得チェーン全体でトレーサビリティと説明責任を徹底する","柔軟性を考慮して契約とソーシングモデルを設計する","取得のアウトプットが後工程のすべての担当者のニーズを満たしていることを検証する","計画および設計の初期段階から調達担当者やサプライヤー管理の専門家をエンゲージさせる"],a:1,e:["不正解。トレーサビリティは硬直的な契約条件の問題を解消しません。","正解。変化に適応できるよう、柔軟性（変更・終了・拡張条件）を前提に契約とソーシングモデルを設計することがこのリスクを最も低減します。","不正解。アウトプット検証は契約の硬直性に対処しません。","不正解。有効ですが、直接的な低減策は契約の柔軟性設計です。"]},
{n:59,s:"暫定",t:"デジタルプロダクトチームが、機密性の高い顧客データを処理する新しいオンラインサービスを構築しています。開発中に、アクセス制御、データ保護メカニズム、安全な情報の取り扱いがプロダクトに組み込まれ、テストで検証されていることをリリース前に確実にする必要があります。\nこのシナリオにおいて、管理プラクティスは「構築」活動をどのように支援するのが最も効果的ですか？",c:["プロダクトの構築およびテスト活動の一部として、セキュリティ管理策を組み込み、検証することによって","インシデントからのフィードバックを収集し、得られた教訓を今後のプロダクト強化に適用することによって","許容されるユーザーの行動を定義し、サービス利用時のセキュリティインシデント発生の可能性を低減することによって","ユーザーのニーズを文書化して、情報へどの程度安全にアクセスすべきかを判断することによって"],a:0,e:["正解。情報セキュリティ管理は、構築とテストの一部としてセキュリティ管理策を組み込み検証することで「構築」を支援します。","不正解。インシデントからの学習は「サポート」段階の貢献です。","不正解。利用時の行動定義は運用・提供段階に関わります。","不正解。ニーズの文書化は事業分析（発見・設計）の貢献です。"]},
{n:60,s:"暫定",t:"【ITIL レンタカーシナリオ】ICR は統合モバイルアプリの新しい AI 対応機能の設計を確定し、必要なクラウドキャパシティとスペシャリストスキルも確認済みです。サムのチームは共有アプリフレームワーク内で機能を開発し、予約・支払いモジュールとインテグレーションし、ユニット/インテグレーションテストを実施し、セキュリティ管理策を検証し、パイロット開始前に運用ランブックを準備します。\n「構築」活動のどのステップが主として適用されているでしょうか？",c:["ソリューション設計を評価し、アーキテクチャとの整合性とリソースの実現可能性を確認する","構築およびテスト活動を計画し、リソースの利用可能性を確認する","構築およびテスト計画を実行する","移行に向けて、ソリューションと関連ドキュメントを提供する"],a:2,e:["不正解。設計評価は開発開始前のステップで、すでに完了しています。","不正解。リソース確認も済んでおり、実際の開発とテストが進行中です。","正解。開発、インテグレーション、テスト実施、管理策の検証は「構築およびテスト計画を実行する」ステップです。","不正解。成果物の引き渡しは構築の最終ステップで、パイロット前の準備段階には該当しません。"]},
{n:61,s:"暫定",t:"プロダクトチームはデジタルサービスの更新版を頻繁にリリースしていますが、各リリースで予期しない不具合が発生します。1つの課題を修正すると別の箇所で新たな問題が発生することが多く、デプロイには多大な手作業の労力が必要で、チームは変更を迅速にリリースする自信を持てていません。\nこのシナリオで説明されている課題に最もよく対処できる推奨事項はどれですか？",c:["将来のスケーラビリティと拡張性を支えるアーキテクチャスタイルを選択する","運用の可視性を高めるために、サービスにダッシュボードとアラートを実装する","すべての利害関係者が文書化されたプロダクトデザインを理解できるように拡充する","変更を検証し手作業によるエラーを減らすために構築、テスト、デプロイの各ステップを自動化する"],a:3,e:["不正解。アーキテクチャ選択は重要ですが、手作業のデプロイと検証不足には対処しません。","不正解。可視性の向上は検知に役立ちますが、不具合の流入を防ぎません。","不正解。文書の充実だけでは回帰不具合を防げません。","正解。構築・テスト・デプロイの自動化（継続的インテグレーション）により、変更を確実に検証し手作業エラーを減らせます。"]},
{n:62,s:"暫定",t:"新しいバージョンのデジタルサービスが稼働環境にリリースされた直後、ユーザーから応答時間の遅さとセキュリティ上の弱点がレポートされました。調査の結果、合意された要件に基づく体系的なチェックが実施されていれば、リリース前に特定できていたことが分かりました。\nサービスの妥当性確認およびテストプラクティスは、この課題をどのようにすれば最も効果的に防止できていたと言えますか？",c:["リリースのタイミングを計画し、関連する利害関係者とのコミュニケーションを調整する","移行後のサービスをサポートするテクノロジーインフラストラクチャを準備する","合意された要件を満たしていることを、サービスのリリース前に検証する","将来の改善に向けたフィードバックを収集するために、移行の成果をレビューする"],a:2,e:["不正解。これはリリース管理の役割です。","不正解。これはインフラストラクチャ・プラットフォーム管理の役割です。","正解。サービスの妥当性確認およびテストは、リリース前に合意された要件（パフォーマンスやセキュリティを含む）への適合を検証します。","不正解。事後レビューは今回の問題をリリース前に防げません。"]},
{n:63,s:"暫定",t:"【ITIL レンタカーシナリオ】ICR は自動運転ライドの予約能力を構築・テスト完了しました。全市場でのリリース前に、2か国でコントロールされたパイロットを調整します。チームはトレーニング資料を準備し、インシデント対応手順を整備し、モニタリングダッシュボードの有効化を確認し、デプロイ時間帯をスケジュールし、運用サポートのためのリソース可用性を確認しています。\n「移行」活動のどのステップが主として適用されていますか？",c:["ソリューションと移行要件を評価する","移行活動を計画し、リソースの利用可能性を確認する","移行計画を実行する","移行結果を利害関係者に伝達する"],a:1,e:["不正解。要件の評価はすでに完了しています。","正解。資料準備、手順整備、ダッシュボード確認、デプロイ時間帯のスケジュール、リソース可用性の確認は、移行活動の計画ステップです。","不正解。実際のデプロイはまだ行われていません。","不正解。結果の伝達は移行実行後のステップです。"]},
{n:64,s:"暫定",t:"【ITIL レンタカーシナリオ】サムはシステム構成図、インターフェース詳細、構成設定、デプロイ手順の存在を確認します。レビューでオマールは、構成値がリポジトリ間で異なり、バージョン表記に一貫性がなく、特定コンポーネントの責任が不明確であることに気付きます。本番移行の予定期間が近づいており、マックスはリリース後の運用の保証を求めています。\nオマールは、リリースを承認する前に何をすべきですか？",c:["成果物を定義されたオーナーシップと一貫したバージョンで整合する","モニタリングを拡張して構成の差分を検出する","リージョン間で追加のインテグレーション検証を実施する","リリース時期を確定し、文書は後で調整する"],a:0,e:["正解。移行は、文書・構成・バージョン・責任の一貫性が確保され、環境の準備が整っていることを前提とします。","不正解。検出を強めても根本の不整合と責任不明は残ります。","不正解。追加検証ではオーナーシップの不明確さに対処できません。","不正解。文書を後回しにすると移行後の不安定を招きます。"]},
{n:65,s:"暫定",t:"ある大学が、新しいクラウドベースの学生向け学習ポータルを導入しています。チームは各タスクに実行責任があるオーナーを割り当て、必要な労力を見積もり、ボトルネックを回避するためにタスク間の依存関係を文書化します。\nこの活動で作成されているのは、どのアウトプットが最も可能性が高いですか？",c:["移行計画","運用計画","要件アセスメントレポート","IT 資産台帳"],a:0,e:["正解。タスクのオーナー割当、工数見積もり、依存関係の文書化は、移行活動の計画ステップのアウトプット（移行計画）です。","不正解。運用計画は稼働後の定常活動を対象とします。","不正解。要件アセスメントは発見・設計段階のアウトプットです。","不正解。資産台帳は IT 資産管理の成果物です。"]},
{n:66,s:"暫定",t:"稼働中のデジタルサービスが、繰り返しサービスの中断を起こし、復旧自体は迅速に行われるものの、同じ問題が継続して発生しています。一時的な対処によって運用上の労力が増大し、サービスの信頼性が徐々に低下していきます。\n問題管理プラクティスは、この状況への対応を最も効果的に支援するために、どのように活用されるべきですか？",c:["サービスの課題をより早期に検知して解決できるよう、モニタリングのしきい値やダッシュボードを調整することによって","再発するインシデントを分析し、既知の課題のコントロールと予防方法を改善することによって","一時的な回避策を一貫して適用するため、運用上の変更を調整することによって","サービスパフォーマンスデータをレビューし、将来の改善計画に向けた傾向を特定することによって"],a:1,e:["不正解。これはモニタリングとイベント管理の役割です。","正解。問題管理は、繰り返されるインシデントの原因を分析し、既知のエラーを管理・予防することで信頼性を回復させます。","不正解。回避策の反復は根本原因を解消しません。","不正解。これは継続的改善やサービスレビューの役割に近い対応です。"]},
{n:67,s:"暫定",t:"稼働中のデジタルサービスの日常の運用において、チームはシステムの行動を綿密に監視し、合意されたしきい値に対するサービスパフォーマンスを追跡し、発生したサービス障害を記録します。\nこの作業によって最も直接的に生成される「運用」活動のアウトプットはどれですか？",c:["サポート方法の変更を反映した更新済み運用手順","稼働中サービスのモニタリングから生成されるパフォーマンス指標、イベント記録、およびログ","繰り返し発生する障害のインパクトを軽減するために作成されたワークアラウンドと既知の課題の記録","一定期間にわたる運用データの分析から導き出された改善提案"],a:1,e:["不正解。手順の更新はサポート・移行側の成果物です。","正解。監視と記録によるパフォーマンス指標・イベント記録・ログは「運用」の直接的なアウトプット（プロダクトパフォーマンスの記録およびレポート）です。","不正解。回避策と既知のエラーは問題管理の成果物です。","不正解。改善提案は分析後の二次的なアウトプットです。"]},
{n:68,s:"暫定",t:"【ITIL レンタカーシナリオ】ICR は新市場拡張後のグローバル予約プラットフォームを安定化しています。システムは安定しているものの、パフォーマンスレビュー、セキュリティ検査、コスト評価などの定期活動が地域ごとに一貫性なく実施されています。チームは、年間を通して繰り返し実施されるプラットフォーム活動の体系的なサイクルを確立し、各活動に必要なツールと専門知識を特定し、担当者が正式に責任を負うようにします。\nこのシナリオは、「運用」活動のどのステップを説明していますか？",c:["移行結果を利害関係者に伝達する","運用モニタリングと是正措置を実行する","運用活動を計画し、リソースの利用可能性を確認する","運用結果を利害関係者に伝達する"],a:2,e:["不正解。移行活動のステップであり、運用のステップではありません。","不正解。実行段階ではなく、定期活動の体系化と責任・リソースの確認が中心です。","正解。繰り返しの運用活動をサイクルとして計画し、必要なツール・専門知識・責任者を確認するステップです。","不正解。結果の伝達は実行後のステップです。"]},
{n:69,s:"暫定",t:"デジタルサービスは稼働していますが、運用チームはサービスの健全性を把握するために孤立したツールと非公式な更新情報に頼っています。パフォーマンスの課題はユーザーに影響が出て初めて発見され、傾向の説明も困難です。\nこの状況に対処するには、どの重要成功要因が最も適していますか？",c:["拡張性の高いインフラストラクチャを活用して運用コストを抑えながらパフォーマンスを維持する","得られた教訓を、ランブック、アラートおよびセーフガードに反映し、耐障害弾力性を向上させる","日々の運用業務にセキュリティチェックとコンプライアンスコントロールを組み込む","共有の運用指標とパフォーマンス指標によるエンドツーエンドの可視性を確立する"],a:3,e:["不正解。スケーラビリティはここでの主問題ではありません。","不正解。教訓の反映は有効ですが、可視性の欠如が根本原因です。","不正解。セキュリティ統合は別の成功要因です。","正解。共有指標によるエンドツーエンドのオブザーバビリティ確立が、孤立したツールと後手の意思決定という課題に直接対処します。"]},
{n:70,s:"暫定",t:"【ITIL レンタカーシナリオ】ICR はモビリティサービスを支えるためにモバイルプラットフォームを急速に拡大しました。厳しいリリーススケジュールのために、一時的なアーキテクチャ上の妒協や不完全な文書化、短期的な修正を導入し、その後見直されませんでした。時間の経過とともに不安定性が増大し、依存関係の理解不足からインシデント解決に時間がかかっています。\nこの状況に対処するためには、どの推奨事項を適用すべきでしょうか？",c:["AI を導入する前にデータを構造化する","技術的負債を重大なリスクとして対処する","品質とスピードを重視する","組織の状況に基づいてチームを設計する"],a:1,e:["不正解。AIOps の前提条件に関する推奨事項です。","正解。アーキテクチャ上の妒協、未整備の文書、場当たり的な修正の累積は技術的負債であり、重大リスクとして可視化・優先度付け・返済すべきです。","不正解。方向性としては正しいものの、すでに累積した負債への対処を直接示していません。","不正解。チーム設計は技術的負債の直接的な対処策ではありません。"]},
{n:71,s:"暫定",t:"日々のサービス提供において、ユーザーはサービスの使い方に関する質問、アクセス課題のレポート、利用可能な選択肢のガイダンスを求めて組織に連絡します。集中化されたチームがこれらのインタラクションを記録し、可能な場合には初期支援を提供し、要求や問題を適切に振り分けます。\nこの活動に最も直接的に実行責任がある管理プラクティスはどれですか？",c:["インシデント管理","サービス要求管理","サービスデスク","関係管理"],a:2,e:["不正解。インシデント管理は障害の解決に特化します。","不正解。サービス要求管理は要求の履行に特化します。","正解。ユーザーとの単一的な窓口として連絡を受け、記録し、初期支援と振り分けを行うのはサービスデスクです。","不正解。関係管理は利害関係者との関係構築を扱います。"]},
{n:72,s:"暫定",t:"あるサービスプロバイダーが、合意済みのサービスコミットメントを、サービスレベル、未処理のサービス要求、提供に影響を及ぼし得る最近のイベントを含めてレビューしました。このレビューに基づき、プロバイダーはサービスをどのように提供するか、またどのようなリソースやツールが必要かを決定します。\nこの活動によって最も直接的に生み出されるアウトプットはどれですか？",c:["提供準備アセスメントレポート","ユーザーフィードバック記録","提供計画および手順","提供記録およびパフォーマンス報告書"],a:2,e:["不正解。アセスメント自体は前ステップで、ここでの主アウトプットではありません。","不正解。フィードバックは提供実行後に収集されます。","正解。コミットメントの確認後に、手順・ツール・リソースを定めた提供計画および手順が作成・調整されます。","不正解。提供記録と報告は実行段階のアウトプットです。"]},
{n:73,s:"暫定",t:"【ITIL レンタカーシナリオ】ICR はサブスクリプション型レンタルモデルを稼働環境へ正常に移行しました。アンナは、3つの地域の顧客向けに有効化する前に、既存の SLA を確認し、サブスクリプションモジュールが合意済みのコミットメントをサポートしていることを検証し、多言語によるサポート対応範囲を確認し、ローンチ週に十分な数のサポート担当者がシフトに入っていることをチェックします。\n「提供」活動のどのステップが、主として適用されていますか？",c:["サービス提供に関するコミットメントと利用可能なソリューションを評価する","提供計画およびリソースの利用可能性を特定し、確認する","提供計画を実行し、利害関係者に提供ステータスを報告する","アプリ中心の提供におけるベンダーとパートナーの責任を定義する"],a:1,e:["不正解（暫定）。SLA の確認は第1ステップですが、本シナリオは対応範囲と人員シフトの確認まで含むため、計画・リソース確認のステップに重心があります。","正解（暫定）。手順・対応範囲・スタッフなど提供に必要なリソースの特定と確認が中心です。","不正解。まだ顧客向けに有効化されていません。","不正解。提供活動の正式なステップではありません。"]},
{n:74,s:"暫定",t:"サービスプロバイダーは、新しい要求ワークフロー、更新されたテンプレート、見直された履行手順など、提供方法の改善を定期的に導入しています。しかしユーザーと提供担当者からは不満が高まっているとレポートされています。何が変わったのか分かりにくくなっており、頻繁な更新期間には満足度も下がっています。\nこの状況に対処するには、どの重要成功要因が最も適していますか？",c:["サービス要求の処理に使用する自動化の水準を高める","最初に限定されたグループに提供の改善を適用し、初期のフィードバックに基づいてアプローチを調整する","最新の提供プロセスを明確に記載するようサービス合意を更新する","より詳細なユーザー意見を収集するために、フィードバック調査を拡充する"],a:1,e:["不正解。自動化の拡大は変更の分かりにくさを解消しません。","正解。改善を小さく限定された範囲に適用し、フィードバックをもとに反復的に調整することが、採用と信頼の低下に直接対処します。","不正解。合意更新だけでは連続する変更の負荷に対処できません。","不正解。調査の拡充は情報収集にとどまり、対処とはなりません。"]},
{n:75,s:"暫定",t:"【ITIL レンタカーシナリオ】ICR は予約変更やアップグレードを迅速化するため、統合モバイルアプリに AI 対応セルフサービス機能を導入しました。自動化率は高いにもかかわらず顧客満足度は低下しています。複雑な案件を人間の担当者に迅速にエスカレーションできないと、ユーザーは不満をレポートしています。\n効果的なサービス提供に関する実践的な推奨事項に最も合致する行動はどれですか？",c:["自動化の範囲をさらに拡大し、運用コストを削減する","AI セルフサービスを導入し、人によるサポートへの明確なエスカレーション閾値を定義する","機能イノベーションに注力するために、提供の指標のモニタリングを減らす","自動化による解決率が 95%に達するまで、顧客による新機能へのアクセスを延期する"],a:1,e:["不正解。自動化拡大だけでは不満の原因であるエスカレーション不足を悪化させます。","正解。セルフサービスと人による支援を組み合わせ、ユーザーが支援レベルを選べるようにすることが推奨されています。","不正解。指標の監視を減らすと問題が見えなくなります。","不正解。アクセスの延期は価値提供を遅らせるだけです。"]},
{n:76,s:"暫定",t:"稼働中のソフトウェアアプリケーションでは、通常サービスを復旧したり、大規模インシデント後のリカバリーを支援したりするために、構成変更や緊急の修正が必要になる場合があります。リスクを分析ずに適用すると、稼働環境が不安定になる可能性があります。\n変更実現プラクティスは、この状況を効果的にサポートするために最もどのように機能しますか？",c:["サービス中断の影響を最小限に抑えるため、修正を迅速に稼働環境へ展開することによって","修正を適用した後のインパクトをモニタリングし、安定性を確認することによって","修正を適用する前に、変更を評価し、承認し、調整することによって","課題の根本的な要因を分析し、再発を防止することによって"],a:2,e:["不正解。迅速な展開は展開管理の役割であり、リスク評価を省くことの正当化にはなりません。","不正解。事後の監視は必要ですが、変更実現の中核は事前の評価と承認です。","正解。変更実現は、変更のリスク評価・承認・スケジューリングを通して安全な変更適用を可能にします。","不正解。根本原因分析は問題管理の役割です。"]},
{n:77,s:"暫定",t:"パターンや異常を特定し、プロアクティブな分析を可能にする AI の能力を表しているものはどれですか？",c:["生成","明確化","認知","コミュニケーション"],a:2,e:["不正解。生成は新しいコンテンツや成果物を作る能力です。","不正解。明確化は意図や要件を引き出し整理する能力です。","正解。認知は、データからパターンや異常を認識し、プロアクティブな分析を可能にする AI 能力です。","不正解。コミュニケーションは対話や情報伝達に関する能力です。"]},
{n:78,s:"暫定",t:"【ITIL レンタカーシナリオ】統合モバイルアプリで新しいサブスクリプション機能をリリースした後、ICR は特定の地域で支払い取引の失敗件数が急増していることを検知します。モニタリングシステムが課題を検知し、サポートチームが顧客と収益へのインパクトを評価します。彼らはこの課題を高い優先度として分類し、多数のアクティブユーザーに影響していると判断します。\n「サポート」活動のどのステップが主として適用されているでしょうか？",c:["インシデントと災害を特定し、評価する","インシデント/災害へ対応し、通常運用・提供を復旧する","サポート行動を見直し、報告する","運用計画を実行し、利害関係者に運用状況を報告する"],a:0,e:["正解。検知・インパクト評価・優先度分類は、サポート活動の第1ステップ「インシデントと災害を特定し、評価する」です。","不正解。復旧行動はまだ開始されていません。","不正解。レビューと報告は解決後の最終ステップです。","不正解。これは「運用」活動のステップです。"]},
{n:79,s:"暫定",t:"あるソフトウェア企業は、個々のエンタープライズ顧客向けにカスタムアプリケーションを開発しています。各ソリューションは顧客の要件に合わせてカスタマイズされています。顧客はソリューションの具体化と成果の検証に積極的に関与し、一方でソフトウェア企業がプロダクトの設計と構築を行います。\nこのオペレーティングモデルでは、通常、「移行」活動に実行責任があるのは誰ですか？",c:["顧客とソフトウェアプロバイダーが共同で","顧客のビジネスユーザーのみ","ソフトウェア開発チームのみ","引き継ぎ後の外部マネージドサービスプロバイダー"],a:0,e:["正解。カスタム開発型のオペレーティングモデルでは、稼働環境への導入は顧客環境で行われるため、移行の実行責任は顧客とプロバイダーの共同となります。","不正解。顧客単独では技術的な移行を完結できません。","不正解。提供者単独では顧客環境での準備や受け入れを完了できません。","不正解。シナリオに外部マネージドサービスプロバイダーは登場しません。"]},
{n:80,s:"暫定",t:"ITIL フレームワークにおいてプロジェクト管理が重要なのは、なぜですか？",c:["日々のサービス業務を統制する","プロダクトおよびサービスマネジメントのプラクティスに取って代わる","プロダクトおよびサービスの導入とトランスフォーメーションをサポートする","サービスレベルの目標と指標を定義する"],a:2,e:["不正解。日々の運用の統制は運用・提供活動の役割です。","不正解。プロジェクト管理はプロダクトおよびサービスマネジメントを置き換えません。","正解。プロジェクト管理は、新規導入や大規模な変革を統制された形で進めることを支援します。","不正解。目標と指標の定義はサービスレベル管理の役割です。"]}
];
const OFFICIAL_41_80={
76:{s:"9.1.2",a:2,e:["不正解。修正を迅速にデプロイすることは、実施前の体系的なリスク評価よりも、復旧のスピードを重視しています。「インシデント／災害へ対応し、通常運用・提供を復旧する」。迅速な復旧はインシデント対応の一部です。このシナリオは、稼働環境に変更を適用する前にリスクを分析する必要性を強調しています（参照先 10.2）","不正解。実施後にインパクトのモニタリングを行うことは成果を検証しますが、デプロイ前にリスクが評価されていることを保証するものではありません。「サポート行動を見直し、報告する」。レビュー活動は、対応および復旧の各ステップの後に実施されます。状況に対しては、変更を導入する前に体系的な統制が必要です（参照先 10.2）","正解。変更実現は、稼働環境へのデプロイ前に、変更内容を体系的に評価し、認可することを可能にします。「変更実現：インシデントを解決し、災害復旧計画を実行するために、稼働環境で必要な変更を実装する」。修正を実装する前に体系的な評価と認可を適用することで、リスクポリシーおよびビジネスへの影響との整合性を確保できます（参照先 10.3 表 10.2）","不正解。根本原因の分析は改善の支援にはなりますが、デプロイ前の変更認可の代わりにはなりません。「インシデントを調査し、プロダクトおよびサービスのエラーを検出して、改善を開始する」（参照先 10.3 表 10.2）"]},
77:{s:"10.2.1",a:2,e:["不正解。創造とは、パターンを分析するのではなく、新しいアウトプットを生成することを指します。AI は、プロンプトやトリガーに応じてまったく新しい出力を生成します（参照先 1.4 表 1.2）","不正解。明確化は、パターンを特定することではなく、既存のコンテンツの理解を深めることに重点を置きます。「AI は、既存のコンテンツを要約、言い換え、再構成、または翻訳することで、ユーザーがそれを見つけ、理解し、操作しやすくし、改善できるよう支援します」（参照先 1.4 表 1.2）","正解。認知とは、パターンを検出し、プロアクティブな分析を可能にすることです。「AI はデータ全体からパターンや異常、潜在的なインサイトを特定し、先を見越した検知・予測・分析を可能にします」（参照先 1.4 表 1.2）","不正解。コミュニケーションとは、分析的な検出ではなく、やり取りのためのインターフェースとして機能することを指します。「AI はコミュニケーションインターフェースとして機能し、ユーザーがサービスやシステムと自然にやり取りできるよう支援します」（参照先 1.4 表 1.2）"]},
78:{s:"9.2.2",a:0,e:["正解。これは、問題の検知、インパクト評価、分類（クラシフィケーション）、優先度付けに焦点を当てています。「検知は、ログ、指標、トレース、そしてパートナーレベルの SLA データを一元化されたインシデント管理システムにストリーミングする統合オブザーバビリティプラットフォームから始まります」（参照先 10.2.1.1）","不正解。このステップは、特定とアセスメントの後に、是正措置が講じられる段階で行われます。復旧はまだ開始されておらず、チームは引き続きインパクトと優先度を評価しています。「インシデントが分類されると、実行責任があるリードがチケットシステム上でワンクリックすることで、適切なランブックを起動します」（参照先 10.2.1.2）","不正解。レビューと報告は、対応活動が完了した後に行われます。解決が行われた形跡も、事後の報告が進行中である兆候もありません。「通常サービスが復旧すると、アナリティクスパイプラインがログ、チケット履歴、ランブック実行タイムスタンプ、および対応中に生成された共有会議向けブリーフィング資料を集約します」（参照先 10.2.1.3）","不正解。この選択肢は「サポート」ではなく「運用」の活動を指します。インシデントの検知とアセスメントは、日常的な運用業務の実行ではなく、サポートのワークフローに属します。「日々の運用スケジュールは、サービスの健全性を維持し、早期警告サインをいち早く把握し、チームを組織の戦略的目標と整合させるのに役立ちます」（参照先 8.2.1.3）"]},
79:{s:"10.1.1",a:0,e:["正解。ここで説明されているオペレーティングモデルは、特定のエンタープライズ顧客向けのカスタムソフトウェア開発に該当し、移行に対する責任が共有される形態です。「特定の顧客要件を満たすソフトウェアを開発し、提供する。『設計』、『取得』、『構築』、『移行』（部分的に）。発見：顧客。移行：顧客および／またはサードパーティーと共同実施」（参照先 11.3 表 11.2）","不正解。ビジネスユーザーはライフサイクルの後半の活動に関与しますが、移行に対して単独で実行責任があるわけではありません。「提供、サポート：顧客」。これは、このパターンでは移行だけでなく、提供およびサポートについても、通常は顧客が実行責任があることを示しています（参照先 11.3 表 11.2）","不正解。このオペレーティングモデルにおける移行の全責任を、開発チームだけが負うわけではありません。「『設計』、『取得』、『構築』、『移行』（部分的に）」。移行はベンダーの適用範囲内に一部のみ含まれるものとして説明されており、ソフトウェア開発チームだけで実行されるわけではないことを示しています（参照先 11.3 表 11.2）","不正解。外部のマネージドサービスプロバイダーが、異なるバリューチェーンパターンにおける移行の実行責任があります。「取得、移行、運用：外部マネージドサービスプロバイダー」。この責任は、シナリオで説明されているカスタムなエンタープライズ開発モデルではなく、サードパーティのテクノロジーサービスに焦点を当てたパターンに適用されます（参照先 11.3 表 11.2）"]},
80:{s:"10.2.5",a:2,e:["不正解。プロジェクト管理は、日々のサービス運用を統制するものとしては説明されていません。ITIL サービスは提供と運用サポートに対応しており、一方でプロジェクト管理は一般的なマネジメントプラクティスとして分類されます。「一般的マネジメントプラクティス：あらゆるプロダクトやサービスに適用できるとともに、組織の一般的な管理活動にも適用できる」（参照先 12.3）","不正解。プロジェクト管理は、ITIL の管理プラクティスの一つとして提示されており、プロダクトおよびサービスマネジメントプラクティスの代替として提示されているわけではありません。ITIL には、価値の創造を総合的に実現する複数のプラクティスが含まれています。「ITIL では、34 の管理プラクティスを２つのグループに分類しています。プロダクトおよびサービスマネジメントプラクティス［…］一般的なマネジメントプラクティス［…］」（参照先 12.3）","正解。プロジェクト管理が重要なのは、組織が常に変更やトランスフォーメーションを実行しているためです。ITIL は、構造化されたトランスフォーメーションのためのガイダンスと、デジタルトランスフォーメーションの取り組みで用いられる他の知識体系との互換性を強調しています。「ITIL がデジタルプロダクトおよびサービスのマネジメントに焦点を当てている一方で、PRINCE2 は、これらのデジタルプロダクトやサービスを導入または変革するプロジェクト、ならびにバリューシステムへの変更を管理するためのツールを専門家に提供します」（参照先 12.4.2）","不正解。サービスレベルの目標と指標は、運用指標を置き換えたり定義したりするプロジェクト管理ではなく、特定の ITIL 管理プラクティスに関連付けられます。「ITIL では、34 の管理プラクティスを２つのグループに分類しています。プロダクトおよびサービスマネジメントプラクティス［…］一般的なマネジメントプラクティス［…］」（参照先 12.3）"]},
71:{s:"8.1.2",a:2,e:["不正解。インシデント管理は、インシデント発生後に通常のサービス運用を復旧することに特に焦点を当てています。「これには、可用性、パフォーマンス、サポート、ユーザーコミュニケーション、商品の提供、サービス要求の履行について、誰が責任を負うかを合意しておくことが含まれます」（参照先 9.1.2.3）","不正解。サービス要求管理は要求の履行を扱いますが、このシナリオで説明されているのは、やり取りを受け付け、記録し、支援し、振り分ける集中型のチームであり、これはサービスデスク機能とより直接的に一致します。「最低限、このチャネルは相談とフィードバックのために使用されます」（参照先 9.1.2.1）","正解。サービスデスクは、インシデントやサービス要求を受け付けて振り分ける単一の窓口として定義されており、これはまさにこのシナリオを正確に表しています。「『提供』活動の目的は、プロダクトに基づくサービスが、すべての関連するタッチポイントにおいて、合意された期待に沿って、信頼性と安全性をもって提供されるようにすることです」。また、これには「合意されたインターフェース（通常はアプリや Web）を通じてプロダクトへのアクセスを提供すること［…］が含まれます」（参照先 9.1.2）","不正解。関係管理は、日々のユーザーからの問い合わせ対応ではなく、プロバイダーと消費者の間で継続的な価値共創を維持することに重点を置きます。サービス関係管理とは、「合意済みの利用可能なサービス提供物に基づいて継続的な価値の共創を確実にするためにサービスプロバイダーとサービス消費者が共同で行う活動」のことです（参照先 用語集, 9.1.1）"]},
72:{s:"8.2.1",a:2,e:["不正解。アウトプットとして挙げられているものの、このシナリオで説明しているのは、準備状況を評価することではなく、提供計画そのものを作成・調整することです。「提供」のアウトプットには、「［…］提供準備アセスメントレポート、提供計画および手順、［…］」が含まれます（参照先 9.2.2）","不正解。フィードバックは実行後に取得されます。「提供は、履行で終わるわけではありません。［…］ユーザーフィードバックの収集も含まれます」（参照先 9.2.1.3）","正解。このシナリオでは、コミットメント（SLA、サービスリクエスト、イベント）をレビューし、そのうえでサービスをどのように提供するかと、どのリソースが必要かを決定することを説明しています。これは、「提供」活動のステップ２「提供計画およびリソースの利用可能性を特定し、確認する」に相当します。「コミットメントが明確になったら、プロバイダーは提供計画を作成または調整します。これは、コミットメントを満たすために必要となる手順、ツール、および［…］リソースを確認することを含みます」（参照先 9.2, 9.2.1.2）","不正解。パフォーマンスレポートは実行と報告の後に作成されます。「『提供』活動の主なアウトプットは、提供されたサービスです。その他のアウトプットには次のようなものがあります：［…］サービスパフォーマンス、ユーザーフィードバック記録、報告書」（参照先 9.2.2）"]},
73:{s:"8.2.2",a:0,e:["正解。これは、サービスレベル合意書をレビューし、コミットメントに対するソリューションの能力を検証し、顧客アクセスを有効化する前の準備を確実にすることに重点を置いています。「『提供』は、サービス合意で定義されたコミットメントを確認することから始まります。これには、SLA、サービス要求、および提供にインパクトを与える可能性のあるイベントの評価が含まれます」（参照先 9.2.1.1）","不正解。このワークフローのこのステップでは、実行の計画とリソースの確保に重点を置きます。「コミットメントが明確になったら、プロバイダーは提供計画を作成または調整します。これは、コミットメントを満たすために必要となる手順、ツール、および（スタッフ、サプライヤー、自動化機能などの）リソースを確認することを含みます。計画では、提供の過程で説明責任を確保するための役割と責任も定めます」。サポートエージェントのスケジュールを確認することにも言及されていますが、このシナリオの主な焦点は、コミットメントとソリューションの準備状況をレビューすることにあり、構造化された提供実行計画を定義または確認することではありません（参照先 9.2.1.2）","不正解。実行は、提供活動が実施され、そのステータスが報告されるときに行われます。「最終ステップは実行です：サービス要求の履行、オンボーディングおよびオフボーディングの実施、または予定されたサービスアクションの完了を行います」（参照先 9.2.1.3）","不正解。ベンダーとパートナーの責任は、提供の観点に関係します。「ユーザーの体験はプロダクトの能力と、それを取り巻くサービスの提供方法の両方によって形作られるため、ベンダーとそのパートナーであるサービスプロバイダー間で責任分担を明確に定義することが極めて重要です」（参照先 9.1.2.3）"]},
74:{s:"8.3.1",a:1,e:["不正解。自動化を進めることは、頻繁な提供更新時に生じる混乱、信頼の低下、あるいは変更に対する疲労に直接対処するものではありません。「現代の提供では、チャットボットやバーチャルエージェント、予測型要求ルーティングなどの AI 駆動型機能がますます活用されています」。しかし、自動化は人との対話とのバランスを取らなければなりません。消費者は、特に中断や不確実性が生じている場面において、共感と透明性を求めています（参照先 9.1.3）","正解。改善を限定されたグループに適用し、フィードバックに基づいて調整することで、頻繁な更新時に生じる変更疲れや不満に直接対処できます。「変更による疲労を防ぐ。提供の変更中の消費者満足度。スタッフのエンゲージメントスコア。提供の変更に関連する苦情の減少」。また、「変更実現を提供プロセスの変更に適用する。パイロットで変更内容をテストする。透明性の高いコミュニケーション戦略を用いる」（参照先 9.4.2, 9.4.3）","不正解。サービス契約は、期待と責任を明確に定義します。しかし、このシナリオでは、頻繁な提供更新が行われている期間に混乱が生じ、満足度が低下していることが示されています。合意内容の文書化を更新することは、提供の変更がどのように導入され、どのようなペースで進められ、どのように受け止められるかという点には直接対応していません（参照先 9.1.3）","不正解。提供には、通常の実行の一環としてユーザーフィードバックの収集がすでに含まれています。アンケートを拡充するとフィードバックの収集量は増えますが、提供の変更をどのように導入し、どのようなペースで進め、どのように管理するかという点には直接対応しません。「提供は、履行で終わるわけではありません。証拠の取得、結果の報告、ユーザーフィードバックの収集も含まれます」（参照先 9.2.1.3）"]},
75:{s:"8.3.2",a:1,e:["不正解。実務的な推奨事項は、人による対応へのアクセスを犠牲にしてまで自動化を最大化することを求めてはいません。エスカレーション経路を設けずに自動化を進めることは、この推奨事項と矛盾します。「一般的な問い合わせには AI を活用したセルフサービスを導入しつつ、必要な場合には必ず担当者につながるようエスカレーションの閾値を定義する」（参照先 9.4.3）","正解。これは、人によるエスカレーションが行われないことにより、満足度が低下していることを示しています。「一般的な問い合わせには AI を活用したセルフサービスを導入しつつ、必要な場合には必ず担当者につながるようエスカレーションの閾値を定義する」。この活動は、自動化の効率性と利用しやすい人的サポートとのバランスを取ることで問題に直接対処しており、書籍のガイダンスと完全に一致しています（参照先 9.4.3）","不正解。提供に関する推奨事項は、監督を減らすことではなく、体系的な評価とガバナンスを重視しています。「提供の計画とレビューの際に、チェックリストとして４つの側面を活用する」（参照先 9.4.3）","不正解。推奨事項は、自動化を最大化するまで価値を留保することではなく、提供体験を管理し中断を回避することに重点を置いています。「変更実現を提供プロセスの変更に適用する」（参照先 9.4.3）"]},
61:{s:"5.3.1",a:3,e:["不正解。スケーラブルなアーキテクチャを選択することは長期的な成長を支えますが、ここでの核心的な問題は、不安定なリリースと手動デプロイ時のエラーです。「堅実な『構築』活動は、システムコンポーネント［…］を定義する包括的なアーキテクチャから始まります」（参照先 6.4.1）","不正解。ダッシュボードやアラートは運用上の可視性を向上させますが、構築やデプロイの過程で持ち込まれる欠陥を防ぐことはできません。「［…］KPI を定義し継続的に追跡することで、ボトルネックを可視化し、［…］データドリブンなベースラインが構築されます」（参照先 8.4.1）","不正解。文書化は理解を深めますが、欠陥の流出や手動デプロイのリスクを低減することはありません。「詳細な設計仕様、［…］共有する参照情報として機能し、［…］あいまいさを最小限に抜え、高コストな手戻りを防ぎます」（参照先 6.4.1）","正解。この問題は欠陥、リグレッション、手作業による労力に起因しており、自動化はリリース前にすべての変更を検証することでこれに直接対処します。「自動化された CI パイプラインにユニットテスト、インテグレーションテスト、UI テストの各スイートを組み込むことで、各コードコミットがあらかじめ定義された品質ゲートに照らして検証されることが保証されます」（参照先 6.4.1）"]},
62:{s:"6.1.2",a:2,e:["不正解。リリース時期の計画は、デプロイの調整には役立ちますが、本番稼働前にパフォーマンス要件とセキュリティ要件が検証されることを保証するものではありません。「移行活動を計画し、リソースの利用可能性を確認する」の一部であり、要件の検証ではありません（参照先 7.2）","不正解。インフラストラクチャの準備は技術的な準備を支援しますが、サービスが合意された機能要件および非機能要件を満たしていることを確認するものではありません。「インフラストラクチャおよびプラットフォーム管理：移行されたプロダクトまたはサービスを支援するために、インフラストラクチャコンポーネント（サーバー、クラウド、ネットワーク）を準備します」（参照先 7.3 表 7.2）","正解。記載されている問題（パフォーマンスおよびセキュリティ上の弱点の見落とし）は、リリース前に要件に基づく検証を体系的に行っていれば防止できていたはずです。「サービスの妙当性確認およびテスト：構築されたプロダクトまたはサービスが、パフォーマンスやセキュリティ基準を含む要件を満たしていることを検証します」（参照先 7.3 表 7.2）","不正解。移行後レビューは将来のリリースの改善には役立ちますが、デプロイ後に実施されるため、リリース前の欠陥を防ぐことはできません。「妙当な安定化期間を設けた後、移行そのものに焦点を当てた振り返り（レトロスペクティブ）を実施します」（参照先 7.4.3）"]},
63:{s:"6.2.2",a:1,e:["不正解。ソリューションと移行要件の評価は、詳細なロールアウト活動の計画に先立って行われます。このステップでは、準備を評価し、移行に必要な要件を特定することに重点を置きます。「デジタルプロダクトを開発から運用へ移行する際の最初のステップは、ソリューションそのものの体系的なアセスメントと、円滑な引き継ぎを可能にする正確な要件の明確化です」（参照先 7.2.1.1）","正解。これは、ロールアウトに向けた体系的な準備、モニタリングの検証、トレーニング準備、および運用リソースの可用性の確認を示しています。これらの活動は、計画ステップと直接結びついています。「移行計画は、追跡と責任の所在の明確化が可能となるよう、高レベルの移行目標を、個別の時間枠付き活動に分解することから始まります」（参照先 7.2.1.2）","不正解。実行フェーズでは、実際のデプロイを行い、稼働環境でソリューションを有効化し、ロールアウト中に発生するリアルタイムの問題を管理します。「実行フェーズは、全体目標を改めて確認し、すべての前提条件が整っていることを確認し、移行ウィンドウにおける明確な意思決定構造を定義するキックオフミーティングから始まります」（参照先 7.2.1.3）","不正解。移行結果の伝達は、デプロイ活動が完了し、報告可能な成果が得られてから行われます。「移行結果の明確なコミュニケーションは、多くの場合、全体的な結果［…］を強調した簡潔なエグゼクティブサマリーから始まります」（参照先 7.2.1.4）"]},
64:{s:"6.3.2",a:0,e:["正解。このシナリオでは、本番稼働直前に構成値の不整合、バージョンの不一致、オーナーシップの不明確さが浮き彫りになっています。リリースを承認する前に、オマールは文書化、構成の記録およびオーナーシップに関する責任が整合し一貫していることを確認する必要があります。これにより移行リスクが低減され、デプロイ後の運用上の混乱が防止されます。「複雂な移行では重要度の低い変更を凍結し、リリースのケイデンスを採用する」（参照先 7.4.3 表 7.4）","不正解。この選択肢は、予防的な規律ではなく、事後的な統制を反映しています。モニタリングの強化によって構成上の問題を検出することはできますが、リリース前に根本的な不整合やガバナンス上の欠落を解消することはできません。「実行フェーズは、全体目標を改めて確認し、すべての前提条件が整っていることを確認し、移行ウィンドウにおける明確な意思決定構造を定義するキックオフミーティングから始まります」（参照先 7.2.1.3）","不正解。追加のインテグレーション検証は、「移行計画の実行」プロセスにおける実行レベルの保証に関連します。しかし、ここで説明されている問題は、インテグレーション作業のロジックの失敗ではなく、成果物の不整合とオーナーシップの不明確さです。テストを増やしても、バージョンの不整合やガバナンスのギャップは解消されません。「デジタルプロダクトを開発から運用へ移行する際の最初のステップは、ソリューションそのものの体系的なアセスメントと、円滑な引き継ぎを可能にする正確な要件の明確化です」（参照先 7.2.1.1）","不正解。この選択肢は、移行のベストプラクティスと矛盾しています。既知の不整合があるにもかかわらずリリースを承認することは、混乱を最小限に抜え、本番移行前のリスクを低減することを目的とした「ソリューションおよび移行要件を評価する」の意図と矛盾します。文書化の修正をリリース後まで遅らせると、運用上の不確実性が高まり、信頼性が損なわれます（参照先 7.2.1.1）"]},
65:{s:"6.2.2",a:0,e:["正解。責任の割り当て、労力の見積もり、ボトルネックを回避するための依存関係の文書化は、「移行活動を計画し、リソースの可用性を確認する」ステップの中で行われる「移行」活動の一部です。「各タスクに実行責任があるオーナー、想定労力、現実的な期限を割り当て、ボトルネックを避けるために依存関係が明示的に把握されるようにしてください」（参照先 7.2.1.2）","不正解。「運用」活動は、稼働中のプロダクトを運用し、そのパフォーマンスと可用性を確保することに関わるものであり、タスクの計画、労力の見積もり、実施に向けた依存関係のマップングを行うことではありません（参照先 8.2.1.2）","不正解。要件アセスメントは、タスクの担当者を割り当てたり労力を見積もったりすることではなく、構築前に設計要件をレビューし妙当性を確認することに重点を置きます。「ソリューション設計を評価する目的は、［…］設計要件が明確であり、構築仕様が期待される価値の創出に寄与することです」（参照先 6.2.1.1）","不正解。IT 資産のライフサイクル管理は、タスクのオーナーシップ計画や労力見積もりではなく、金銭的価値のあるコンポーネントのライフサイクルを管理することに関係します。IT 資産管理プラクティスとは、「すべての IT 資産のライフサイクル全体を計画し管理するプラクティス」（参照先 用語集）"]},
66:{s:"7.1.2",a:1,e:["不正解。モニタリングは問題を早期に検出するのに役立ちますが、繰り返し発生する障害の根本原因には対処しません。「これには、モニタリング、パフォーマンスチューニング、バックアップ、ハウスキービング、インシデントやサービス低下を未然に防ぐための技術的保守といった、日常的な運用タスクが含まれます」（参照先 8.1.2）","正解。このシナリオは、繰り返し発生する障害と信頼性の低下を示しています。「運用」活動の目的は、プロダクトが意図したとおりに稼働し、劣化を防ぐことです。繰り返し発生する問題へ対処することで、信頼性が向上します。「『運用』活動の目的は、デジタルプロダクトおよびサービスや関連システムを維持・監視し、最適なパフォーマンスと信頼性を確保することです」（参照先 8.1.1）","不正解。一時的な回避策を継続的に適用することで応答は安定する可能性がありますが、再発する問題自体を解消することにはなりません。「『運用』活動には、稼働中の利用においてプロダクトを信頼できる状態で、安全かつ高いパフォーマンスで維持するために必要な、継続的な技術的・運用上の作業が含まれます」（参照先 8.1.2）","不正解。データのレビューは分析を支援しますが、根本原因に対処しなければ、信頼性は引き続き低下します。成功の主要指標には次のものが含まれます。「稼働プロダクトの信頼性、パフォーマンス、情報セキュリティ」（参照先 8.1 表 8.1）"]},
67:{s:"7.2.1",a:1,e:["不正解。手順の更新は、日々のモニタリングの直接的なアウトプットではなく、改善活動の結果を反映するものです。「運用」の主要なアウトプットの一つは、「プロダクトパフォーマンスの記録およびレポート」です（参照先 8.1 表 8.1）","正解。このシナリオでは、システムの行動の観察、しきい値の追跡および障害の記録について説明しており、これらによって「運用」活動のアウトプットとして、モニタリングデータとパフォーマンス記録が直接生成されます。「『運用』の主なアウトプットは、運用中のプロダクトとサービスです。その他のアウトプットには、保守記録や保守報告書［…］が含まれます」（参照先 8.2.2）","不正解。回避策や既知の問題の記録を作成することは、主としてサービスの復旧と再発防止（サポート・問題管理）に関連しており、定常的な運用モニタリングの中核的なアウトプットとは位置付けられません。「『運用』活動には、稼働中の利用においてプロダクトを信頼できる状態で、安全かつ高いパフォーマンスで維持するために必要な、継続的な技術的・運用上の作業が含まれます」（参照先 8.1.2）","不正解。改善の提言は後の分析から得られる場合がありますが、モニタリングの直接的なアウトプットはパフォーマンス記録とイベント記録です。「測定および報告：サービスのパフォーマンス、インシデント、および運用トレンドのモニタリング」（参照先 8.3 表 8.2）"]},
68:{s:"7.2.2",a:2,e:["不正解。この選択肢は、シナリオがいかなるライフサイクルイベントの報告結果についても説明していないため、適合しません。これは「移行」活動のステップです。「移行結果の明確なコミュニケーションは、多くの場合、全体的な結果、当初の計画からの乖離点、そして移行がビジネスに与えるインパクトを強調した簡潔なエグゼクティブサマリーから始まります」（参照先 7.2.1.4）","不正解。「運用」における実行とは、モニタリングシステムを能動的に稼働させ、アラートに対応し、是正措置を実施することを指します。このシナリオでは、チームは稼働中のインシデントに対応したり、是正措置を実施したりしていません。その代わりに、定期的な活動を定義し、説明責任を確認しています。「レジリエントなシステムは、プラットフォームを安全で高性能かつ費用対効果に優れた状態に保つ運用タスクを、反復可能なスケジュールで実行することに依存しています」（参照先 8.2.1.2）","正解。このシナリオは、プラットフォーム上で繰り返し実施される活動に対して体系的な実施サイクルを確立し、必要なツールと専門知識を特定し、正式な説明責任を割り当てることを説明しています。これは、反復的な運用業務を整理し、実行前に適切なスキルとリソースが利用可能であることを確認することに重点を置く「運用」ステップと直接一致しています。「レジリエントなシステムは、プラットフォームを安全で高性能かつ費用対効果に優れた状態に保つ運用タスクを、反復可能なスケジュールで実行することに依存しています」（参照先 8.2.1.2）","不正解。これは、パフォーマンス指標やサービス成果を管理側または顧客に報告することを伴います。このシナリオはパフォーマンス報告について説明していません。運用上のルーチンを構築し、準備を確認することに重点を置いています。「日々の運用スケジュールは、サービスの健全性を維持し、早期警告サインをいち早く把握し、チームを組織の戦略的目標と整合させるのに役立ちます」（参照先 8.2.1.3）"]},
69:{s:"7.3.1",a:3,e:["不正解。弾力的なインフラストラクチャはスケーラビリティを向上させますが、ここで説明されている中核的な問題は、サービスの健全性に関する可視性と共通理解の欠如です。「スケーラブルなインフラストラクチャとキャパシティ計画：パフォーマンスとコスト効率性を維持しながら弾力的にスケールできるインフラストラクチャ［…］」（参照先 8.4.1）","不正解。得られた教訓をセーフガードに反映させることは耐障害弾力性を強化しますが、このシナリオが浮き彫りにしているのは、インシデント後の学習の欠如ではなく、分断されたモニタリングと場当たり的な意思決定です。「得られた教訓をモニタリングのしきい値、ランブック、コード上のセーフガードに組み込むことで、各中断が耐障害弾力性向上へのきっかけとなるようにします」（参照先 8.4.1）","不正解。セキュリティ統制は重要ですが、ここで述べられている不安定性の原因は、コンプライアンス上の欠如ではなく、不十分な運用の可視性と受け身の管理にあります。「セキュリティファーストのカルチャーとコンプライアンスガバナンス：［…］運用プロセスが変化する法令および業界標準と常に整合した状態に保たれます」（参照先 8.4.1）","正解。この状況は、共有された指標と全体的な可視性の欠如を明確に示しており、重要な成功要因はまさにこれに直接対処するものです。「エンドツーエンドのプロセス可視性および指標：プロダクトライフサイクル全体を仰瞰し、指標を継続的に追跡することで、チームを共通のサービスレベル目標に結束させます」（参照先 8.4.3 表 8.4）"]},
70:{s:"7.3.2",a:1,e:["不正解。この推奨事項は、高度な分析や AI 機能を導入する前に、データ品質とガバナンスを確保することに関するものです。このシナリオでは、AI に関連するリスクについては言及されていません。ここで説明されている問題は、技術的負債に起因するアーキテクチャ上の近道と運用の不安定性です。「多くの組織は、自社の業務データの全体像を整理する前に AI を導入しようとしています。イベントの相関関係、ガバナンス、標準化がなければ、AI ツールは粗悪な成果物の生成器やノイズの増幅器になってしまいます」（参照先 8.4.3）","正解。このシナリオは、時間的な制約の中で導入され、その後も体系的に対処されることのなかった、アーキテクチャ上の妋協の積み重なり、不完全な文書化、未解決のショートカットについて説明しています。時間の経過とともに、これにより不安定化、復旧の遅延、依存関係の理解不足が生じています。これにより、見直しと是正が必要な技術的負債が生じています。「技術的負債を重大なリスクとして認識し、適切に対処する（プロダクト/運用/サービス全体で可視化し、共有されたトラッキングを行う）」（参照先 8.4.3 表 8.4）","不正解。品質とスピードのバランスを取ることは、プロダクトマネジメントにおける一般的な原則です。しかし、このシナリオでは長期的な安定性を犠牲にしてスピードを優先した結果、技術的負債が生じたことが示されています。単に品質とスピードに注目するだけでは、蓄積した構造的な弱点を特定し、追跡し、解消するための具体的な仕組みにはなりません（参照先 8.4.3）","不正解。この推奨事項は、組織的なニーズとガバナンスモデルに適合するように、チームを適切に構成することに関するものです。チーム設計を調整しても、文書化されていない妋協や隠れた依存関係は直接的には解消されません。「運用成熟度は、ビジネス環境に適したチームトポロジーを備えているかどうかにかかっています」（参照先 8.4.3）"]},
51:{s:"3.1.1",a:2,e:["不正解。単一のフレームワークを標準化すれば一貫性は向上しますが、根本的な問題は、意思決定が実際のユーザーから得られた証拠ではなく仮定に基づいて行われていたことです。「プロダクトおよびサービスの設計には多数のアプローチがあり、組織は状況に適合させ成果を最適化するためにそれらを組み合わせて活用します」（参照先 4.1.3）","不正解。改善が社内の仮定に基づいたままで、ユーザー検証を行っていない場合、変更のリリースを早めても根本的な問題は解決されません。「頻繁なバリデーションにより、デザイナーは問題を早期に顕在化させ、迅速に反復し、ユーザーの期待に明確に合致する解決策へと収束させることができます」（参照先 4.4.3 表 4.5）","正解。この問題が発生したのは、リデザインが実際のユーザーから得られた洞察ではなく、社内の仮定と限られた利害関係者からのフィードバックに依存していたためです。採用の低下やユーザビリティの問題を防ぐためには、設計上の判断を、ユーザーの行動・状況・ニーズに関する検証済みの理解に基づいて行う必要があります。「サービスプロバイダーとユーザーは、要求事項の把握、前提条件の検証、初期設計やプロトタイプに対するフィードバックの提供に積極的に関与し、プロダクトが実際の利用パターン、サポートシナリオおよび運用上の制約を反映するようにしなければなりません」（参照先 4.1.2.1）","不正解。ガバナンスを強化することで標準を順守させることはできますが、ガバナンスは実際のユーザーの行動やニーズを理解することの代わりにはなりません。「コンプライアンスはガバナンスモデルの重要な柱です」（参照先 1.6 ガバナンス）"]},
52:{s:"3.1.2",a:2,e:["不正解。誤用を減らすために責任を定義することは、組織的な採用や行動変更を管理することよりも、セキュリティとコンプライアンスに関わる要素が大きいと言えます。「情報セキュリティ管理：要求される情報セキュリティ水準に最適なソリューションを設計する」（参照先 4.3 表 4.3）","不正解。前向きなフィードバックは継続的改善を支援しますが、このシナリオは、採用前に新しい役割や働き方を主体的に設計することに重点を置きます。「『発見』は［…］学習ループです。［…］継続的に反復を行うことで、チームは進化するユーザーのニーズ［…］にプロダクトを適応させることができます」（参照先 3.1.3）","正解。このシナリオでは、役割、スキル、働き方に大きな変化が生じることが示されています。組織変更の管理は設計活動を支援し、必要な組織的な調整（役割、プロセス、行動を含む）が意図的に設計されるようにすることで、サービスが効果的に運用され、受け入れられることを確実にします。「組織的な変更管理：プロダクトの運用およびサービス提供と消費に必要な組織的な変更を設計する」（参照先 4.3 表 4.3）","不正解。ユーザーのニーズを引き出して文書化することは、組織的な変更や採用を管理することよりも、事業分析や発見活動により密接に関連しています。「事業分析：顧客やユーザー、その他の関連する利害関係者のニーズや要求事項を把握し、分析し、伝達する。把握したニーズと要件を満たすための実現可能なソリューションを提案する」（参照先 4.3 表 4.3）"]},
53:{s:"3.2.2",a:0,e:["正解。このシナリオでは、ロードマップとバックログを見直し、利用状況データとトレンドを分析し、競合他社をベンチマークし、過去のインタビューやアンケートを再確認して、当初のインサイトが依然として有効かどうかを確認することを説明しています。これらの行動は、需要の検証、機会規模の再評価、さらなる投資を行う前の戦略的整合性の確保という振り返りです。これはプロダクトの需要と戦略を分析することと整合しており、これらの活動は「設計」の最初のステップを構成しています。「インプットには、プロダクトロードマップ、バックログ、戦略的目標、利害関係者からのフィードバック、パフォーマンスデータ、そして『発見』活動から得られたプロトタイプ検証結果が含まれる場合があります」（参照先 4.2.1.1）","不正解。この選択肢は、ガバナンス、役割、作業方法の定義など、設計労力そのものを立ち上げたり編成したりすることを指します。このシナリオでは、チームの準備、リソースの割り当て、または体系的なワークショップの実施については説明していません。その代わりに、証拠のレビューと需要の検証に重点を置きます（参照先 4.2.1.1）","不正解。これは、構造化された「設計」活動のための整理と準備に関するものです。このシナリオから、構造化された分析がすでに進行していることが明確に分かります。チームは労力を整理しているのではなく、データを積極的に精査し、前提条件を検証しています。「適切な構築ユニットと構築仕様が文書化され、スケジュールが設定され、リソースが割り当てられると、プロダクトのコーディングが開始されます」（参照先 6.2.1.3）","不正解。この選択肢は、最終的な設計仕様と実施計画を共有することを指します。このシナリオでは、いずれのソリューションもまだ確定しておらず、実施計画も共有されていません。合意された仕様のコミュニケーションは、需要の検証と戦略的方向性の確定後に行われます。「簡潔な需要戦略ブリーフ（通常はスライド資料または 1 ページのサマリー）で、主な測定基準、戦略的なテコ、成功基準の概要を示したものがスポンサーに提示されます」（参照先 4.2.1.1）"]},
54:{s:"3.3.2",a:0,e:["正解。このソリューションは主に技術的な実現可能性とスピードを重視して設計されたため、稼働環境でどのように機能するかについて不確実性が生じています。手戻りや中断、不十分な採用のリスクを低減するために、組織は設計段階において部門横断的な連携を強化し、運用・サポート・ユーザーに関する要件が早期から組み込まれるようにする必要があります。「［…］互換性とサポート性が後付けではなく最初から設計に組み込まれるようにしています」（参照先 4.1.2.3）","不正解。リーダーシップによるレビューは、可視性やガバナンスの監督を向上させる可能性はありますが、記載されている運用リスクには直接対処しません。上級リーダーシップからのフィードバックは、通常、詳細な実行時サポートの検討事項よりも、戦略的整合性や提供の進捗に重点が置かれます。「エグゼクティブスポンサーシップエンゲージメントは、『発見』フェーズにおける関連するスポンサーとのタッチポイント（ブリーフィング、デモレビュー、コミュニケーション）をカウントし、戦略的な可視性とリソースコミットメントを支援します」（参照先 3.4.2）","不正解。包括的な文書化は明確さと調整をサポートできますが、文書化だけでは、その設計が稼働中の運用環境で効果的に機能するかどうかを検証することはできません。「同時に、『設計』『構築』『移行』の各活動において運用への注意が欠けていると、サービス中断が発生しやすくなります。効果的なプロダクト運用は、サービスの信頼性を左右する重要な要素です」（参照先 8.1）","不正解。限定的なロールアウトは、実際の環境で問題を明らかにできますが、それはソリューションがすでに本格的に利用され始めた後に、受け身的に行われます。CIO の目標は、ソリューションがさらに先に進む前にリスクを低減することです。設計フェーズのより早い時点で運用チームを参画させることは、より予防的なアプローチです。「同時に、『設計』『構築』『移行』の各活動において運用への注意が欠けていると、サービス中断が発生しやすくなります」（参照先 8.1）"]},
55:{s:"4.1.2",a:2,e:["不正解。アーキテクチャ管理は、プロバイダーの選定や契約交渉ではなく、技術面での整合性とスケーラビリティを確保することを目的としています。「アーキテクチャ管理：サプライヤーのリソース、プロダクトおよびサービスに対するアーキテクチャ標準と要件を提示すること」（参照先 5.3 表 5.2）","不正解。サービス財務管理は、サプライヤーとの関係や契約の管理ではなく、財務アセスメントに重点を置きます。「サービス財務管理：組織のプロダクトおよびサービスにおける、取得したリソースとサービスの利用状況を登録し、追跡し、報告すること」（参照先 5.3 表 5.2）","正解。このシナリオでは、潜在的なサービスプロバイダーの評価、サプライヤーの選定、契約の交渉、および契約条件が協働とサービスに関する期待をサポートすることの確保について説明しています。これらの活動は、「取得」活動におけるサプライヤー管理の目的と直接一致しており、この活動はソーシングに関する意思決定、サプライヤーの選定および契約上の取り決めを統括します。「サプライヤー管理：サプライヤーの特定、選定、およびオンボーディング。サプライヤーとの契約および合意事項の管理」（参照先 5.3 表 5.2）","不正解。IT 資産管理は IT 資産に関する情報を把握・提供しますが、外部サプライヤーの選定や契約条件は管理しません。「IT 資産管理：IT 資産の登録、追跡および報告を行うこと」（参照先 5.3 表 5.2）"]},
56:{s:"4.2.2",a:0,e:["正解。これは正しい次のステップです。このシナリオは、ソーシングオプションが既に評価され、優先されるアプローチが選択されていることを示しています。リソースを利用可能な状態にする前に、ICR は期待事項、責任、および条件が明確に定義され、かつ実施可能なものであることを確実にする必要があります。「契約の枠組みを交渉することにより、選択したソーシングオプションは、双方の利益を保護する法的拘束力のある関係へと変わります」（参照先 5.2.1.3）","不正解。この活動は、ソーシングオプションを比較・選定しているプロセスの初期段階で行うのが適切です。このシナリオでは、適合性、リスク、整合性についてはすでに合意済みであるとされているため、選択肢を再評価すると、不要な作業の繰り返しと進捗の遅延を招くことになります。「明確に定義された要件がそろったら、次のステップとして最適なソーシング経路を見つけるために市場を調査します」（参照先 5.2.1.2）","不正解。能力の検証は重要な考慮事項ですが、このシナリオでは、適合性とリスクについてはすでに選定プロセスの一環として確認済みであることが示唆されています。この時点での優先度は、さらなる評価ではなく、合意された期待と責任範囲を明確に定めてから先に進むことです。「まず、組織は自らの戦略的目標、プロダクトロードマップ、優先順位付けされたバックログ、および検証済みの設計を、具体的で実行可能なリソース要件のセットへと落とし込まなければなりません」（参照先 5.2.1.1）","不正解。記録を更新することはトレーサビリティとガバナンスを支援しますが、それ自体だけでは、期待と責任が明確であり、かつ強制力を持つことを保証するものではありません。この活動は通常、正式な合意に取って代わるのではなく、それに続いて行われるか、または付随して行われるものです。「リソースやサービスの準備についてタイムリーかつ透明性の高いコミュニケーションを行うことは、社内の依頼者との信頼関係を維持し、ロードマップおよびバックログのイテレーションを予定どおり進めるために不可欠です」（参照先 5.2.1.5）"]},
57:{s:"4.3.1",a:1,e:["不正解。リスクアセスメントの範囲を拡大することはコンプライアンスの向上にはつながりますが、このシナリオが浮き彫りにしているのは、規制上の欠陥ではなく、不整合や意思決定の分断です。「構造化されたリスクアセスメント手法を導入し、［…］事業継続性を守り、ブランドの評価を保護し、社内ポリシーおよび外部規制の順守を確保できます」（参照先 5.4.1）","正解。調達は、短期的で断片的なソーシングを避けるために、戦略的に整合させなければなりません。「『取得』活動は、［…］組織の財務面・業務面・持続可能性の目標をソーシングの判断が直接支援できるよう、より広範な戦略と緊密に連携していなければなりません」（参照先 5.4.1）","不正解。交渉スキルを向上させることは能力を強化しますが、重複や戦略的な可視性の欠如を解消するものではありません。「調達の有効性は、交渉の専門知識、市場インテリジェンス、分析力を備えた要員によって左右されます」（参照先 5.4.1）","不正解。自動化によって効率性は向上しますが、ここで説明されている問題は手作業処理の遅延ではなく、ガバナンスと整合性に関するものです。「調達ソリューション［…］を活用することで、定型業務が効率化され、手作業によるエラーが減少し、サイクルタイムが短縮されます」（参照先 5.4.1）"]},
58:{s:"4.3.2",a:1,e:["不正解。トレーサビリティと説明責任により、取得に関する意思決定の透明性と責任の所在が明確になります。ガバナンスと監督の観点からは有用ですが、この活動自体には、制約の多い契約条件や特定サプライヤーへのロックインを本質的に防ぐ効果はありません。「各購入品目について、誰が選定し、承認し、最終確認を行い、最終的なパフォーマンスの責任を負うのかを明確に文書化します」（参照先 5.4.3）","正解。組織は、契約上の違約金のために調達戦略を柔軟に見直すことが難しかった。これは、取得計画の段階で柔軟性が十分に考慮されていなかったことを示しています。進化するビジネスニーズに対応できるよう契約およびソーシングモデルを設計することで、ベンダーロックインや高額な退出障壁のリスクを低減できます。「柔軟性を考慮して契約とソーシングモデルを設計」し、ビジネスニーズの変化に応じて調整できるようにします（参照先 5.4.3）","不正解。取得成果物が後工程の利害関係者のニーズを満たすようにすることで、整合性と業務の有効性が向上します。しかし、このシナリオでは当初のサービス能力に対する不満は示されていません。問題は、時間の経過に伴うニーズの変化と、契約面でそれに適応できないことから生じます。「取得のアウトプットが、すべての後工程の担当者（API、インテグレーション、SLA）のニーズを満たしていることを検証する」（参照先 5.4.3 表 5.4）","不正解。調達およびサプライヤーの専門家を早期に関与させることで、交渉や契約構造を強化できます。しかし、エキスパートの関与だけでは、柔軟性が明確な目標として設計されていない限り、契約上の柔軟性は保証されません。「エグゼクティブの後援と部門横断的なガバナンス」（参照先 5.4.3 表 5.4）"]},
59:{s:"5.1.2",a:0,e:["正解。このシナリオでは、アクセス制御とデータ保護をプロダクトに直接組み込み、テスト時にそれらを検証します。これは、構築ステージにおける情報セキュリティ管理と整合しています。「情報セキュリティ管理：プロダクトに情報セキュリティ統制を組み込むこと」（参照先 6.3 表 6.2）","不正解。インシデントからフィードバックを収集することは、リリース後の運用改善に関するものであり、セキュアな構築と検証に関するものではありません。「効果的なオペレーションには、［…］規律あるインシデント対応フレームワークが必要です」（参照先 8.4.1）","不正解。許容されるユーザーの行動を定義することは、構築時に統制を組み込むことではなく、サービス利用時のガバナンスとコンプライアンスにより深く関係します。安全なデジタルプロダクトには、ライフサイクル全体を通じてデータ保護および規制要件が組み込まれるよう、「セキュリティファーストのカルチャーとコンプライアンスガバナンス」のアプローチが必要です（参照先 8.4.3 表 8.4）","不正解。ユーザーのニーズを文書化することは、発見と設計を支援するものであり、構築時のセキュア統制の実施を目的としたものではありません。「［…］デザイナーは実際に購買や採用の意思決定を左右する、満たされていないニーズを明らかにすることができます」（参照先 4.2.1.1）"]},
60:{s:"5.2.2",a:2,e:["不正解。ソリューション設計の評価は、実行の前に行われます。リソースはすでに確保されており作業も実施されているため、このステップはここで説明している主な活動には当たりません。「プロダクト設計の反復が完了すると、プロダクトチームはその設計を評価し、構築およびテスト活動の計画を立てます」（参照先 6.1）","不正解。資源の計画と確定は、実行に先立って行われます。リソースはすでに確保されており作業も実施されているため、このステップはここで説明している主な活動には当たりません。「リソースの利用可能性が確認されると、構築およびテストの活動は計画どおりに実施されます」（参照先 6.1）","正解。このシナリオでは、機能の開発、他のモジュールとのインテグレーション、単体テストおよびインテグレーションテストの実施、セキュリティ統制の検証、運用の文書化について説明しています。これらの活動は、「構築」活動内で計画された構築およびテスト作業を実行することに直接対応します。「構築およびテスト計画を実行する」（参照先 6.2）","不正解。「移行」活動への引き渡しは、構築とテストが完了した後に行われます。「構築およびテストされたプロダクト（それを補完するサポート文書を含む）は、［…］出荷され」ますが、実行はまだ進捗中であり、まだ移行されていません（参照先 6.1）"]},
41:{s:"1.1.1",a:2,e:["不正解。このシナリオは、主としてイテレーションやリリースサイクルに関するものではなく、優先順位付けを行う前に価値を検証することに関するものです。「各反復はユーザーからのフィードバックを得て初めてリリースされ、変更計画には技術的な確認と並行して UX 評価が組み込まれます」（参照先 4.1.3 表 4.2）","不正解。この原則は、体験の向上につながる場合に自動化を適用することに関するものです。このシナリオは自動化や効率性の改善について述べているのではなく、価値に基づく優先度付けについて述べています。「異なる専門分野が協働してソリューションを設計し、自動化はユーザーとスタッフ双方の体験を真に向上させる場合にのみ適用されます」（参照先 4.1.3 表 4.2）","正解。このシナリオでは、提案された変更が実際のユーザーの問題を解決し、サービスの成果を向上させ、長期的なメリットを強化するかどうかに基づいて評価することを説明しています。これは、すべての活動が顧客とサービスプロバイダーにとって意味のある価値に貢献することを確実にするという原則を直接反映しています。「サービスが成果の達成を可能にし、コストを最適化し、またはリスクを低減する場合に、ポジティブなインパクトが生じます」（参照先 2.2.1）","不正解。このシナリオは単純化を重視しているのではなく、変更によって実際の価値が生み出されることを重視しています。この原則は、提供におけるシンプルさを重視しています。「チームは薄いスライスを出荷し、仮説的な機能の完全性ではなく実際の利用状況に基づいてフローを簡素化します」（参照先 4.1.3 表 4.2）"]},
42:{s:"1.1.2",a:2,e:["不正解。デジタルプロダクトがソフトウェアと仮想インフラストラクチャに依存しているのは事実です。デジタルプロダクトは「（ソフトウェアや仮想インフラなどの）デジタルリソースに依存する」（参照先 2.1）","不正解。デジタルプロダクトは、現場での対応なしに診断できるというのは事実です。それは「遠隔で診断・修理・改善ができる」（参照先 2.1）","正解。デジタルプロダクトは非デジタルプロダクトとは異なり、物理的な提供は非デジタルプロダクトの特徴です。非デジタルプロダクトは「物理的な提供に依存する」のに対し、デジタルプロダクトは「即時かつデジタルに提供できる」（参照先 2.1）","不正解。デジタルプロダクトは、使用されると同時に改良されていくというのは事実です。それは「同時に開発・改良・利用される」（参照先 2.1）"]},
43:{s:"1.1.4",a:3,e:["不正解。ライフサイクル管理活動の適用範囲は固定されたものではなく、組織のオペレーティングモデルと責任範囲によって異なります。「プロダクトおよびサービスライフサイクルの各段階には、それぞれ異なる組織に実行責任があります。実行責任の範囲は組織のビジネスモデルに依存し、それに対応するオペレーティングモデルを規定します」。これは、ライフサイクル管理活動には固定された適用範囲と順序があるという主張と直接矛盾しています（参照先 11.3.2）","不正解。バリューチェーン活動は、厳密にあらかじめ決められた順序で実行されるのではなく、実際の業務フローに基づいて調整され、組み合わされます。「バリューチェーン：あらかじめ決められた青写真ではなく、実際に実行される一連の活動の順序である」。これは、活動が常に厳密な順序で実行されるわけではなく、状況やバリューストリームの設計に応じて変化することを明確に示しています（参照先 11.4）","不正解。運用、提供、サポートは、必ずしも硬直した順序で一つずつ連続して発生するわけではありません。ライフサイクル上の責任やフローは、組織的な役割やインテグレーションの度合いによって異なる場合があります。「しかし、プロダクトベンダーとサービスプロバイダーの役割をそれぞれ別の組織が担い［…］場合には、ライフサイクルの各ステージにおける両者の関心の焦点は［…］変化します」。役割分担とオペレーティングモデルに依存していることを示しています（参照先 2.1.1）","正解。ライフサイクル管理の活動は、全体的かつ統合的な方法で管理される必要があります。「ITIL プロダクトおよびサービスライフサイクルと8つのステージ。ライフサイクル全体を通じてデジタルプロダクトおよびサービスを管理するために、組織は関連するマネジメント能力（ITIL では管理プラクティスと呼ばれます）を開発し、それらを組織のオペレーティングモデルの文脈で適用する必要があります。オペレーティングモデルの中核は、そのバリューチェーンです：プロダクトまたはサービス提供を通じて価値を実現する、一連の活動」。ライフサイクル管理が、より広いバリューチェーンおよびオペレーティングモデルの状況の中で適用されており、統合的かつ包括的アプローチを支えていることを示しています（参照先 2.1.2）"]},
44:{s:"1.2.5",a:1,e:["不正解。ソリューションの作成やテストについては、シナリオの中で説明されていません。「『構築』活動の目的は、デジタルプロダクトおよびサービスを開発・統合・テストし、設計を機能するソリューションへと変換することです」（参照先 6.1.1）","正解。このシナリオでは、稼働環境へのソリューションのデプロイを示しており、ユーザーや利害関係者のオンボーディングと準備、そしてテスト済みソリューションを稼働環境へ移行することが含まれます。「『移行』活動の目的は、新規または更新されたプロダクトおよびサービスを運用環境にシームレスに導入し、サプライヤーのオンボーディング/オフボーディングを効果的に実施できるようにすることです」（参照先 7.1.1）","不正解。「運用」は、デプロイ後の継続的な管理に焦点を当てます。「移行」は、「運用」が開始される前にプロダクトを利用可能な状態にするステップです。「『運用』活動の目的は、デジタルプロダクトおよびサービスや関連システムを維持・監視し、最適なパフォーマンスと信頼性を確保することです」（参照先 8.1.1）","不正解。サポートは、サービスの復旧と利用者の支援に重点を置きます。「インシデント発生時、通常どおりのプロダクト運用とサービス提供の復旧」である一方、「移行」活動は「新規または更新されたプロダクトおよびサービスを運用環境にシームレスに導入し、サプライヤーのオンボーディング/オフボーディングを効果的に実施できるようにすることです」（参照先 2.1.1 表 2.1, 7.1.1）"]},
