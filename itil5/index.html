45:{s:"1.2.7",a:0,e:["正解。このシナリオは、サービス消費中にユーザーに対して実施される、合意済みのサービス活動を説明します。「『提供』活動の目的は、ユーザーにプロダクトおよびサービスを提供し、ユーザーのオンボーディング/オフボーディングを管理、サービス品質基準を維持、消費者からのフィードバックを収集することです」（参照先 9.1.1）","不正解。「移行」は、プロダクトやサービスを稼働環境へ導入することに重点を置きます。「テスト済みプロダクトの稼働環境への移行」（参照先 2.1.1 表 2.1）","不正解。「運用」は、プロダクトパフォーマンスの維持に重点を置きます。「プロダクトのハードウェア、ソフトウェアおよびデータの継続的な運用と保守、プロダクトの健全性のモニタリング、関連するイベントの取得および処理」（参照先 2.1.1 表 2.1）","不正解。「サポート」は、サービスの復旧とインシデントの対応に重点を置きます。「インシデント発生時の通常のプロダクト運用の復旧」（参照先 2.1.1 表 2.1）"]},
46:{s:"1.2.8",a:3,e:["不正解。「提供」は「合意されたサービスアクションの実施（サービス要求の履行を含む）」に重点を置いています（参照先 2.1.1 表 2.1）","不正解。「移行」は、プロダクトを稼働環境へ導入することに関するものです。「テスト済みプロダクトの稼働環境への移行」（参照先 2.1.1 表 2.1）","不正解。「運用」は、プロダクトパフォーマンスの維持に重点を置きます。「運用：プロダクトのハードウェア、ソフトウェアおよびデータの継続的な運用と保守。プロダクトの健全性のモニタリング。関連イベントの取得と処理」（参照先 2.1.1 表 2.1）","正解。このシナリオでは、ユーザーからの問い合わせへの対応、サービスへのアクセスの復旧、そして根本原因を解決するためのモニタリングアラートの調査について説明しています。これは、障害が発生した際に通常のサービス運用を復旧することに重点を置く「サポート」活動の目的と直接一致しています。「『サポート』活動の目的は、インシデントを特定して解決、災害復旧手順を実行、そしてサービス消費者からのフィードバックを収集することです」（参照先 10.1.1）"]},
47:{s:"2.1.3",a:1,e:["不正解。このシナリオは、利害関係者の期待を理解し、要求を文書化することに重点を置いています。アーキテクチャ管理は、利害関係者のニーズを定義することではなく、プロダクトおよびサービスのアーキテクチャを最適化することに関わります。「アーキテクチャ管理：組織のプロダクトおよびサービスのアーキテクチャを策定し、合意を形成し、計画し、継続的に最適化すること」（参照先 3.3 表 3.3）","正解。このシナリオでは、利害関係者と協働して期待を把握し、満たされていないニーズを特定し、要件を文書化することを説明しています。これは、利害関係者のニーズおよび要求事項を定義することと直接的に整合しています。「事業分析：利害関係者のニーズと要求事項の定義」（参照先 3.3 表 3.3）","不正解。ポートフォリオ管理は、プロダクトおよびサービスのポートフォリオを最適化することに関わります。このシナリオは、ポートフォリオそのものの管理ではなく、利害関係者要件の収集と文書化に重点を置いています。「ポートフォリオ管理：組織のプロダクトおよびサービスのポートフォリオを策定し、合意を得て計画し、継続的に最適化すること」（参照先 3.3 表 3.3）","不正解。リスク管理は、リスク許容度とそのアプローチを定義し、周知することに関わります。このシナリオは、利害関係者の期待を理解し要件を文書化することに重点を置いており、リスクパラメータの確立を目的としたものではありません。「リスク管理：組織のリスク許容度とリスク管理のアプローチを定義し、合意し、周知すること」（参照先 3.3 表 3.3）"]},
48:{s:"2.2.2",a:1,e:["不正解。これは次のステップではなく、アセスメントステップの一部です。多様な利害関係者を巻き込むことは、通常は初期の探索作業の一環として行われます。しかしこのシナリオでは、オマールはすでに部門横断的なワーキンググループを招集し、ペルソナを見直しています。エンゲージメントを広げるために戻ることは、業務を前進させるのではなく、これまでの活動を繰り返すことになります。「組織が［…］プロダクトベースの組織構造を採用している場合であっても、このステップには他の利害関係者が関与する可能性が高くなります」（参照先 3.2.1.1）","正解。ICR はすでにより広い状況を確認し、ペルソナを再検討し、各市場でユーザーが直面している課題を明確にしています。これは、状況を把握するための探索的な作業が完了したことを示しています。次のステップは、それらの知見を統合し、ビジネス目標・ユーザー価値・実現可能性を整合させた構造化された意図、すなわち明確な戦略的方向性へとまとめ上げることです。「『発見』活動のハイレベルなワークフローは、次の4つのステップで構成されます。プロダクト状況を評価する。方向性と目標を合意する。優先すべきアクションを定めてリソースを配分する。プロダクトロードマップにおける変更点を伝達する」（参照先 3.2）","不正解。既存のサービスやコンポーネント間の依存関係を精査することは、一般的にアーキテクチャの洗練、ポートフォリオレビュー、または設計と構築の準備と関連付けられます。得られたインサイトがまだ明確な方向性や具体的なイニシアチブに落とし込まれていないため、実際に何が提案されているのかを明らかにする前に構造的な相互依存関係を検討するのは時期尚早です。「『発見』は、現在の環境のアセスメントから始まります。インプットには、戦略的な方向性、PESTLE 分析、ポートフォリオレビュー、現行のロードマップ、バックログ評価［…］が含まれます」（参照先 3.2.1.1）","不正解。これは、方向性への合意とアクションの優先順位付けが行われた後に発生する、ワークフローの最終ステップ（ロードマップの変更内容を伝達すること）に相当します。ICR はまだ明確な方向性や具体的なイニシアチブを打ち出していないため、この選択肢は時期尚早です。「『発見』活動のハイレベルなワークフローは、次の4つのステップで構成されます。プロダクト状況を評価する。方向性と目標を合意し、行動に優先順位を付けてリソースを割り当てる。プロダクトロードマップにおける変更点を伝達する」（参照先 3.2）"]},
49:{s:"2.3.1",a:3,e:["不正解。協力を強化することは整合性には役立ちますが、ここで述べられている障害は、検証と証拠に基づくテストの欠如に起因しています。「継続的に部門横断的な協働を推進する」（参照先 3.4.3 表 3.5）","不正解。形式的な評価を減らすと問題は悪化します。厳密な検証が必要だからです。「頻繁なバリデーションにより、デザイナーは問題を早期に顕在化させ、迅速に反復し、ユーザーの期待に明確に合致する解決策へと収束させることができます」（参照先 4.4.3 表 4.5）","不正解。リーダーシップの関与を高めても、意思決定が証拠に基づくのではなく意見に基づいて行われているという中核的な問題は解決されません。「強力なリーダーシップの主導とリソースへのコミットメント」（参照先 4.4.1）","正解。このシナリオから、意思決定が主に意見と過去の体験に基づいて行われたため、採用がうまく進まなかったことが分かります。これを避けるために、プロバイダーは直感に頼るのではなく、前提条件を明確に定義し、パフォーマンス指標を用いて成果を測定する、証拠に基づく検証に注力する必要があります。意思決定は、直感ではなく測定可能なデータに基づいて行われます（参照先 3.4.3 表 3.5）"]},
50:{s:"2.3.2",a:3,e:["不正解。強力なリーダーシップスポンサーシップとは、上級リーダーによる目に見えるサポート、方向性の提示、およびリソース面での後ろ盾を指します。このシナリオでは、上級リーダーが主体的に支援し、イニシアチブを加速させています。問題はスポンサーシップが存在しないことではなく、その決定のなされ方にあります。「エグゼクティブスポンサーシップエンゲージメントは［…］関連するスポンサーとのタッチポイント［…］をカウントし、戦略的な可視性とリソースコミットメントを支援します」。問題はスポンサーシップの欠如ではなく、不十分な検証でした（参照先 3.4.2）","不正解。スケーラブルなインフラストラクチャとプラクティスは、利用が増加しても、組織が成長をサポートし、パフォーマンスを維持し、信頼できる運用を確保する能力に関わります。このシナリオでは、技術的な不安定性、パフォーマンス上の問題、スケーリング上の制約については説明されていません。「サイトリライアビリティエンジニアリング：ソフトウェアエンジニアリングの手法や考え方を取り入れ、それらをインフラストラクチャおよび運用上の課題に適用することで、極めて高いスケーラビリティと信頼性を備えたソフトウェアシステムの実現を目指す分野」（参照先 8.1）","不正解。効果的なサプライヤー関係管理とは、サービスの成果をサポートするために、外部パートナーがどのように統制され、整合され、管理されるかに関わるものです。このシナリオでは、サードパーティーの制約やサプライヤーとの不整合については言及されていません。課題はサプライヤーのパフォーマンスではなく、社内の意思決定に起因しています。サプライヤー管理とは「組織のサプライヤーとそのパフォーマンスレベルを適切に管理することで、高品質なプロダクトおよびサービスの提供を支援することを確実にするプラクティス」（参照先 用語集）","正解。リーダーシップは、前提をデータで検証するのではなく、意見に基づいてその機能を前に進めました。これは、エビデンスに基づく意思決定を適用できていないという障害を示しています。エビデンスに基づく意思決定では、上層部の判断だけに頼るのではなく、測定可能なデータやインサイトを用いてプロダクトに関する判断を行う必要があります。「データを定性的なインサイトと併用する」（参照先 3.4.3 表 3.5）"]}
};
Object.keys(OFFICIAL_41_80).forEach(function(k){const o=OFFICIAL_41_80[k];const n=Number(k);for(let i=0;i<ALL_QUESTIONS.length;i++){if(ALL_QUESTIONS[i].n===n){ALL_QUESTIONS[i].s=o.s;ALL_QUESTIONS[i].a=o.a;ALL_QUESTIONS[i].e=o.e;}}});
const LABELS=['A','B','C','D'];
const KEY='itil5QuizState_v1';
const PASS=70;
const MODE_LABEL={exam1:'模試1',exam2:'模試2',all:'全80問',random20:'ランダム20問',review:'復習'};
let state=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function buildItems(mode){
let idx;
if(mode==='exam1')idx=ALL_QUESTIONS.map(function(q,i){return i;}).slice(0,40);
else if(mode==='exam2')idx=ALL_QUESTIONS.map(function(q,i){return i;}).slice(40);
else if(mode==='random20')idx=shuffle(ALL_QUESTIONS.map(function(q,i){return i;})).slice(0,20);
else idx=ALL_QUESTIONS.map(function(q,i){return i;});
const order=(mode==='random20')?idx:shuffle(idx);
return order.map(function(qi){return{qi:qi,co:shuffle([0,1,2,3]),picked:null};});
}
function startQuiz(mode){state={mode:mode,items:buildItems(mode),cur:0};save();show('quiz');render();window.scrollTo(0,0);}
const GLOSSARY=[{"t":"能力","en":"ability","d":"特定の領域で当事者が効果的に能力を発揮するためのスキルや能力。誠実さや善意とともに、信頼性を構成する中核的要素。"},{"t":"受け入れ基準","en":"acceptance criteria","d":"サービスまたはサービスコンポーネントが主な利害関係者に受け入れられるための最低限の要件。"},{"t":"活動","en":"activity","d":"イニシアチブの一環として行われるあらゆる種類の活動を指し、アイデア創出、探求的な取り組み、大きな変更や小さな変更などを含む。本質的には、実行する必要があるあらゆるタスクを指す。"},{"t":"実際の価値","en":"actual value","d":"KPIに対するエピソードまたは状態の観測値。"},{"t":"エージェント","en":"agent","d":"消費者を支援またはサービスを提供する、最前線の人的な役割。多くの場合、自動化されたエージェントによって補完される。"},{"t":"エージェント型 AI","en":"agentic AI","d":"ユーザーに代わって、合意された範囲内があらかじめ定義されたタスクを自律的に実行しつつ、人間による監督とガバナンスの下に置かれるよう設計されたAIシステム。"},{"t":"アジャイル","en":"agile","d":"チームや個人が、協働、優先度付け、反復的かつ段階的な提供、タイムボックスなどを特徴とする働き方で作業するために必要なフレームワークや技法を総称する用語。スクラム、リーン、カンバンなど、アジャイルとして分類される特定の手法（またはフレームワーク）が存在する。"},{"t":"AIガバナンス","en":"AI governance","d":"組織がAI（人工知能）の利用を指揮・コントロール・モニターし、AIを活用したデジタルプロダクトやサービスが、倫理性・安全性・コンプライアンスを維持しつつ、組織の目標と整合しながら価値を創出することを確保するための仕組み。"},{"t":"AI成熟度","en":"AI maturity","d":"組織が、自らの目的を支援するために、ガバナンス、データ品質、スキル、プロセス、倫理的配慮を含めて、AIの能力を効果的かつ責任を持って一貫して活用できる程度。"},{"t":"予期","en":"anticipation","d":"エピソードの前段階にあたる体験のステージであり、時間の経過とともに体験が解釈されていく３つのステージのうち最初のもの。"},{"t":"アーキテクチャ管理プラクティス","en":"architecture management practice","d":"組織を構成するあらゆる要素と、これらの要素の相互関係を把握するためのプラクティス。"},{"t":"アーキテクチャの原則","en":"architecture principles","d":"組織全体のリソースと資産の使用およびデプロイに関する一連の規範とルール。"},{"t":"AI（人工知能）","en":"Artificial Intelligence","d":"デジタルシステムが、データから学習したり、パターンを認識したり、予測を行ったり、意思決定を支援したりといった、本来は人間の知能を必要とするタスクを実行できる能力。"},{"t":"資産台帳","en":"asset register","d":"資産のデータベースまたはリスト。オーナシップや財務的価値などの主要な属性が記録される。"},{"t":"監査証跡","en":"audit trail","d":"検証可能性を裏づける記録された証拠。"},{"t":"可用性","en":"availability","d":"ITサービスまたはその他の構成アイテムが、合意された機能を必要なときに実行できる能力。"},{"t":"可用性管理プラクティス","en":"availability management practice","d":"顧客およびユーザーのニーズを満たすために、サービスが合意されたレベルの可用性を確実に提供するプラクティス。"},{"t":"可視範囲","en":"band of visibility","d":"サービス消費者組織の側面でサービスプロバイダーに見えるものと、サービスプロバイダー組織の側面でサービス消費者に見えるものの合計。"},{"t":"ベースライン","en":"baseline","d":"進化や変更を評価できる基準として役立つ、レポートまたは指標。"},{"t":"基本関係","en":"basic relationship","d":"取引的な取り決めであり、プロバイダーが設定した固定的な条件に基づき、多くの場合、保証を中心としたSLAが形式的な焦点となる。経験は概ね前提とされ、市場シグナルによって規定される。3種類のサービス関係の中で可視性の範囲が最も狭いため、多くの摩擦が相手方には見えにくい。"},{"t":"振る舞い駆動開発（BDD）","en":"Behaviour-Driven Development","d":"利害関係者にとって意味のある挙動を、低レベルのユニット機能よりも重視するソフトウェア開発手法。例えば、BDDでは、プログラマー中心の言語でテストを書くのではなく、開発者、QAエンジニア、プロダクトオーナー、さらには技術的知識のないビジネスアナリストまでもが読み解ける、汎用性の高いドメイン固有言語（DSL）の使用を推奨している。"},{"t":"善意","en":"benevolence","d":"ある当事者が、自己利益を超えて他の当事者のために良いことをしようとし、その相手に対して前向きな姿勢を持っているという信念。能力と完全性とともに、知覚される信頼性の中核要素。"},{"t":"個別対応型の関与パターン","en":"bespoke involvement pattern","d":"標準的な提供物と比べて、デジタルプロダクトおよびサービスライフサイクルのより初期段階で体験が形成される、一連のインタラクション。"},{"t":"ベストプラクティス","en":"best practice","d":"複数の組織で成功の実績がある業務の方法。"},{"t":"ビッグデータ","en":"big data","d":"新しい知見を得るために、さまざまな情報源から膨大な量の構造化データと構造化されていないデータを利用すること。"},{"t":"身体的状態","en":"bodily states","d":"緊張、安堵、疲労といった身体的反応に加え、感情的および認知的な人間の状態。"},{"t":"広範な分布","en":"broad distribution","d":"１つの情報源だけでなく、複数の役割や文脈から得られるシグナル。"},{"t":"事業分析プラクティス","en":"business analysis practice","d":"ビジネスまたはビジネスの一部の要素を分析し、ビジネスニーズを定義し、そのニーズに対処および/または、ビジネス問題を解決し、利害関係者にとっての価値を生み出すためのソリューションを推奨するプラクティス。"},{"t":"ビジネスケース","en":"business case","d":"組織のリソースを消費する根拠。コスト、便益、選択肢、リスクおよび課題に関する情報を示す。"},{"t":"ビジネスインパクト分析（BIA）","en":"Business Impact Analysis","d":"サービス継続性管理のプラクティスにおいて、重要なビジネス機能とその依存関係を明らかにする重要な活動。"},{"t":"ビジネスモデル","en":"Business model","d":"組織が顧客に価値を創出するために、その戦略に基づいてどのように構成されているか、またはあるべきかを示す概念的および・または視覚的な表現。"},{"t":"ビジネス関係マネージャー（BRM）","en":"Business Relationship Manager","d":"１つ以上顧客との良好な関係を維持する役割。"},{"t":"問い合せ","en":"call","d":"サービスデスクとのやり取り（電話など）。問い合せによって、インシデントまたはサービス要求が記録されることもある。"},{"t":"能力（ケイパビリティ）","en":"capability","d":"活動を実行するための、組織、人、プロセス、アプリケーション、構成アイテム、またはITサービスの能力。"},{"t":"キャパシティおよびパフォーマンス管理プラクティス","en":"capacity and performance management practice","d":"サービスが合意済みで期待されたパフォーマンスレベルを達成することを確実にし、費用対効果に優れた方法で現在および将来の需要を満たすプラクティス。"},{"t":"キャパシティ計画立案","en":"capacity planning","d":"サービス需要を満たすためのリソース管理計画を作成する活動。"},{"t":"ケアの戦略化","en":"care-as-a-strategy","d":"ケアを独自の価値提案として意図的に優先すること。"},{"t":"変更","en":"change","d":"プロダクトとサービスに直接的または間接的な影響を及ぼす可能性がある何らかの追加、修正、または削除。"},{"t":"変更許可委員","en":"change authority","d":"変更を許可する権限を持つ個人またはグループ。"},{"t":"変更データキャプチャ（CDC）","en":"Change-Data-Capture","d":"ソースデータベースのあらゆる変更を追跡し、関連システムをほぼ瞬時に最新の状態に保つ方法。パフォーマンスへの影響を最小限に抑えながらリアルタイムのデータレプリケーションを実現し、各変更が一度だけ処理されることを保証する。このアプローチは、分析、マイクロサービスの通信、およびデータベースの移行において広く利用されている。"},{"t":"変更実現プラクティス","en":"change enablement practice","d":"プロダクトおよびサービスの変更の成功数を最大にするために変更を進めることを許可し、変更スケジュールを管理するプラクティス。これによりリスクが確実に適切に評価されるようにする。"},{"t":"変更モデル","en":"change model","d":"特定の種類の変更を管理するための、繰り返し可能なアプローチ。"},{"t":"変更スケジュール","en":"change schedule","d":"計画された変更および変更の履歴を示すカレンダー。"},{"t":"課金","en":"charging","d":"サービスの価格を設定する活動。"},{"t":"クラウドコンピューティング","en":"cloud computing","d":"管理の手間やプロバイダーとのやりとりを最小限に抑えて迅速に提供できる、構成可能なコンピューティングリソースから成る共有プールへの、オンデマンドのネットワークアクセスを実現するためのモデル。"},{"t":"認知的労働","en":"cognitive labour","d":"システムの状態を解釈し、手順を記憶して順序立て、規則同士の整合性を取り、選択肢の意味を理解しようとする際の労力。これは「認知負荷」として現れ、余計な負荷を加える変更によって悪化しうる一方で、ツールによって軽減または増幅することも可能である（例：AIを認知増幅器として用いる、あるいは退屈な作業を肩代わりさせるなど）。"},{"t":"認知状態","en":"cognitive states","d":"信念や期待といった内的な思考や判断に加え、感情的・身体的な人間の状態。"},{"t":"協働関係（パートナーシップ）","en":"collaborative relationship (partnership)","d":"共通の目標を実現するために緊密に連携することを伴う２つの組織の関係。"},{"t":"複雑性思考","en":"complexity thinking","d":"システムに内在するさまざまな複雑さのレベルとそれらが動作する状況を認識し理解することに基づいた分析と意思決定のアプローチ。"},{"t":"コンプライアンス","en":"compliance","d":"標準または一連の指針に確実に従っているようにする、または、適切で一貫した会計業務やその他のプラクティスが確実に用いられているようにする活動。"},{"t":"機密性","en":"confidentiality","d":"情報が許可を受けてないエンティティに確実に提供または公開されないようにするセキュリティの目標。"},{"t":"構成","en":"configuration","d":"プロダクトまたはサービスを提供するために連携する構成アイテム（CI）または他のリソースの配置。1つまたは複数のCIのパラメータ設定を指すこともある。"},{"t":"構成アイテム（CI）","en":"Configuration Item","d":"サービス構成管理プラクティスの対象範囲に含まれるプロダクト、サービス、またはコンポーネント。構成アイテムには通常、ハードウェア、ソフトウェア、ネットワーク、建物、サプライヤー、プロダクト、サービス、および文書が含まれる。"},{"t":"構成管理データベース（CMDB）","en":"Configuration Management Database","d":"そのライフサイクルを通して構成レコードを保管するために使用されるデータベース。CMDBは構成レコード間の関係を維持する。"},{"t":"構成管理システム（CMS）","en":"Configuration Management System","d":"サービス構成管理を支援するために使用される一連のツール、データおよび情報。"},{"t":"構成レコード","en":"configuration record","d":"構成アイテム（CI）の詳細を含むレコード。各構成レコードには、単一のCIのライフサイクルが記録される。構成レコードは構成管理データベースに保存される。"},{"t":"確認可能性","en":"confirmability","d":"調査結果がデータに根拠づけられているかどうかを判断するために用いられる基準。"},{"t":"消費者","en":"consumer","d":"合意された条件の下で、対価となる価値単位と引き換えに、プロバイダーから定義された価値単位を取得し利用する組織。"},{"t":"消費者スポンサー","en":"consumer sponsor","d":"プロダクトおよびサービス消費の予算を承認する役割。"},{"t":"消費者側の緊張","en":"consumer-side tension","d":"ユーザー、顧客、消費者側のスポンサーがそれぞれ異なる抽象度のレベルで活動することに起因する、消費者組織内の緊張。ユーザーは日々の軋軂の中で過ごし、顧客は成果を達成するために相反する要求を調整し、スポンサーは実装の可視性が限られている中で、高レベルな予算配分や方針の決定を行う。"},{"t":"コンテンツ配信ネットワーク（CDN）","en":"Content Delivery Network","d":"HTMLパージ、画像、動画、スクリプトなどのWebコンテンツやその他のアセットを、世界各地に戦略的に配置されたサーバー群から、エンドユーザーに対して高速かつ信頼性高く配信するための分散システム。"},{"t":"文脈的領域","en":"contextual domains","d":"個人的、機能的、関係的な領域と並ぶ、体験を取り巻く影響要因。"},{"t":"継続的な体験改善","en":"continual experience improvement","d":"体験を向上させるために、「気づき」「解釈」「仮説立案」「実験」を繰り返す反復的なループ。"},{"t":"継続的改善","en":"continual improvement","d":"組織が継続的に利害関係者の期待に応えることを確実にするために組織のあらゆるレベルで行われる定期的な活動。"},{"t":"継続的改善プラクティス","en":"continual improvement practice","d":"プロダクトおよびサービスの効果的な管理に関与するすべての要素の継続的な識別と、改善を通して、変化していくビジネスニーズに組織のプラクティスとサービスを整合させるプラクティス。"},{"t":"継続的改善管理表（CIR）","en":"Continual Improvement Register","d":"候補となる改善策の共有ポートフォリオ。"},{"t":"継続的デリバリー","en":"continuous delivery","d":"ソフトウェア更新をいつでも本番環境にデプロイ可能にする一連の技術とツール。頑繁なデプロイは可能だが、デプロイの判断はケースバイケースで行われる。これは通常、組織がより緩やかなデプロイのペースを好むためである。"},{"t":"継続的デプロイ","en":"continuous deployment","d":"自動テストに合格したあらゆる変更を、追加の認可なしに本番環境へ自動的にデプロイできるようにする、一連の手法とツールのセット。継続的デプロイは継続的デリバリーに依存する。"},{"t":"継続的インテグレーション","en":"continuous integration","d":"開発者がコードの変更を頑繁に中央リポジトリにマージし、その後に自動構築とテストを行うことを可能にする技術とツールのセット。"},{"t":"継続的テスト","en":"continuous testing","d":"デプロイパイプラインのあらゆる段階で自動テストを実行し、変更が品質、パフォーマンス、およびビジネス要件を満たしていることを確認するアプローチ。これによりリスクが低減され、サービスの信頼性が向上し、継続的インテグレーションおよび継続的提供プラクティスの実践を支援する。"},{"t":"コントロール","en":"control","d":"リスクを管理する手段であり、ビジネス目標を確実に実現する手段、またはプロセスに確実に従っているようにする手段。"},{"t":"協力関係","en":"cooperative relationship","d":"交渉に基づく合意事項であり、当事者はUWSEの範囲内の体験目標およびフィードバックに関するコミットメントをSLAに規定し、測定指標は仮説として扱う。可視範囲は基本関係よりも広く、独立したガバナンスを維持しつつ体験目標のモニタリングを可能にする。"},{"t":"コアバリューストリーム","en":"core value stream","d":"消費者に価値を提供するバリューストリームであり、組織のオペレーティングモデルが意図する形で提供される。"},{"t":"コスト","en":"cost","d":"特定の活動、リソース、プロダクトまたはサービスに費やされた金額。"},{"t":"コストセンター","en":"cost centre","d":"コストを帰属させるビジネス部門またはプロジェクト。"},{"t":"信用性（クレディビリティ）","en":"credibility","d":"証拠の妥当性を判断するための基準。"},{"t":"重要成功要因（CSF）","en":"Critical Success Factor","d":"意図した結果を実現するために必要な前提条件。"},{"t":"カルチャー","en":"culture","d":"カルチャーとは、人々の行動や考え方、信念、慣行を通じて表現される、集団で共有された一連の価値観である。"},{"t":"顧客","en":"customer","d":"プロダクトおよびサービスの要件を定義し、サービス消費の結果に対する責任を負う役割。"},{"t":"顧客体験（CX）","en":"Customer Experience","d":"サービス顧客により認識されている、サービスとサービスプロバイダーとの実務的および感情的なやりとりの積み重ね。"},{"t":"サイクルタイム","en":"cycle time","d":"バリューストリームの特定のステップを完了するのにかかる時間。"},{"t":"ダッシュボード","en":"dashboard","d":"データをリアルタイムでグラフィカルに表現したもの。"},{"t":"データガバナンス","en":"data governance","d":"規則、方針、基準、プロセス、およびコントロールを組織が実施し、データ資産を効果的に管理するシステム。"},{"t":"需要","en":"demand","d":"内部および外部の利害関係者からの機会やニーズに基づく、バリューシステムへのインプット。"},{"t":"信頼性（ディペンダビリティ）","en":"dependability","d":"時間の経過に伴う証拠の安定性および信頼性を判断するための基準。"},{"t":"デプロイ","en":"deployment","d":"サービスコンポーネントの管理環境への移送。"},{"t":"展開管理プラクティス","en":"deployment management practice","d":"新規または変更されたハードウェア、ソフトウェア、文書、プロセス、あるいはその他のサービスコンポーネントを管理された環境のひとつに移送するプラクティス。"},{"t":"デザイン思考","en":"design thinking","d":"プロダクトとサービス設計者が複雑な問題を解決し、組織と顧客のニーズに応える実践的で創造的なソリューションを発見するために使用される、実践的な人間中心のアプローチ。"},{"t":"開発環境","en":"development environment","d":"ITサービスやアプリケーションの作成または修正に使用される環境。"},{"t":"DevOps","en":"DevOps","d":"ソフトウェア開発者とIT運用担当者間のコミュニケーション、協働、統合を重視し、ソフトウェア提供とインフラ変更のプロセスを自動化する文化的・専門的な運動。ソフトウェアの構築、テスト、リリースを迅速に、頑繁に、より確実に実行できるカルチャーと環境の確立を目指す。"},{"t":"従業員のデジタル体験（DEX）","en":"Digital Employee Experience","d":"従業員体験のデジタル側面。"},{"t":"従業員のデジタル体験の相互依存関係","en":"digital employee experience interdependence","d":"DEXと非デジタルな従業員体験要因（チーム、カルチャー、職場）の相互依存関係。"},{"t":"デジタル期待","en":"digital expectations","d":"蓄積されたデジタルライフ体験によって形成された期待。"},{"t":"デジタル体験","en":"digital experience","d":"人がデジタルプロダクトやサービスとの相互作用に対し、どのように感じ、考え、身体的に反応するかを指す。これには、それらの相互作用を共創する組織や、相互作用の結果に対する反応も含まれる。これらの反応は、プロバイダーと消費者の関係という文脈において、人がそれらの相互作用や結果をどのように予期、知覚、評価するかによって影響を受けるとともに、過去および現在の感情的・認知的・身体的な状態によっても左右される。"},{"t":"デジタルプロダクト","en":"digital product","d":"デジタルテクノロジーに基づいて消費者に価値を提供するように設計された組織のリソースの組み合わせ。"},{"t":"デジタルプロダクトおよびサービスマナジメント","en":"digital product and service management","d":"顧客にとっての価値をサービスとデジタルプロダクトの形で実現する、組織の専門能力の集まり。"},{"t":"デジタルプロダクトおよびサービス","en":"digital products and services","d":"プロバイダーー消費者の関係を通じて消費されるか、獲得後に独立して利用できる、目的を持ったデジタルリソース。"},{"t":"デジタルサービス","en":"digital service","d":"デジタルプロダクトに完全または大部分依存するサービス。"},{"t":"デジタル戦略","en":"digital strategy","d":"組織がその目的を果たし、ビジョンの実現に向けて前進するために、デジタルテクノロジーをどのように活用するかを定義する意思決定および計画の集合。"},{"t":"デジタル技術","en":"digital technology","d":"何かをデジタル化するテクノロジー、またはデジタルデータを処理するテクノロジー。"},{"t":"デジタルトランスフォーメーション","en":"digital transformation","d":"組織のあらゆる領域におけるデジタルテクノロジーの戦略的な導入と統合により、組織の運営方法と顧客およびその他の利害関係者への価値創出の在り方を根本的に変革すること。"},{"t":"直接取得","en":"direct capture","d":"本人がその場にいる状態で記録された信号。"},{"t":"方向の整合性","en":"directional alignment","d":"結果に関して同じ方向を示すシグナル。"},{"t":"災害","en":"disaster","d":"組織に大きな損害や深刻な損失をもたらす、予定外の突然の出来事。災害が発生すると、あらかじめ定められた最小限の期間、組織が重要なビジネス機能を提供できなくなる。"},{"t":"災害復旧計画","en":"disaster recovery plans","d":"組織が災害から復旧するだけでなく、被災前の状態に戻るための方法を、プロダクトおよびサービスマナジメントの４つの側面を考慮して明確に定義した一連の計画。"},{"t":"規律ある意思決定","en":"disciplined decision-making","d":"適切な場合には正反対の見方から、スケール拡大の前にシグナルの一貫性を評価すること。"},{"t":"推進要因","en":"driver","d":"戦略、目標、または要件に影響する要因。"},{"t":"有効性","en":"effectiveness","d":"プラクティス、サービス、または活動の目標が実現されたかどうかを表す指標。"},{"t":"効率性","en":"efficiency","d":"プラクティス、サービス、または活動によって適切な量のリソースが使用されているかどうかを表す指標。"},{"t":"緊急の変更","en":"emergency change","d":"可能なかぎり迅速に導入しなければならない変更。"},{"t":"感情労働","en":"emotional labour","d":"やり取りの感情的な雰囲気を管理するための労力―いら立ちを镇め、遅れを説明し、非難を受け止め、人間味のある口調を保つこと。これは「認知的負荷」としても表現されており、支援され分担されるべき実質的な仕事として認識されている。"},{"t":"感情状態","en":"emotional states","d":"内面的な感情に加え、認知的および身体的な人間の状態。"},{"t":"感情に配慮した明晧さ","en":"emotion-aware clarity","d":"感情状態に配慮してコミュニケーションをとること。"},{"t":"イネーブラー","en":"enabler","d":"消費者と直接やり取りはしないものの、その業務によってサービス提供を可能にする人々。"},{"t":"イネーブリングバリューストリーム","en":"enabling value stream","d":"内部顧客に価値を提供し、組織のコアバリューストリームを支援するバリューストリーム。"},{"t":"エンゲージメント","en":"engagement","d":"他者に対する動機づけられた内的状態であり、観察可能な行動によって裏づけられるもの。"},{"t":"環境","en":"environment","d":"特定の目的に使用される、ITインフラストラクチャの一部。例えば、稼動環境、テスト環境など。何らかのものに影響を及ぼす外的条件を表す場合もある。"},{"t":"エピソード","en":"episode","d":"トリガーから始まり、成果または引き継ぎで終わる目的を持った一連の相互作用であり、しばしば人やその環境の状態と組み合わせて観察される。"},{"t":"エラー","en":"error","d":"インシデントを引き起こす可能性がある不具合や脆弱性。"},{"t":"エラーコントロール","en":"error control","d":"既知のエラーをコントロールするための問題管理活動。"},{"t":"エスカレーション","en":"escalation","d":"作業項目の情報を共有する、またはそのオーナーシップを移管する活動。"},{"t":"評価","en":"evaluation","d":"エピソード後の体験のステージ；エピソード中の体験のステージ；時間の経過とともに体験が解釈される３つのステージのうち第３のステージ。"},{"t":"イベント","en":"event","d":"イベントとは、プロダクト、サービスまたはその他の構成アイテムを管理するうえで重要な意味を持つ状態の変更である。"},{"t":"イベント駆動型関数","en":"event-driven function","d":"特定のイベントに応じて自動的に実行される、自己完結した小さなコードの断片。継続的に実行されたり、クライアントから直接呼び出されたりするのではなく、特定のイベントに反応する。これらにより、運用上のオーバーヘッドやコストを抑えつつ、ユーザーの操作に即座に対応するマイクロサービスパイプライン、リアルタイムデータ処理、APIバックエンドといったリアクティブアーキテクチャを実現できる。"},{"t":"日常的な体験習慣","en":"everyday experience habits","d":"小さく反復可能な行動を通じて体験を向上させる、軽量で役割に合わせた働き方。"},{"t":"期待値の調整","en":"expectation calibration","d":"現実と一致するように、意図的に期待値を設定または再設定すること。"},{"t":"実行パターン","en":"execution pattern","d":"個々のイニシアチブや活動に対して選択されたアプローチ。実行パターンには「封じ込め」・「発見」・「実装」の３種類がある。"},{"t":"期待","en":"expectations","d":"体験の解釈を形作る先行する確信。"},{"t":"体験","en":"experience","d":"人がある状況に対して、どのように感じ、考え、身体的に反応するかということ。"},{"t":"体験設計の推進要因","en":"experience design drivers","d":"体験の成果に一貫して影響を与える５つの反復的なパターン：透明性、参加、感情に配慮した明確さ、フィードバックループ、そして戦略としてのケア。これらの推進要因は、ライフサイクルおよび各ジャーニー段階全体にわたって適用できるレバーとして機能する。"},{"t":"体験レベル","en":"experience level","d":"期待または実現されるユーザー体験を定義する一連の指標。"},{"t":"体験レベルアグリーメント（XLA）","en":"Experience Level Agreement","d":"サービスプロバイダーと顧客の間で締結され、サービスの合意された体験レベルを特定する文書化された合意。"},{"t":"体験シグナル取得フレームワーク","en":"experience signal capture framework","d":"シグナルがどこで生じるか、その捕え方、および一般的なギャップの示し方。"},{"t":"体験スチワードシップ","en":"experience stewardship","d":"体験に影響を与える実行責任がどのように組織されているか。"},{"t":"実験する","en":"experiment","d":"複雑な人間システムに適した改善モードのうち最後のもの。「気づき」、「解釈」、「仮説立案」の後に行う。"},{"t":"外部顧客","en":"external customer","d":"サービスプロバイダーとは異なる組織に属する顧客。"},{"t":"外部要素","en":"external elements","d":"組織、デジタルプロダクトおよびサービス、成果。"},{"t":"抽出・ロード・変換（ELT）","en":"Extract-Load-Transform","d":"運用データソースから、分析に適した形式へデータを移行するための手法。抽出：ソースからデータを取得する。ロード：生データをターゲットシステム（多くの場合、最新のクラウドデータレイクや大規模並列処理（MPP）型データウェアハウス）に即座に格納する。変換：宛先環境の計算能力を活用し、その中でトランスフォーメーションを実行する。"},{"t":"抽出・変換・ロード（ETL）","en":"Extract-Transform-Load","d":"運用データソースから、分析に適した形式へデータを移行するための手法。抽出：ソースシステムから生データを取得する。変換：データをクリーンアップ、補完、集計、またはその他の方法で再構成し、ターゲットスキーマやビジネスルールに適合させる。ロード：変換されたデータを、通常はデータウェアハウスや分析プラットフォームといった宛先システムに書き込む。"},{"t":"障害","en":"failure","d":"仕様に沿って稼動する能力、もしくは要求されるアウトプットまたは成果を提供する能力を失うこと。"},{"t":"フィードバック","en":"feedback","d":"利害関係者の反応や意見に関する情報で改善の基礎として使用されるもの。"},{"t":"フィードバックループ","en":"feedback loop","d":"ある活動のアウトプット一部が新たなインプットとして再利用される状況を指す一般的な用語。"},{"t":"フェルトエージェンシー（FA）","en":"Felt Agency","d":"その人が実際に選択肢や対処手段（別の経路、取り消し、人による支援、異議申し立ての可能性）を有しているか。"},{"t":"フロー効率","en":"flow efficiency","d":"サイクルタイム（または付加価値時間）がリードタイムに占める割合を示す指標。"},{"t":"機能領域","en":"functional domains","d":"要件定義、技術的なデリバリー、インシデント解決など、デジタルプロダクトやサービスの定義、提供、サポートに関する中核業務に焦点を当てたインタラクション。"},{"t":"機能的なインタラクション","en":"functional interaction","d":"要件定義、技術的なデリバリー、インシデント解決など、デジタルプロダクトやサービスの定義、提供、サポートに関する中核業務に焦点を当てたインタラクション。"},{"t":"機能レイヤー","en":"functional layer","d":"インタラクションにおける実用的・タスク的な側面であり、関係性のレイヤーと並んで存在するもの。"},{"t":"ギャップ（パフォーマンス）","en":"gap (performance)","d":"実績とターゲットのパフォーマンス差であり、アクションの指針となるもの。"},{"t":"生成AI（GenAI）","en":"Generative AI","d":"既存のデータから学習したパターンに基づいて、テキスト、画像、コードなどの新しいコンテンツやその他の出力を生成できるAIシステム。"},{"t":"商品","en":"goods","d":"サービスプロバイダーからサービス消費者に渡される、または渡すことができる有形リソース。オーナーシップに加えて、関連付けられている権限と責任もサービス消費者に移管される。"},{"t":"ガバナンス","en":"governance","d":"組織を方向付け、コントロールするシステム。"},{"t":"デジタルテクノロジーのガバナンス","en":"governance of digital technology","d":"人をベースとしたシステムで、デジタルテクノロジーの現在および将来の利用を管理する。システムは指示、監督、説明責任を含む。"},{"t":"仮説チェーン","en":"hypothesis chain","d":"選択された重要成功要因（CSFs）、それに対応する業務上の重要業績評価指標（KPIs）、およびターゲット値と実績値を通じて、現状を望ましい目標に結び付ける、明示的で検証可能な連鎖。両者を比較することでギャップが明らかになり、学習とアクションが促進される。"},{"t":"仮説を立てる","en":"hypothesize","d":"複雑な人間システムに適した改善モードのうち3番目のもの。「気づき」、「解釈」、「実験」の中間に位置する。"},{"t":"ID","en":"identity","d":"ユーザー、個人、または役割を識別し、システムへのアクセス権を付与するために使用される一意の名前。"},{"t":"改善モード","en":"improvement modes","d":"複雑な体験上の課題に取り組むための４つのモード。「気づく」、「解釈する」、「仮説を立てる」、「実験する」。"},{"t":"インシデント","en":"incident","d":"サービスの計画外の中断、またはサービスの品質の低下。"},{"t":"インシデント管理プラクティス","en":"incident management practice","d":"通常のサービス運用状態を可能な限り迅速に復旧し、インシデントの悪影響を最小限に抑えるプラクティス。"},{"t":"間接的な取得","en":"indirect capture","d":"事後に残された痕跡やアーティファクトから推測されるシグナル。"},{"t":"情報とテクノロジー","en":"information and technology","d":"プロダクトおよびサービスマナジメントの４つの側面の１つ。デジタルプロダクトおよびサービスで使用されるデータ、情報、およびテクノロジー、ならびに組織のプロダクトおよびサービスマナジメントシステムの一部として使用されるものを対象とする。"},{"t":"情報の非対称性","en":"information asymmetry","d":"関係において一方の当事者が他方の当事者より多くの情報を持っていること。"},{"t":"情報セキュリティ管理プラクティス","en":"information security management practice","d":"情報の機密性、完全性、可用性へのリスクを把握し管理することで組織を防御するプラクティス。"},{"t":"情報セキュリティポリシー","en":"information security policy","d":"情報セキュリティ管理に対する組織のアプローチを統制する方針。"},{"t":"インフラストラクチャおよびプラットフォーム管理プラクティス","en":"infrastructure and platform management practice","d":"組織が使用するインフラストラクチャとプラットフォームを監督するプラクティス。これにより、サードパーティーのソリューションを含む利用可能な技術ソリューションをモニタリングできる。"},{"t":"インフラストラクチャ・アズ・コード（IaC）","en":"Infrastructure as Code","d":"インフラストラクチャ（サーバー、ネットワーク、ストレージなど）は、手作業でのセットアップではなく、機械可読な構成ファイルやスクリプトを用いてプロビジョニングおよび管理される。"},{"t":"イニシアチブ","en":"initiative","d":"「スコープ」ステップからの単一のアウトプット。組織が実行レイヤーの各ステップを通じて一括で実行することを決定したトランスフォーメーションのサブセット。多くの場合、複数、あるいは多くのイニシアチブが並行して進行する。イニシアチブは、単一の望ましい成果によって範囲が定められる場合もあれば、組織構造に従う場合もある。"},{"t":"イノベーション","en":"innovation","d":"新しい技術や働き方の採用により、組織・プロダクト・サービスが大きく改善されたこと。"},{"t":"統合型体験設計","en":"integrated experience design","d":"機能的な相互作用と関係的な相互作用の両方を考慮したデザイン。"},{"t":"完全性","en":"integrity","d":"ある当事者が、別の当事者にとって受け入れ可能な原則を順守しているという認識。能力と善意とともに、知覚される信頼性の中核要素。"},{"t":"完全性（システム）","en":"integrity (system)","d":"情報が、承認された要員および活動のみによって確実に修正されるようにするセキュリティ目標。"},{"t":"利口な不服従","en":"intelligent disobedience","d":"手順の遵守が体験を損なう場合に、規律を保ちつつ透明性を持って手順から逸脈すること。"},{"t":"内部条件","en":"internal condition","d":"期待、内面的な感情的・認知的・身体的な状態、および他の共同創造者やプロダクト、サービスとの内的なエンゲージメント。"},{"t":"内部顧客","en":"internal customer","d":"サービスプロバイダーと同じ組織に属する顧客。"},{"t":"モノのインターネット（IoT）","en":"Internet of Things","d":"インターネットやその他通信ネットワークを介して他のデバイスやシステムと接続し、データを交換することを可能にする、センター、ソフトウェア、その他のテクノロジーが組み込まれた物理デバイスのネットワーク。"},{"t":"相互運用性","en":"interoperability","d":"異なるベンダーのコンビューターシステムやソフトウェアが連携し、情報を交換して利用できる能力。"},{"t":"解釈する","en":"interpret","d":"複雑な人間システムに適した4つの改善モードのうち2番目のもの。「気づき」、「仮説立案」、「実験」の中間に位置する。"},{"t":"解釈段階","en":"interpretive stages","d":"期待、知覚、評価。"},{"t":"IT資産","en":"IT asset","d":"ITプロダクトまたはITサービスの提供に利用できる、経済的な価値を持つすべてのコンポーネント。"},{"t":"IT資産管理プラクティス","en":"IT asset management practice","d":"すべてのIT資産のライフサイクル全体を計画し管理するプラクティス。"},{"t":"ITインフラストラクチャ","en":"IT infrastructure","d":"ITサービスの開発、テスト、提供、モニタリング、管理、およびサポートに必要とされるすべてのハードウェア、ソフトウェア、ネットワーク、設備。"},{"t":"ITサービス","en":"IT service","d":"情報技術の利用に基づくサービス。"},{"t":"ITIL","en":"ITIL","d":"デジタルプロダクトおよびサービスマナジメントのためのフレームワークとベストプラクティスガイダンス。"},{"t":"ITIL継続的改善モデル（ITIL CIM）","en":"ITIL Continual Improvement Model","d":"組織に計画と改善の実施に対する体系的なアプローチを提供するモデルである。"},{"t":"ITIL エクスペリエンスモデル","en":"ITIL Experience Model","d":"体験がどのように発生し、進化するかを説明する構成概念。外的要素、解釈の段階、内的条件という、相互に作用する3つの層で構成される。"},{"t":"ITILプロダクトおよびサービスマナジメントの４つの側面","en":"ITIL Four Dimensions of Product and Service Management","d":"顧客と他の利害関係者に対する価値を、プロダクトおよびサービスという形で効果的かつ効率的に高めるために欠かせない４つの視点。"},{"t":"ITIL従うべき原則","en":"ITIL Guiding Principles","d":"組織の目標、戦略、業務の種類、管理構造が変化したとしても、あらゆる状況で組織を導くことができる推奨事項。"},{"t":"ITILバリューシステム（ITIL VS）","en":"ITIL Value System","d":"デジタルプロダクトとサービスを通じて価値創出を促進するために、組織のすべてのコンポーネントと活動がどのように連携して機能するかを表すモデル。"},{"t":"ジャーニーマップ","en":"journey map","d":"消費者ロールがプロバイダーと関わる際にたどりうる、あらゆるステップと経路の表現。体験を抽象化・一般化した視点。"},{"t":"ジャーニーパス","en":"journey path","d":"サービスジャーニーにおいて、個々の消費者や利害関係者が実際にたどる経路。それは、想定された価値ではなく、実際に体験された価値を反映している。"},{"t":"ジャーニーステップ","en":"journey step","d":"旅程における個別のエピソード。"},{"t":"カンバン","en":"Kanban","d":"作業を可視化したり、発生の可能性がある障害やリソース競合を識別したり、進行中の作業を管理したりするための手法。"},{"t":"重要業績評価指標（KPI）","en":"Key Performance Indicator","d":"目標の達成度を評価するために使用される、重要な指標。"},{"t":"ナレッジ管理プラクティス","en":"knowledge management practice","d":"組織全体の情報とナレッジを効果的、効率的、便利に使用できる状態を維持し、改善していくためのプラクティス。"},{"t":"既知のエラー","en":"known error","d":"分析済みだが未解決の問題。"},{"t":"レイヤー","en":"layer","d":"共通のテーマに関連するステージのサブセット。ガバナンス、ポジショニング、実行、学習の4つのレイヤーで構成される。"},{"t":"リーダーシップ","en":"leadership","d":"明確なビジョンに向かって取り組む個人、チーム、組織を鼓舞し、影響を与え、動機づけ、支援する能力。"},{"t":"リードタイム","en":"lead time","d":"バリューストリームのワークフローの開始から、意図した成果物の提供までの総時間。"},{"t":"リーン","en":"Lean","d":"無駄を排除して価値を最大化することで、ワークフローの改善に注力するアプローチ。"},{"t":"ライフサイクル","en":"lifecycle","d":"サービス、プロダクト、プラクティス、またはその他のエンティティなどの要素の耐用期間における、すべての段階、移行、関連ステータスを含んだもの。"},{"t":"可視ライン","en":"line of visibility","d":"相手側からサービス活動が見えなくなる境界点。"},{"t":"稼動中","en":"live","d":"稼動環境で動作するサービスまたはその他の構成アイテムを指す。"},{"t":"稼動環境","en":"live environment","d":"デジタルプロダクトの運用およびサービス消費者へのデジタルサービスの提供に用いられる管理された環境。"},{"t":"保守性","en":"maintainability","d":"サービスまたはその他のエンティティを修復または修正する際の容易さ。"},{"t":"重大インシデント","en":"major incident","d":"重大なビジネスインパクトを及ぼすため、迅速な解決を目指して組織的に取り組む必要があるインシデント。"},{"t":"マネージドサービスプロバイダー（MSP）","en":"Managed Service Provider","d":"顧客のデジタルプロダクトやサービスを遠隔で管理する組織。MSPは、特定のライフサイクル段階の責任を負い、デジタルプロダクトおよびサービスのマナジメント業務を「as-a-service（アズ・ア・サービス）」として提供することが多い。"},{"t":"管理","en":"management","d":"組織を指揮しコントロールするための調整された活動。"},{"t":"管理プラクティス","en":"management practice","d":"作業を実行するため、または目標を実現するために設計された一連の組織のリソース。"},{"t":"管理システム","en":"management system","d":"方針と目標を定め、その目標の達成を可能にする、相互に接続された要素のシステム。"},{"t":"成熟度","en":"maturity","d":"組織、プラクティス、プロセスの信頼性、効率性または有効性を評価する指標。"},{"t":"測定および報告プラクティス","en":"measurement and reporting practice","d":"不確実性を低減し、適切な意思決定を支援するとともに、継続的改善を促進するプラクティス。"},{"t":"媒介されたインタラクションに対する選好","en":"mediated interaction preference","d":"対面との比較における、デジタルを介したやり取りに対する快適さ。"},{"t":"メンバーチェック","en":"member check","d":"対象者に対し、解釈が自身の見解と一致しているかを確認するよう求める依頼。"},{"t":"手法の多样性","en":"method diversity","d":"シグナルは、収束性を備えた異なる手法によって生成される。"},{"t":"指標","en":"metric","d":"管理および改善を目的としてモニタリングまたは報告される測定値または計算値。"},{"t":"平均故障間隔（MTBF）","en":"Mean Time Between Failures","d":"サービスまたはその他の構成アイテムの故障頻度を示す指標。"},{"t":"サービス復旧平均時間（MTRS）","en":"Mean Time to Restore Service","d":"障害発生からサービスが復旧するまでの速さを示す指標。"},{"t":"実用最小限のプロダクト（MVP）","en":"Minimum Viable Product","d":"初期の顧客を満足させるため、および今後のプロダクト開発に役立つフィードバックを得るための最低限の機能を備えたプロダクト。"},{"t":"ミッション","en":"mission","d":"簡潔ではあるが、完全に組織の目的と意図を記述している説明。"},{"t":"モデル","en":"model","d":"システム、プラクティス、プロセス、サービスまたはその他のエンティティを表し、その動作と関係性を把握し、予測するために使用できるもの。"},{"t":"モデリング","en":"modelling","d":"モデルを作成し、維持し、利用する活動。"},{"t":"モニタリング","en":"monitoring","d":"イベントを検出し、現在のステータスを確実に把握するために、システム、プラクティス、プロセス、サービスまたはその他のエンティティを繰り返し観察すること。"},{"t":"モニタリングおよびイベント管理プラクティス","en":"monitoring and event management practice","d":"サービスおよびサービスコンポーネントを系統的に観察し、イベントとして認識された特定の状態変化を記録し報告するプラクティス。"},{"t":"ナラティブシグナル","en":"narrative signals","d":"認識、文脈、説明（出来事の背後にある「なぜ/どのように」という質的な理由）を描写する言葉、物語、観察、およびアーティファクト。"},{"t":"ネガティブテスト","en":"negative testing","d":"無効な、または予期しない入力に対して、機能や動作が期待通りに動作することを検証するテストの一種。"},{"t":"非機能テスト","en":"non-functional testing","d":"システムが何を実行するかではなく、どのように動作するかを検証するテストの一種。"},{"t":"報復禁止に関するフィードバック声明","en":"non-retaliation feedback statement","d":"意見を表明しても安全であることを示す、短い公表文。"},{"t":"気づく","en":"notice","d":"複雑な人間システムに適した4つの改善モードのうち最初のもの。「解釈」、「仮説立案」、「実験」に先立って行う。"},{"t":"数値シグナル","en":"numerical signals","d":"システム、テレメトリ、または構造化された調査から得られる、件数、率、継続時間などの量的に構造化された指標（「何が／どれくらい／いつ」を示す）。"},{"t":"目標（体験）","en":"objective (experience)","d":"仮説の連鎖の一部である、上位の望ましい体験成果。"},{"t":"オブザーバビリティ","en":"observability","d":"複雑なシステムの内部状態を、指標、ログ、トレースなどの外部出力を分析することで理解する能力。"},{"t":"OCRコミットメント","en":"OCR commitment","d":"基盤となるデジタルプロダクトやサービスに関するSLAではなく、成果・コスト・リスクに対する共有されたコミットメント。"},{"t":"オパレーティングモデル","en":"operating model","d":"組織が顧客や他の利害関係者とどのように価値を共創するか、また組織がどのように運営されているかを概念的または視覚的に表現したもの。"},{"t":"運用","en":"operation","d":"活動、プロダクト、サービスまたはその他の構成アイテムを、定型化された方法で実施、管理すること。"},{"t":"運用技術","en":"operational technology","d":"バルブ、ポンプなどの物理デバイスに対する直接的なモニタリングやコントロールを行うことで、物理プロセスにおける変更を検出したり変更を加えたりするハードウェアソリューションおよびソフトウェアソリューション。"},{"t":"機会","en":"opportunity","d":"利害関係者への価値の付加、あるいは組織を改善する可能性。"},{"t":"組織","en":"organization","d":"自らの目的を達成するため、責任、権限および相互関係を伴う機能をもつ、個人または人々の集まり。"},{"t":"組織の目的","en":"organization's purpose","d":"組織が消費者や他の利害関係者に対して何を行い、なぜそれを行うのかを説明する。"},{"t":"組織変更の管理プラクティス","en":"organizational change management practice","d":"組織変更を確実に円滑で成功裏に実施し、さらにその変更の人に関わる側面を管理することで長期的な便益を実現することを確実にするプラクティス。"},{"t":"組織の耐障害弾力性","en":"organizational resilience","d":"組織が外部からの計画外の影響に対して、予測、準備、対応、および適応するための能力。"},{"t":"組織ベロシティ","en":"organizational velocity","d":"組織が備える速度、有効性、および効率性。組織ベロシティは、市場投入までの期間、品質、安全性、コストおよびリスクに影響する。"},{"t":"組織と人材","en":"organizations and people","d":"プロダクトおよびサービスマナジメントの４つの側面の１つ。組織内の役割、責任、および権限と意思伝達のシステムに加え、組織を構成および管理する方法を明確に定義し、それによって組織の全体的な戦略とオパレーティングモデルをサポートする。"},{"t":"成果","en":"outcome","d":"1つまたは複数のアウトプットによって可能になる利害関係者にとっての結果。"},{"t":"アウトプット","en":"output","d":"活動の有形または無形の提供物。"},{"t":"アウトソーシング","en":"outsourcing","d":"以前は内部で提供していたプロダクトおよびサービスを、外部のサプライヤーに依頼して提供してもらうプロセス。"},{"t":"パートナーとサプライヤー","en":"partners and suppliers","d":"プロダクトおよびサービスマナジメントの４つの側面の１つ。サービスの設計、開発、デプロイ、提供、サポート、継続的改善の一部または全部に関与する他の組織との関係性をすべて網羅する。"},{"t":"パートナーシップ","en":"partnership","d":"共通の目標を実現するために緊密に連携することを伴う２つの組織の関係。"},{"t":"知覚","en":"perception","d":"時間の経過とともに体験が解釈される３つの段階のうちの第２段階。"},{"t":"パフォーマンス","en":"performance","d":"システム、人、チーム、プラクティス、またはサービスによって達成または提供されたものの尺度。"},{"t":"個人領域","en":"personal domain","d":"機能的、関係的、および文脈的な領域と並ぶ、情動的・認知的・身体的反応。"},{"t":"パイロット","en":"pilot","d":"稼動環境の限られた範囲を対象とした、サービスのテスト実装。"},{"t":"方針","en":"policy","d":"マネジメントの期待と意図を正式に文書化したもの。決定および活動を指示するために使用される。"},{"t":"ポートフォリオ管理プラクティス","en":"portfolio management practice","d":"組織がプログラム、プロジェクト、プロダクト、およびサービスを適切に組み合わせて、組織の資金とリソースの制約内で戦略を実行できることを確実にするプラクティス。"},{"t":"ポジティブテスト","en":"positive testing","d":"有効かつ正しいインプットに対し、機能が期待通りに動作することを検証するテストの一種。"},{"t":"実施後レビュー（PIR）","en":"Post-Implementation Review","d":"変更の実施後にその成功を評価し、改善の機会を特定するためのレビュー。"},{"t":"プラクティス","en":"practice","d":"作業を実行するため、または目標を実現するために設計された一連の組織のリソース。"},{"t":"一次データ","en":"primary data","d":"監査証跡として保存されるログや記録などの生データとなる証拠。"},{"t":"プリンシパル","en":"principal","d":"顧客とデジタルプロダクトおよびサービスの内容について合意し、プロバイダーを代表して顧客への約束の履行を担う役割。"},{"t":"優先度付け","en":"prioritization","d":"バックログ内のすべてのタスクにリソースを割り当てられない場合に、最初に取り組むタスクを選定すること。"},{"t":"問題","en":"problem","d":"１つまたは複数のインシデントの原因、または潜在的原因。"},{"t":"問題管理プラクティス","en":"problem management practice","d":"インシデントの実際の原因と潜在的原因を識別し、ワークアラウンドと既知のエラーを管理することで、インシデントの発生可能性とインパクトを低減するプラクティス。"},{"t":"手順","en":"procedure","d":"活動またはプロセスを実行する方法を文書化したもの。"},{"t":"プロセス","en":"process","d":"プロセスとは、インプットをアウトプットに変換する、相互につながるまたはやり取りする一連の活動である。プロセスは活動の順序と依存関係を定義する。"},{"t":"プロダクト","en":"product","d":"サービス消費者に価値を提供できるように設計された、組織のリソースの構成。"},{"t":"プロダクトおよびサービスポートフォリオ","en":"product and service portfolio","d":"組織によってライフサイクル全体を通して管理されるすべてのプロダクトおよびサービスを集めたもの。"},{"t":"プロダクト/サービスのプロトタイプ","en":"product/service prototype","d":"プロダクトやサービスの基本的な形態、機能、および運用能力を示す初期バージョン。プロダクトのデザインと機能をテストし、仮説を検証するために使用される。プロトタイプは、視覚的なモックアップから完全に機能するモデルまで、複雑さや目的がさまざまである。"},{"t":"プロダクト/サービス仕様","en":"product/service specification","d":"プロダクトやサービスの重要な側面、要件、特性を詳述した文書。通常、プロダクトまたはサービスの特征、機能、技術要件、パフォーマンス基準、ユーザーインターフェースの詳細が一般的に含まれる。"},{"t":"プロダクトベンダー","en":"product vendor","d":"デジタルプロダクトおよび関連サービス提供物を創造し、継続的改善責任を持つ組織。"},{"t":"本番環境","en":"production environment","d":"「稼動環境」を参照。"},{"t":"プログラム","en":"programme","d":"一連の関連するプロジェクトと活動、およびそれらを指示および監督するために構築した組織の仕組み。"},{"t":"プロジェクト","en":"project","d":"合意済みのビジネスケースに従い、１つまたは複数のビジネスプロダクトを提供する目的で構築された一時的な仕組み。"},{"t":"プロジェクト管理プラクティス","en":"project management practice","d":"組織のプロジェクトがすべて成功裏に提供されることを確実にするプラクティス。"},{"t":"約束の明瞭さ（PC）","en":"Promise Clarity","d":"利用時点でその約束が明確であるか（期待される内容、時期、主体）。"},{"t":"比例的な規模","en":"proportionate magnitude","d":"提案されたアクションの規模が、シグナルの強さに見合っているかどうか。"},{"t":"プロバイダー","en":"provider","d":"合意条件に基づき、消費者に対して定義された価値単位を提供し、その対価として別の価値単位を受け取る組織。"},{"t":"プロバイダー スポンサー","en":"provider sponsor","d":"全体的なパフォーマンス、信頼性、および運用の一貫性を監督する役割。"},{"t":"プロバイダーと消費者の緊張","en":"provider–consumer tension","d":"提供者と消費者の間、特に顧客とプリンシパルの間に生じる緊張。期待値の不一致が連鎖的に波及し、ユーザーとエージェントの間に摩擦を生じさせる。"},{"t":"プロバイダー側の緊張","en":"provider-side tension","d":"境界をまたいで約束を行い、守る過程でプロバイダー組織内部で生じる緊張：エージェントやイネーブラーは自身で行っていない約束の履行を迫られ、プリンシパルは競争力のある約束と現実的な能力とのバランスを取り、スポンサーは一貫性の維持に努める。"},{"t":"心理的安全","en":"psychological safety","d":"人々が恐れずに参加できる条件。"},{"t":"目的","en":"purpose","d":"組織の目的とは、その組織が存在する理由である。それは組織の長期的な目標や世界において果たす役割を記述するものであり、「私たちはどのようなビジネスを行っているのか」という問いへの答えとなる。"},{"t":"クイックウィン","en":"quick win","d":"比較的少ないコストと労力で、短期間内に投資の回収をもたらすと期待される改善。"},{"t":"レコード","en":"record","d":"実現された結果が記述され、実施された活動の証拠となる文書。"},{"t":"復旧","en":"recovery","d":"障害発生後に構成アイテムを通常の運用に戻す活動。"},{"t":"復旧時点目標（RPO）","en":"Recovery Point Objective","d":"活動を再開する際に、その活動の運用を可能にするために情報を復旧すべき時点。"},{"t":"目標復旧時間（RTO）","en":"Recovery Time Objective","d":"サービス中断後、ビジネス機能の停止が組織に深刻な影響を及ぼすまでの許容可能な最大時間。"},{"t":"自己言及に関する注記","en":"reflexivity note","d":"解釈者の立場を明示することで検証可能性を裏付ける注記。"},{"t":"回帰テスト","en":"regression testing","d":"コードの変更によって既存の機能性に悪影響が生じていないことを検証するテストの一種。"},{"t":"関係領域","en":"relational domains","d":"機能的、個人的、および文脈的な領域と並ぶ、それらを可能にし、支える提供者との相互作用。"},{"t":"関係性の体験","en":"relational experience","d":"体験における関係性の側面（機能と並んで、有能さ・配慮・公正さを示すシグナル）。"},{"t":"関係性重視のインタラクション","en":"relational interaction","d":"プロバイダーと消費者の関係性に焦点を当てたインタラクション。契約協議、ガバナンス会議、組織紹介などが含まれる。これらは機能的インタラクションの解釈条件に影響を与える。"},{"t":"関係層","en":"relational layer","d":"相互作用における関係性/意味の側面。機能的な層と並んで存在する。"},{"t":"関係管理プラクティス","en":"relationship management practice","d":"戦略レベルおよび戦術レベルで、組織と利害関係者との間につながりを確立し、深めるためのプラクティス。"},{"t":"リリース","en":"release","d":"プロダクト、サービス、その他の構成アイテムのバージョン、または構成アイテムの集合体で、利用可能にされるもの。"},{"t":"リリース管理プラクティス","en":"release management practice","d":"新規および変更されたサービス並びに機能を使用可能にするプラクティス。"},{"t":"信頼性","en":"reliability","d":"プロダクト、サービスまたはその他の構成アイテムが、指定の期間または指定の繰り返し回数、意図した機能を実行する能力。"},{"t":"代表性","en":"representation","d":"役割の保有者に代わって権限を与えられた者が、当事者とのやり取りにおいて役割を行使する、正式に委任された取り決め。役割の保有者は最終的な説明責任を保持し、代表者は定義された範囲と期間内で活動する。"},{"t":"要求カタログ","en":"request catalogue","d":"サービスカタログのビューの１つ。既存および新規のサービスに対するサービス要求の詳細をユーザーに提供する。"},{"t":"変更要求（RFC）","en":"Request for Change","d":"利害関係者から提出された変更提案の説明。"},{"t":"解決","en":"resolution","d":"インシデントまたは問題を解決する活動。"},{"t":"リソース","en":"resource","d":"活動の実施または達成目標の実現に必要な要員、資材、財源、その他のエンティティ。組織が使用するリソースは、組織によって所有されている場合もあれば、リソースのオーナーから合意を得て使用される場合もある。"},{"t":"廃止","en":"retire","d":"プロダクト、サービスまたはその他の構成アイテムが永久的に使用されないようにする活動。"},{"t":"リスク","en":"risk","d":"損害や損失を引き起こす、または目標の実現をより困難にする可能性があるイベント。"},{"t":"リスクアセスメント","en":"risk assessment","d":"リスクを識別し、分析し、評価する活動。"},{"t":"リスク管理プラクティス","en":"risk management practice","d":"組織がリスクを把握して効果的に対処することを確実にするプラクティス。"},{"t":"安全な参加の基本","en":"safe participation basics","d":"安全のための設計：選択とコントロール、明確さ、デフォルトでのプライバシー保護、人間による支援、非評価的なトーン。"},{"t":"セーフティカルチャー","en":"safety culture","d":"人々が自分自身でいること（そしてそれを表現すること）に安心できる組織カルチャー。"},{"t":"科学的思考","en":"scientific thinking","d":"問いを検証可能な仮説へと体系的に変換し、証拠と対峙して、その結果に応じて信念を比例的かつ公開に、懐疑的に、かつ再現可能な形で更新していく規律ある実践。"},{"t":"二次データ","en":"secondary data","d":"定義が明確な集計指標（例：KPI）。"},{"t":"安全と福祉","en":"secure well-being","d":"ウェルビーイングの確保／精神的および身体的な健康を保護する必要性。多くの場合、雇用の文脈において、もう一つのニーズである「持続可能な貢献」と相反することが多い。"},{"t":"順序的な妥当性","en":"sequential plausibility","d":"シグナルが時間や順序において妥当であること。"},{"t":"サービス","en":"service","d":"顧客が特定のコストやリスクを管理することなく、望んでいる成果を得られるようにすることで、価値の共創を可能にする手段。"},{"t":"サービス活動","en":"service action","d":"サービスプロバイダーによって、またはサービスプロバイダーとサービス消費者の共同によって実行される活動。"},{"t":"サービスアーキテクチャ","en":"service architecture","d":"組織によって提供されるすべてのサービスを俾瞰できるようにしたもの。サービス間のデータのやり取りや、各サービスの構造と動作を表すサービスモデルも含まれる。"},{"t":"サービスカタログ","en":"service catalogue","d":"特定の対象者に合わせて、サービスプロバイダーのすべてのサービスおよびサービス提供物に関する構造化された情報。"},{"t":"サービスカタログ管理プラクティス","en":"service catalogue management practice","d":"すべてのサービスおよびサービス提供物に関する一貫した情報の単一の情報源を提供し、関連する対象者に利用可能であることを確実にするプラクティス。"},{"t":"サービス構成管理プラクティス","en":"service configuration management practice","d":"サービスの構成、およびそれらをサポートする構成アイテムに関する正確で信頼できる情報を、必要なときに必要なところで利用可能であることを確実にするプラクティス。"},{"t":"サービス消費者","en":"service consumer","d":"サービスの調達と利用を担当する組織。"},{"t":"サービス消費","en":"service consumption","d":"組織がサービスを消費するために実施する活動。これには、サービスを利用するために必要なサービス消費者のリソースの管理、ユーザーが実施するサービス活動、さらに必要な場合は商品の受け取り（入手）が含まれる。"},{"t":"サービス継続性管理プラクティス","en":"service continuity management practice","d":"災害の発生時にサービスの可用性とパフォーマンスを十分なレベルで維持することを確実にするプラクティス。"},{"t":"サービスデザインプラクティス","en":"service design practice","d":"目的に適し、使用に適し、さらに組織およびそのエコシステムによって提供できるプロダクトおよびサービスを設計するプラクティス。"},{"t":"サービスデスク","en":"service desk","d":"サービスプロバイダーとすべてのユーザーとの間のコミュニケーションの接点。"},{"t":"サービスデスクプラクティス","en":"service desk practice","d":"すべてのユーザーに対してサービスプロバイダーとの接点および窓口を提供し、インシデント解決とサービス要求の需要を捕捉するプラクティス。"},{"t":"サービス体験","en":"service experience","d":"利害関係者が認識する、サービスおよびサービスプロバイダーとの実務的および感情的なやり取りの積み重ね。"},{"t":"サービス財務管理プラクティス","en":"service financial management practice","d":"組織の財務リソースと投資が効果的に使用されることを確実にすることで、組織におけるサービスマナジメントの戦略と計画を支援するプラクティス。"},{"t":"サービスジャーニー","en":"service journey","d":"サービス関係に携わる組織がサービスプロバイダーとサービス消費者としての役割を果たすために行う活動とやり取りの積み重ね。"},{"t":"サービスレベル","en":"service level","d":"期待または実現されるサービス品質を定義する一連の指標。"},{"t":"サービスレベルアグリーメント（SLA）","en":"Service Level Agreement","d":"サービスプロバイダーと顧客の間で締結された文書化された契約であり、提供されるサービスと各サービスについて合意された水準を明示するもの。"},{"t":"サービスレベル管理プラクティス","en":"service level management practice","d":"サービスパフォーマンスの明確な目標値を事業に基づいて設定し、その目標値に対して、サービスの提供を適切に評価、モニタリングおよび管理できるようにするプラクティス。"},{"t":"サービスマナジメント","en":"service management","d":"顧客にとっての価値をサービスの形で実現する、組織の専門能力の集まり。"},{"t":"サービス提供物","en":"service offering","d":"対象となる消費者グループのニーズに対応するために設計された、一つ以上のサービスに関する正式な説明。サービス提供物には、商品、リソースへのアクセス、サービス活動が含まれる場合がある。"},{"t":"サービスポートフォリオ","en":"service portfolio","d":"組織によってライフサイクル全体を通して管理されるすべてのプロダクトおよびサービスを集めたもの。"},{"t":"サービスプロバイダー","en":"service provider","d":"サービスの提供およびサポートを担当する組織。"},{"t":"サービス供給","en":"service provision","d":"組織がサービスを供給するために実施する活動。サービスを提供するために構成されたプロバイダーのリソースの管理、ユーザーがこれらのリソースに確実にアクセスできるようにすること、合意済みのサービス活動の実現、サービスレベル管理、継続的改善が含まれる。さらに、商品の供給が含まれる場合もある。"},{"t":"サービス品質","en":"service quality","d":"サービスの特性のうち、明示的および暗黙的なニーズを満たす能力に関連するものの総和。"},{"t":"サービス関係","en":"service relationship","d":"サービスプロバイダーおよびサービス消費者間の協力関係。サービス関係には、サービス供給、サービス消費およびサービス関係管理が含まれる。"},{"t":"サービス関係管理","en":"service relationship management","d":"合意済みの利用可能なサービス提供物に基づいて継続的な価値の共創を確実にするためにサービスプロバイダとサービス消費者が共同で行う活動。"},{"t":"サービス要求","en":"service request","d":"通常のサービス提供の一部として合意したサービス活動を開始するユーザーまたは権限を与えられたユーザー代理人からの要求。"},{"t":"サービス要求管理プラクティス","en":"service request management practice","d":"事前に定義され、ユーザーが開始したすべてのサービス要求を効果的かつユーザーフレンドリーな方法で処理することによって、合意済みのサービス品質を支援するプラクティス。"},{"t":"サービスバリデーションおよびテストプラクティス","en":"service validation and testing practice","d":"新規、または変更されたプロダクトおよびサービスが、定義された要件を満たすことを確実にするプラクティス。"},{"t":"サービス価値","en":"service value","d":"知覚される便益、有用性、および重要性。"},{"t":"シグナル","en":"signal","d":"集約や解釈が行われる前に取得された、ある出来事や状態に関する、生の数値または記述による単一の観察された証拠。"},{"t":"シグナル応答性（SR）","en":"Signal Responsiveness","d":"弱いシグナルが認識とアクションをトリガーする速さ。"},{"t":"サイトリライアビリティエンジニアリング（SRE）","en":"Site Reliability Engineering","d":"ソフトウェアエンジニアリングの要素を取り入れ、それをインフラストラクチャと運用の問題に適用する規律。スケーラブルで非常に信頼性の高いソフトウェアシステムを作成することが主な目標。"},{"t":"ソフトウェア開発および管理プラクティス","en":"software development and management practice","d":"機能性、信頼性、保守性、コンプライアンス、および監査可能性の観点から、アプリケーションが利害関係者のニーズを満たすことを確実にするプラクティス。"},{"t":"ソーシング","en":"sourcing","d":"特定のタイプのソースからリソースを計画して取得する活動。ソースの種類には、内部または外部、集中的または分散的、オープン開発または独自開発などがある。"},{"t":"仕様","en":"specification","d":"プロダクト、サービスまたはその他の構成アイテムの特性を記述した文書。"},{"t":"スポンサー","en":"sponsor","d":"サービス消費の予算を承認する役割。"},{"t":"スプリント","en":"sprint","d":"バックログから選択した機能を作成するための、固定された期間（通常は2～4週間）。"},{"t":"ステージ","en":"stage","d":"あるステージから別のステージへ移行するためのトランスフォーメーションを実行する際に行われる、一連のステップ。各ステージ間の移行は双方向になっており、フィードバックに基づいて修正を行うことができる。12ステージがある：「観察」は継続的なものであり、個々のトランスフォーメーションの外側に位置する。「振り返り」は、同样に継続的だが、特定のトランスフォーメーションに固有のステージ。残りのステージは、「開始」「調整」「方向付け」「決定」「明確化」「準備」「提供」「評価」「適応」「統合」である。"},{"t":"利害関係者","en":"stakeholder","d":"組織、プロダクト、サービス、プラクティスまたはその他のエンティティに関心がある、または関与している個人または組織。"},{"t":"利害関係者の役割","en":"stakeholder role","d":"利害関係者（例：ユーザー、顧客、スポンサー、エージェント、プリンシパル、イネーブラー）が発揮する特定のキャパシティ。"},{"t":"標準","en":"standard","d":"共通認識によって確立され、公認団体が承認した文書。その文書の主題となるものについて、広く一般による繰り返しの利用を可能としたり、必須の要件、指針、または特性が規定されたりする。"},{"t":"標準の変更","en":"standard change","d":"リスクが低く、あらかじめ承認された変更。内容が十分理解されており、完全に文書化されているため、実施にあたって再度承認を得る必要はない。"},{"t":"標準関与パターン","en":"standard involvement pattern","d":"標準的な提供物と比較して、デジタルプロダクトやサービスライフサイクルのより後半で体験が形成される一連のインタラクション。"},{"t":"状態（身体的）","en":"state (bodily)","d":"内的な身体状態（緊張、安心、疲労）。"},{"t":"状態（認知）","en":"state (cognitive)","d":"内的な認知状態（信念、判断、期待）。"},{"t":"状態（感情的）","en":"state (emotional)","d":"体験に色合いを与える内的な感情状態。"},{"t":"状態（観察可能）","en":"state (observable)","d":"人々やその環境の継続的な状態。体験を知覚するために用いられ、通常はエビソードと組み合わせて観察される。"},{"t":"ステータス","en":"status","d":"１つのエンティティがある時点で持ち得る特定の状態を説明したもの。"},{"t":"ステップ","en":"step","d":"トランスフォーメーションフローの不可欠な要素であり、そのステップの成果に到達するために必要な、文脈に応じた活動から構成される。すべてのパターンにまたがって24のステップがある：接続、構想、ベースライン設定、定義、マップ、構造化、優先順位付け、範囲設定、解釈、調整、評価、選択、査定、計画、実行(do)、検討、行動、境界設定、設計、実行（run）、精査、要点抽出、安定化、統合。"},{"t":"ステップ 0","en":"step 0","d":"体験の改善につながるステップ。日常業務の一環として継続的に実行することも、機会を洗い出すための集中的な精査として実行することもできる。"},{"t":"戦略","en":"strategy","d":"組織がその存在目的を果たし、ビジョンに向かって進化することを可能にする、一連の意思決定と計画。戦略上の意思決定と計画は、アーキテクチャ、ポジション、およびポートフォリオとして表現することができる。"},{"t":"戦略管理プラクティス","en":"strategy management practice","d":"組織の最終目標を策定し、その最終目標の達成に必要な一連の活動とリソースの割り当てを決めるプラクティス。"},{"t":"サプライヤー","en":"supplier","d":"他の組織が使用する商品の供給およびサービスの提供を担当する組織。"},{"t":"サプライヤー管理プラクティス","en":"supplier management practice","d":"組織のサプライヤーとそのパフォーマンスレベルを適切に管理することで、高品質なプロダクトおよびサービスの提供を支援することを確実にするプラクティス。"},{"t":"サポートチーム","en":"support team","d":"通常運用の維持、ユーザーの要求への対応および特定のプロダクト、サービスまたはその他の構成アイテムに関連するインシデントや問題の解決に責任を負うチーム。"},{"t":"持続可能性","en":"sustainability","d":"プロダクトやサービスが環境保護、社会的進歩、経済成長の要件を満たし、今後も満たし続けることを保証すること。"},{"t":"持続可能な貢献","en":"sustainable contribution","d":"仕事をやり遂げる必要性。多くの場合は雇用の文脈で語られ、別のニーズ―安心して暮らせるウェルビーイングの確保―と相反する（緊張関係にある）ことが多い。"},{"t":"スウォーミング","en":"swarming","d":"さまざまな複雑な課題を解決するための技術。スウォーミングでは、異なる専門分野を持つ複数の人々が協力して作業を行い、どの能力が最も関連性があり必要とされているかが明確になるまで取り組む。"},{"t":"合成キャプチャ信号","en":"synthetic capture signals","d":"構造化されたプローブやシミュレーションによって生成される信号。"},{"t":"システム","en":"system","d":"1つまたは複数の明確に規定された目的を実現するために組織化され維持されている、相互にやりとりする要素の組み合わせ。"},{"t":"システム思考","en":"systems thinking","d":"システムの構成部分が時間の経過とともに他のシステムの状況内で機能し、相互に関連し、相互にやりとりする方法に焦点を当てた分析に対する総合的なアプローチ。"},{"t":"目標値","en":"target value","d":"KPIの望ましいしきい値。仮説の連鎖の一部。"},{"t":"タスク優先度","en":"task priority","d":"他のタスクと比較した、そのタスクの重要度。優先度の高いタスクから優先的に取り組む必要がある。優先度は、バックログ内のすべてのタスクを考慮して定義される。"},{"t":"技術的負債","en":"technical debt","d":"より良いアプローチ（時間がかかる）ではなく、簡単な解決策を今すぐ選ぶことが原因で生じる追加修正作業の暗黙コスト。"},{"t":"三次データ","en":"tertiary data","d":"解釈的なインサイトを、出典となる資料に対して透明性をもって紐づけること。"},{"t":"テスト環境","en":"test environment","d":"プロダクトやサービスなどの構成アイテムをテストするために確立された、管理された環境。"},{"t":"テスト駆動開発（TDD）","en":"Test-Driven Development","d":"開発者が、検証対象となる本番コードを記述する前に、また失敗する自動テストを記述するソフトウェア開発手法。これは「レッド・グリーン・リファクタリング」のループに従う。まず、失敗するテストを作成し（赤）、それをパスさせるのに必要な最小限のコードを書き（緑）、その後、コードを整理する（リファクタリング）。"},{"t":"テスト","en":"testing","d":"システムまたはコンポーネントが特定の条件下で実行され、その結果が観察または記録され、システムのある側面またはコンポーネントの評価が行われる活動。"},{"t":"サードパーティー","en":"third party","d":"組織外の利害関係者。"},{"t":"スループット","en":"throughput","d":"プロダクト、サービス、または他のシステムが一定の時間内に実行する処理の量を表す指標。"},{"t":"安心までの時間（TtR）","en":"Time to Reassurance","d":"不確実な状況から、何が起きたのか、および次に何が起こるのかを把握するまでの時間。"},{"t":"トランザクション","en":"transaction","d":"複数の参加者またはシステム間のやり取りを構成する作業の単位。"},{"t":"移転可能性","en":"transferability","d":"他の文脈へのエビデンスの適用可能性を判断するために用いられる基準。"},{"t":"トランスフォーメーション","en":"transformation","d":"オーナーやスポンサーが成功させる必要のある、多くの活動から成り、通常は複数のワークストリームに分割される単一のトランスフォーメーション・プログラム、プロジェクト、または取り組み。"},{"t":"透明性","en":"transparency","d":"影響を受ける人々に対する作業内容と意思決定の明瞭さ。"},{"t":"トライアングレーション","en":"triangulation","d":"より信頼性の高い判断を下すために、互いに独立した異質なシグナルを組み合わせること。"},{"t":"信頼","en":"trust","d":"他者の行動を自分では監視したりコントロールしたりできない状況でも、その他者が自分にとって重要なことをしてくれると期待するがゆえに、自らをその他者の行動に対して脆弱な立場に置くことをいとわないこと。しばしば、能力・完全性・善意といった観点で表現される。"},{"t":"ユースケース","en":"use case","d":"機能要件を定義し、テストを設計するために用いられる現実的な実践シナリオ。"},{"t":"ユーザー","en":"user","d":"サービスを利用する役割。"},{"t":"ユーザー体験（UX）","en":"User Experience (UX)","d":"サービスユーザーによって認識される、サービスおよびサービスプロバイダーとの実務的および感情的なやり取りの積み重ね。"},{"t":"ユーザー問い合せ","en":"user query","d":"ユーザーまたはユーザー代表によって開始される、サービスデスクとのやり取り（例えば、電話の問い合せやチャット）。ユーザー問い合せによって、インシデントまたはサービス要求が記録されることもある。"},{"t":"有用性","en":"utility","d":"特定のニーズを満たすためにプロダクトまたはサービスによって提供される機能。有用性は「サービスが何を行うか」であると言いかえられ、サービスが「目的に適しているか（fit for purpose）」を判断するために使用できる。サービスが有用性を持つためには、サービス消費者のパフォーマンスをサポートするか、またはサービス消費者の制約を取り除くか、いずれかをしなければならない。多くのサービスは、その両方を行っている。"},{"t":"有用性要件","en":"utility requirements","d":"顧客によって定義され、特定のプロダクトに固有の機能要件。"},{"t":"検証","en":"validation","d":"提案されたプロダクトおよびサービスの設計が合意された要件を満たしていることを確認し、次のライフサイクルステージに向けた受け入れ基準を確立する活動。"},{"t":"価値","en":"value","d":"ある事柄について認識されている利益、有用性、および重要性。"},{"t":"バリューチェーン","en":"value chain","d":"プロダクトの提供またはサービスを通じて価値を実現する一連の活動全体。"},{"t":"バリューチェーン活動","en":"value chain activities","d":"組織がデジタルプロダクトとサービスをそのライフサイクルを通じて管理するために行う活動。これらの活動のそれぞれは、いくつかの管理プラクティスによって可能になり、サポートされる。"},{"t":"価値の共創","en":"value co-creation","d":"サービス提供者、消費者およびその他のステークホルダーが、望ましい成果を達成するために、サービス関係全体にわたって資源、能力、行動を組み合わせ、製品やサービスの利用を通じて価値を共同で創出する協働的なプロセス。"},{"t":"バリューストリーム","en":"value stream","d":"組織がプロダクトやサービスを作成し、サービス消費者へ提供するために用いる一連のステップ。"},{"t":"バリューストリームおよびプロセス","en":"value streams and processes","d":"プロダクトおよびサービスマナジメントの４つの側面の１つ。合意された目標を達成するために必要な活動、ワークフロー、管理策、および手順を定義する。"},{"t":"価値観","en":"values","d":"組織の構成員が共有している信念や規範であり、個人の行動や相互作用のあり方、意思決定の方法、そして個人の目標や動機が組織的な目的や目標とどのように整合されるかに影響を与えるもの。"},{"t":"ビジョン","en":"vision","d":"組織が将来どのような姿になりたいかという、明確に定義された将来像。"},{"t":"ウェイトタイム","en":"wait time","d":"バリューストリームの各ステップ間で待機している時間。"},{"t":"ウォーターフォール手法","en":"waterfall method","d":"各開発フェーズごとに明確な目的を持ち、工程が直線的かつ順序どおりに進行する開発アプローチ。"},{"t":"保証（ワランティ）","en":"warranty","d":"プロダクトまたはサービスが合意された要件を満たすことに対する確約。保証は「サービスがどのように機能するか」と要約でき、サービスが「使用に適しているか（fit for use）」かどうかを判断するために用いることができる。保証は、多くの場合、サービスレベルに関する事項であり、サービス消費者のニーズに合わせて調整されている。これは正式な合意に基づく場合もあれば、マーケティングメッセージやブランドイメージに基づく場合もある。保証では通常、サービスの可用性、キャパシティ、セキュリティ水準、継続性といった領域が対象とされる。定義され合意されたすべての条件が満たされている場合、そのサービスは十分な信頼性、すなわち「保証」を提供していると言える。"},{"t":"保証要件","en":"warranty requirements","d":"通常、主要な利害関係者や他のプラクティスからのインプットとして収集される非機能要件。"},{"t":"作業手順","en":"work instruction","d":"ある活動を実行するために従うべき詳細な手順の記述。"},{"t":"ワークアラウンド","en":"workaround","d":"インシデントまたは問題の影響を、まだ完全な解決策が利用できていない状況で軽減または排除するためのソリューション。一部のワークアラウンドは、インシデントの発生可能性を低減する。"},{"t":"要員およびタレント管理","en":"workforce and talent management practice","d":"組織が、自社の事業目標を支えるために、適切なスキルと知識を備えた人材を、適切な役割に配置できていることを確実にするためのプラクティス。"}];
function renderGlossary(items){items=items||GLOSSARY;var h='';for(var i=0;i<items.length;i++){var g=items[i];h+='<div class="gi"><div class="gt">'+esc(g.t)+(g.en?'<span class="ge">'+esc(g.en)+'</span>':'')+'</div><div class="gd">'+esc(g.d)+'</div></div>';}document.getElementById('glossaryList').innerHTML=h;document.getElementById('glossaryCount').textContent=items.length+' / '+GLOSSARY.length+' 語を表示';}
function filterGlossary(q){q=(q||'').trim().toLowerCase();if(!q){renderGlossary();return;}var r=GLOSSARY.filter(function(g){return (g.t+' '+g.en+' '+g.d).toLowerCase().indexOf(q)>=0;});renderGlossary(r);}
function toggleGlossary(){var p=document.getElementById('glossaryPanel');var m=document.getElementById('home');if(p.style.display==='block'){p.style.display='none';m.style.display='';}else{p.style.display='block';m.style.display='none';document.getElementById('glossarySearch').value='';renderGlossary();window.scrollTo(0,0);}}
function show(v){var _gp=document.getElementById("glossaryPanel");if(_gp){_gp.style.display="none";}document.getElementById("home").style.display="";document.getElementById('home').classList.toggle('hide',v!=='home');document.getElementById('quiz').classList.toggle('hide',v!=='quiz');document.getElementById('result').classList.toggle('hide',v!=='result');}
function render(){
const it=state.items[state.cur];const q=ALL_QUESTIONS[it.qi];
document.getElementById('progBar').style.width=(state.cur/state.items.length*100)+'%';
document.getElementById('qnum').textContent='Q '+(state.cur+1)+' / '+state.items.length;
document.getElementById('qmode').textContent=MODE_LABEL[state.mode]||'';
document.getElementById('qtext').textContent=q.t;
const cc=document.getElementById('choices');cc.innerHTML='';
it.co.forEach(function(orig,p){
const b=document.createElement('button');b.className='choice';
b.innerHTML='<span class="lab">'+LABELS[p]+'</span>'+esc(q.c[orig]);
if(it.picked!==null){b.disabled=true;if(orig===q.a)b.classList.add('correct');else if(p===it.picked)b.classList.add('wrong');}else{b.onclick=function(){pick(p);};}
cc.appendChild(b);
});
const ex=document.getElementById('expl');
if(it.picked!==null){let h='<div class="expl"><h4>解説'+(q.s?'（評価基準 '+q.s+'／原文 第'+q.n+'問）':'')+'</h4>';it.co.forEach(function(orig,p){const ok=(orig===q.a);h+='<div class="row '+(ok?'ok':'ng')+'"><span class="lab">'+LABELS[p]+'.</span>'+esc(q.e[orig])+'</div>';});h+='</div>';ex.innerHTML=h;}else{ex.innerHTML='';}
document.getElementById('prevBtn').disabled=state.cur===0;
const nb=document.getElementById('nextBtn');nb.textContent=(state.cur===state.items.length-1)?'結果を見る':'次へ →';nb.disabled=it.picked===null;
}
function pick(p){const it=state.items[state.cur];if(it.picked!==null)return;it.picked=p;save();render();}
function nextQ(){if(state.cur<state.items.length-1){state.cur++;render();window.scrollTo(0,0);}else{finish();window.scrollTo(0,0);}}
function prevQ(){if(state.cur>0){state.cur--;render();window.scrollTo(0,0);}}
function finish(){let correct=0;state.items.forEach(function(it){const q=ALL_QUESTIONS[it.qi];if(it.picked!==null&&it.co[it.picked]===q.a)correct++;});const total=state.items.length;const pct=Math.round(correct/total*100);const pass=pct>=PASS;document.getElementById('badge').innerHTML='<span class="badge '+(pass?'pass':'fail')+'">'+(pass?'合格':'不合格')+'</span>';document.getElementById('scoreText').textContent=pct+'%';document.getElementById('scoreSub').textContent=total+'問中 '+correct+'問正解（合格ライン'+PASS+'%）';state.done=true;save();show('result');}
function reviewWrong(){const wrong=state.items.filter(function(it){const q=ALL_QUESTIONS[it.qi];return!(it.picked!==null&&it.co[it.picked]===q.a);});if(wrong.length===0){alert('全問正解です！復習する問題はありません。');return;}state={mode:'review',items:wrong.map(function(it){return{qi:it.qi,co:shuffle([0,1,2,3]),picked:null};}),cur:0};save();show('quiz');render();window.scrollTo(0,0);}
function quitQuiz(){clearS();state=null;show('home');checkResume();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function clearS(){try{localStorage.removeItem(KEY);}catch(e){}}
function loadS(){try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}}
function checkResume(){const s=loadS();const box=document.getElementById('resume');if(s&&s.items&&!s.done){const answered=s.items.filter(function(it){return it.picked!==null;}).length;document.getElementById('resumeText').textContent='中断中の'+(MODE_LABEL[s.mode]||'')+'があります（'+answered+'/'+s.items.length+'問回答済み）';box.classList.remove('hide');}else{box.classList.add('hide');}}
function resumeQuiz(){const s=loadS();if(s){state=s;document.getElementById('resume').classList.add('hide');if(s.done){finish();}else{show('quiz');render();}window.scrollTo(0,0);}}
function discardResume(){clearS();document.getElementById('resume').classList.add('hide');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
checkResume();
</script>
